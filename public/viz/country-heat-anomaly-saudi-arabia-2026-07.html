  export: {
    align: { anchor: "start", inset: PLOT_X, insetRight: PLOT_RIGHT },
    keysInline: true,
    barW: LEGEND_BAR_W,
    // The page runs the standfirst across the full measure, in one column, so
    // the download wraps it to the same width rather than to the narrower
    // reading measure a centred chart would use.
    description: { width: "measure", columns: 1 },
    // The headline is set larger here than the base theme's, so the rhythm
    // under it has to grow with it or the subtitle lands in its descenders.
    titleY: 46, subtitleY: 76, titleLeading: 46,

    // The same slow rhythm the page keeps. A download is one picture rather
    // than a scroll, so the margin around it and the gaps between its sections
    // are the only thing separating three charts from a contact sheet.
    pad: 76, panelLeadGap: 76, panelGap: 60, noteGap: 34, sourceGap: 56
  }
};

// ---------------------------------------------------------------- how it looks

// A display headline, and a slightly larger reading size than the base theme's:
// this page is read as an article rather than scanned as a dashboard, and 14px
// of running text beside a chart is a caption, not an argument.
const THEME = {
  type: { size: { title: 42, titleCompact: 28, body: 15 } }
};

// ---------------------------------------------------------------- how it counts

// A real minus sign, not a hyphen: at the size these labels are read a hyphen
// beside a digit looks like a dash between two numbers.
const SIGNED_MINUS = "−";
const DEGREE = "°";

const signOf = (r) => (r > 0 ? "+" : r < 0 ? SIGNED_MINUS : "");

// A measured departure always keeps its decimal, even when it rounds to a whole
// number: "+2.4" beside "−1" reads as two different precisions of the same
// measurement, and rounding 0.4 away to nothing would delete the finding.
function formatSigned(v) {
  const r = Math.round(v * 10) / 10;
  return signOf(r) + Math.abs(r).toFixed(1) + DEGREE;
}

// Gridlines and ramp ticks drop it — they are marks on a scale, not readings,
// and "+3" reads faster than "+3.0" at the size an axis label is set.
function formatSignedWhole(v) {
  const r = Math.round(v * 10) / 10;
  const mag = Math.abs(r);
  return signOf(r) + (Number.isInteger(r) ? String(mag) : mag.toFixed(1)) + DEGREE;
}

const FORMAT = makeFormat({
  value: (v) => v.toFixed(1) + DEGREE,
  valueWhole: (v) => v + DEGREE,
  valueRange: (lo, hi) => Math.round(lo) + "–" + Math.round(hi) + DEGREE,
  // The legend's ramp is a departure, so its ticks carry a sign: a bare "3" on
  // a diverging scale is ambiguous in a way "+3" is not.
  num: formatSignedWhole,
  signed: formatSigned,
  signedWhole: formatSignedWhole,
  // Bare day numbers. The month is in the headline, so repeating it under every
  // seventh bar spends width and says nothing.
  key: (k) => String(k.getDate())
});

// ---------------------------------------------------------------- what is true

// Prose has to be able to lose an argument with the chart beside it, so every
// sentence on this page is written from the same model the panels drew and no
// number below is typed by hand. These are the facts the notes may draw on;
// anything they cannot supply is a sentence this chart does not get to make.
//
// Cached against the model, which is frozen and replaced whole on every load —
// so this runs once per load however many notes ask for it, and a stale entry
// is not reachable from the model that replaced it.
const FACT_CACHE = new WeakMap();

function readFacts(m) {
  let facts = FACT_CACHE.get(m);
  if (!facts) FACT_CACHE.set(m, (facts = computeFacts(m)));
  return facts;
}

function computeFacts(m) {
  const cities = m.facets;

  let peak = null;          // the hottest single reading anywhere in the month
  let widest = null;        // and the day that sat furthest from its own normal
  let hotDays = 0, dayCount = 0;

  for (const city of cities) {
    for (const d of city.series) {
      dayCount += 1;
      if (d.cHigh > 0) hotDays += 1;
      if (!peak || d.high > peak.value) {
        peak = { value: d.high, key: d.key, city: city.subject.name };
      }
      if (!widest || Math.abs(d.cHigh) > Math.abs(widest.value)) {
        widest = { value: d.cHigh, key: d.key, city: city.subject.name };
      }
    }
  }

  // How far a city's nights ran against its own normal nights, next to how far
  // its days ran against its own normal days. Positive means the night end of
  // the day moved further towards hot than the day end did — which is true
  // whether the month was hotter or cooler overall, and is why the sentences
  // below say "hotter against normal" rather than "above normal".
  const gapOf = (f) => f.nightAnom - f.dayAnom;

  return {
    cities,
    hotter: cities.filter((f) => f.meanAnom > 0),
    cooler: cities.filter((f) => f.meanAnom < 0),
    nightsAhead: cities.filter((f) => gapOf(f) > 0),
    // Averaged over the cities that actually went that way, not over all of
    // them: a mean across both directions is a number that cancels itself, and
    // "by 0.1° on average" would be reporting the cancellation rather than
    // either group's gap.
    meanGapAmong: (group) => d3.mean(group, (f) => Math.abs(gapOf(f))) || 0,
    widestGap: cities.reduce((a, f) => (Math.abs(gapOf(f)) > Math.abs(gapOf(a)) ? f : a)),
    gapOf,
    // Top of the ranking to the bottom of it: one month, one country, two
    // different answers, and the distance between them is a finding of its own.
    spread: m.warmest.meanAnom - m.coolest.meanAnom,
    peak, widest, hotDays, dayCount
  };
}

// ---------------------------------------------------------------- what it says

// The month as known before a load resolves — for the headline, which is
// written before the data arrives, and for the empty state, where it never does.
const configMonthKey = (ctx) =>
  ctx.config.month || latestCompleteMonth(ctx.config.monthSettleDays);

function configMonthLabel(ctx) {
  const key = configMonthKey(ctx);
  return /^\d{4}-\d{2}$/.test(key) ? monthKeyLabel(key) : String(key);
}

// Small counts are spelled out and measurements never are, which is the
// ordinary rule for running text: "four of the six cities" reads as a sentence,
// "4 of the 6 cities" reads as a table — while "+2.4°" is the thing the reader
// is meant to compare and has to stay a figure.
const COUNT_WORDS = ["no", "one", "two", "three", "four", "five", "six", "seven",
  "eight", "nine", "ten", "eleven", "twelve"];
const countWord = (n) => (n < COUNT_WORDS.length ? COUNT_WORDS[n] : String(n));
const capitalise = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const cityWord = (n) => (n === 1 ? "city" : "cities");

// "Four of the six cities", but "All six cities" and "None of the six cities" —
// a count phrase built by concatenation alone reads as "No of the six cities"
// exactly once in every twenty countries, which is the sort of sentence that
// makes a reader stop trusting the rest of the page.
function outOf(count, n) {
  if (count === n) return "All " + countWord(n) + " " + cityWord(n);
  if (count === 0) return "None of the " + countWord(n) + " " + cityWord(n);
  return countWord(count) + " of the " + countWord(n) + " " + cityWord(n);
}

// A magnitude with no sign, for a sentence that has already given the direction
// in words: "1.2° above normal", not "+1.2° above normal", which says it twice.
const magnitude = (v) => Math.abs(Math.round(v * 10) / 10).toFixed(1) + DEGREE;

const dayLabel = (key, m) => key.getDate() + " " + m.month.name;

// The one sentence the page exists to deliver, in the shape the month came out
// in. Three shapes, because "every city was hotter" and "four were hotter and
// two were cooler" are different findings and only one of them is ever true.
function findingSentence(m, f) {
  const n = f.cities.length;
  const place = FORMAT.subjectTitle(m.subject);

  if (!f.cooler.length) {
    return "All " + countWord(n) + " of the largest cities in " + place
      + " ran hotter than their own " + m.month.name + " normal, "
      + m.warmest.subject.name + " furthest at " + FORMAT.signed(m.warmest.meanAnom) + ".";
  }
  if (!f.hotter.length) {
    return "All " + countWord(n) + " of the largest cities in " + place
      + " ran cooler than their own " + m.month.name + " normal, "
      + m.coolest.subject.name + " furthest at " + FORMAT.signed(m.coolest.meanAnom) + ".";
  }
  const own = f.hotter.length === 1 ? "its own " : "their own ";
  return capitalise(countWord(f.hotter.length)) + " of the " + countWord(n)
    + " largest cities in " + place + " ran hotter than " + own + m.month.name
    + " normal and " + countWord(f.cooler.length) + " ran cooler. "
    + m.warmest.subject.name + " sat furthest from it, at "
    + FORMAT.signed(m.warmest.meanAnom) + ".";
}

const COPY = {
  title: (subject, ctx) => "How unusual was " + configMonthLabel(ctx)
    + " across " + FORMAT.subjectTitle(subject) + "?",

  loading: (label) => (label ? "Loading " + label + "…" : "Loading…"),

  subtitle: (m) => m.month.label + " · " + m.facets.length + " cities · against the "
    + m.bandYears.fromYear + "–" + m.bandYears.toYear + " average for " + m.month.name,

  // The standfirst, in two halves. `lead` is the finding and is written from
  // the model; `howToRead` is the one thing a reader has to accept before any
  // mark on the page means anything. The shell joins them, and --caption
  // replaces only the second — so a custom description cannot delete the
  // finding, and a download carries both.
  lead: (m) => findingSentence(m, readFacts(m)) + " ",

  howToRead: (m) =>
    "Normal, here and in every panel below, means that same city's own average "
    + "for the same calendar month across " + m.bandYears.fromYear + "–"
    + m.bandYears.toYear + ". Nothing on this page is a temperature on its own: "
    + "every mark is a distance from that.",

  panels: {
    ranked: {
      aria: (subject) => "Cities in " + FORMAT.subjectTitle(subject)
        + " ranked by how far the month's mean temperature sat from the ten-year normal",
      cap: "How far the month sat from normal",
      above: "hotter than normal",
      below: "cooler than normal",
      baseline: "normal"
    },
    strips: {
      aria: (subject) => "Daily minimum and maximum temperature for each city in "
        + FORMAT.subjectTitle(subject)
        + ", one stacked row per city on a shared scale, coloured by distance from normal",
      cap: "Every day, low to high"
    },
    paired: {
      aria: (subject) => "Night-time and daytime temperature anomalies compared, "
        + "one row per city in " + FORMAT.subjectTitle(subject),
      cap: "Nights against days",
      keyA: "Nights (lows)",
      keyB: "Days (highs)",
      baseline: "normal"
    }
  },

  legend: {
    cap: "Each day's distance from the normal for the same month (" + DEGREE + "C)",
    medHigh: "Median high",
    medLow: "Median low",
    band: (m) => m.bandYears.fromYear + "–" + m.bandYears.toYear + " normal"
  },

  search: {
    label: "Country",
    placeholder: "Search for a country…",
    matches: (n) => n + " match" + (n === 1 ? "" : "es"),
    none: "No matching country",
    failed: "Search unavailable"
  },

  month: { label: "Month" },

  empty: {
    head: "No data",
    body: (subject, reason) =>
      "Couldn't load temperature data for " + subject.name
      + " (" + (reason || "request failed") + "). "
      + "This chart draws only real observations from open-meteo.com, so there is nothing "
      + "to show until that request succeeds — try another country or another month, "
      + "or reload once it is reachable."
  },

  dataSource: "Weather data: Open-Meteo (ERA5 reanalysis). City list: GeoNames.",
  signature: (sig) => "Created by " + sig.name + " · " + sig.url,

  exportTitle: (title) => title + " — monthly temperature anomaly by city",
  pngFailed: "PNG export couldn't rasterise the chart here. Use the SVG download instead.",

  // ---- the article ----
  //
  // One entry per note mount. Each returns blocks, not markup: core/app.js
  // places them and owns the type. They live here beside the rest of the words
  // on purpose — a sentence about the ranking and the caption drawn over the
  // ranking have to be re-read together or they drift apart.
  //
  // A note beside a panel is written to a height budget: it must come out
  // shorter than the panel, or the section reads as prose with a picture in the
  // margin rather than a graphic with a note beside it. At the 340px column
  // that is roughly 45 characters a line against a 390px panel — about two
  // short paragraphs and three figures, and nothing that carries a country
  // name, whose length is nobody's layout decision. The wide section in the
  // middle has no such limit; it sits above its panel, not beside it.
  notes: {

    rank: (m) => {
      const f = readFacts(m);
      const n = f.cities.length;
      const mixed = f.hotter.length > 0 && f.cooler.length > 0;
      return [
        {
          kind: "head",
          text: mixed
            ? capitalise(countWord(n)) + " cities, " + countWord(n) + " answers"
            : capitalise(countWord(n)) + " cities, one direction"
        },
        {
          kind: "p",
          text: "Each bar is a city's mean temperature for " + m.month.label
            + " minus its own " + m.month.name + " average over " + m.bandYears.fromYear
            + "–" + m.bandYears.toYear + ". Right of the line is hotter than usual "
            + "there; left is cooler."
        },
        {
          kind: "p",
          text: "Not a ranking by heat: " + m.warmest.subject.name
            + " need not be the hottest city here, only the furthest from what "
            + m.month.name + " normally does."
        },
        {
          kind: "stats",
          items: [
            {
              label: "Furthest above normal",
              note: m.warmest.subject.name,
              value: FORMAT.signed(m.warmest.meanAnom)
            },
            {
              label: f.cooler.length ? "Furthest below normal" : "Closest to normal",
              note: m.coolest.subject.name,
              value: FORMAT.signed(m.coolest.meanAnom)
            },
            { label: "Range across cities", value: magnitude(f.spread) }
          ]
        }
      ];
    },

    daily: (m) => {
      const f = readFacts(m);
      return [
        { kind: "head", text: "A monthly average hides the month" },
        {
          kind: "p",
          text: "Each row below is one city's " + m.month.label + ", one bar a day, "
            + "running from the night's low to the day's high. Height is the temperature. "
            + "Colour is that day's distance from normal, and the pale band behind the row "
            + "is normal itself — so a bar sitting clear of the band is a day that never "
            + "touched its usual range."
        },
        {
          kind: "p",
          text: f.hotDays + " of the " + f.dayCount + " city-days in this month reached a "
            + "higher maximum than usual. The furthest from normal was " + f.widest.city
            + " on " + dayLabel(f.widest.key, m) + ", " + magnitude(f.widest.value)
            + (f.widest.value < 0 ? " below" : " above") + " that city's normal high. "
            + "The hottest reading anywhere in the month was " + FORMAT.value(f.peak.value)
            + " in " + f.peak.city + " on " + dayLabel(f.peak.key, m) + "."
        }
      ];
    },

    split: (m) => {
      const f = readFacts(m);
      const n = f.cities.length;
      const ahead = f.nightsAhead.length;
      const nightsWon = ahead * 2 > n;
      const daysWon = ahead * 2 < n;
      return [
        {
          kind: "head",
          text: nightsWon ? "The nights moved further"
            : daysWon ? "The days moved further"
              : "Both ends moved together"
        },
        {
          kind: "lede",
          text: daysWon
            ? outOf(n - ahead, n) + " ran hotter against normal days than normal nights, "
              + "by " + magnitude(f.meanGapAmong(f.cities.filter((c) => f.gapOf(c) <= 0)))
              + " on average."
            : outOf(ahead, n) + " ran hotter against normal nights than normal days, "
              + "by " + magnitude(f.meanGapAmong(f.nightsAhead)) + " on average."
        },
        {
          kind: "p",
          text: "The diamond is the mean overnight low against normal lows; the circle "
            + "the mean daytime high against normal highs."
        },
        {
          kind: "p",
          text: "Which end moves matters: a day that sheds its heat overnight is a "
            + "different event from one that does not."
        },
        {
          kind: "stats",
          items: [
            {
              label: "Widest night–day gap",
              note: f.widestGap.subject.name,
              value: magnitude(f.gapOf(f.widestGap))
            },
            { label: "Nights ran hotter in", value: ahead + " of " + n }
          ]
        }
      ];
    }
  }
};

// ---------------------------------------------------------------- controls

// The month is not the subject — the country is — so it cannot ride on the
// subject picker. It is a second question asked about the same subject, which
// is exactly what the shell's control hook is for.
const MONTH_CONTROL = {
  mount: "monthpicker",

  create(el, { ctx, reload }) {
    // Resolved here, before the first load: the picker has to show the month
    // the chart is about and the adapter has to load the month the picker
    // shows. Left null, the two would answer the question separately.
    ctx.config.month = configMonthKey(ctx);

    const options = recentMonths(ctx.config.monthChoices, ctx.config.monthSettleDays);
    // A month pinned with --month can be older than the picker's window.
    // Offering it keeps the control honest about what is on screen, rather than
    // naming one month while the chart draws another.
    if (!options.some((o) => o.value === ctx.config.month)) {
      options.push({ value: ctx.config.month, label: configMonthLabel(ctx) });
      options.sort((a, b) => d3.descending(a.value, b.value));
    }

    return OptionPicker(el, {
      id: "month-select",
      label: COPY.month.label,
      options,
      value: ctx.config.month,
      onSelect(value) {
        ctx.config.month = value;
        reload();
      }
    });
  }
};

// ---------------------------------------------------------------- the chart

const chart = {
  id: "country-heat-anomaly",
  config: CONFIG,
  theme: THEME,
  layout: LAYOUT,
  format: FORMAT,
  copy: COPY,
  adapter: OpenMeteoMonthAdapter,
  buildModel: buildMonthAnomalyModel,
  controls: [MONTH_CONTROL],

  // Declaration order is stacking order in the download; on the page each panel
  // is placed by the section that holds it. Either way the sequence is the
  // same: the ranked answer first, then the month it came out of, then the one
  // split worth making inside it.
  panels: [
    // The bar's length already carries the size of the departure, on an axis
    // scaled to monthly means. Colouring it off the ramp as well would measure
    // the same number twice against a scale built for daily swings — so the
    // fill reports only which side of normal the month fell on.
    RankedDeviationBars({
      id: "ranked",
      value: (f) => f.meanAnom,
      fill: (v, m) => (v < 0 ? m.ramp.cool : m.ramp.warm)
    }),
    StackedRangeStrips({ id: "strips" }),
    PairedDeviationDots({ id: "paired", a: (f) => f.nightAnom, b: (f) => f.dayAnom })
  ],

  // The prose, mounted beside the panel it reads. Every block is built from the
  // model the panels have just drawn, so a sentence cannot outlive a change in
  // the data that contradicts it.
  //
  // `panel` and `side` are for the download, which has no page grid to inherit:
  // they say which graphic a note belongs to and which side of it the page put
  // it on, so the file comes out laid out like the article rather than as
  // panels with a hole beside them. A note that declares no `panel` is page
  // furniture and does not travel into a download.
  notes: [
    { mount: "note-rank", blocks: COPY.notes.rank, panel: "ranked", side: "end" },
    {
      mount: "note-daily", blocks: COPY.notes.daily,
      panel: "strips", side: "above", columns: 1
    },
    { mount: "note-split", blocks: COPY.notes.split, panel: "paired", side: "start" }
  ],

  // Hidden with the panels when a load fails: a numbered section heading over
  // an empty grid claims there is an argument on the page when there is not.
  regions: ["sec-rank", "sec-daily", "sec-split"],

  model: {
    tickStep: 5,
    // Every five degrees, plus normal — see buildMonthAnomalyModel.
    anomAxisStep: 5,
    anomTickStep: 1,
    interpolate: d3.interpolateRdYlBu,
    invert: true
  }
};

/* ===== generated wiring ===== */
Object.assign(chart.config, {"subject":"Saudi Arabia","month":"2026-07"});
createApp(chart).init();

})();
</script>
</body>
</html>
