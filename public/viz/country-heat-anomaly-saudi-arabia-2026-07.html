  // The requested pixel density, or as much of it as a canvas will actually
  // take. Past a browser's limits canvas allocation fails silently — a blank
  // image or a null blob, no exception — so the ceiling is respected here
  // rather than discovered in a downloaded file. Never below 1: a downsampled
  // PNG is worse than the SVG it came from.
  function pngScale(width, height) {
    const E = ctx.layout.export;
    return Math.max(1, Math.min(
      E.pngScale,
      E.pngMaxSide / width,
      E.pngMaxSide / height,
      Math.sqrt(E.pngMaxPixels / (width * height))
    ));
  }

  function download(href, name) {
    const a = document.createElement("a");
    a.href = href; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  return {
    setLegend(model) { legendModel = model; },
    // Only a note tied to a panel reaches a download; a page-only one — the
    // kicker over the headline — declares no panel and is skipped.
    setNotes(placed) { notes = placed.filter((n) => n.panel); },
    build,

    downloadSVG(subject) {
      const { node } = build();
      const xml = new XMLSerializer().serializeToString(node);
      const url = URL.createObjectURL(new Blob([XML_DECL + xml], { type: "image/svg+xml" }));
      download(url, filename(subject, "svg"));
      URL.revokeObjectURL(url);
    },

    downloadPNG(subject) {
      const { node, width, height } = build();
      const img = new Image();
      img.onload = () => {
        const scale = pngScale(width, height);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        const c = canvas.getContext("2d");
        c.scale(scale, scale);
        c.fillStyle = ctx.theme.color.paper;
        c.fillRect(0, 0, width, height);
        c.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          download(url, filename(subject, "png"));
          URL.revokeObjectURL(url);
        }, "image/png");
      };
      img.onerror = () => alert(ctx.copy.pngFailed);
      img.src = dataUri(node);
    }
  };
}

/* ===== core/app.js ===== */
// The shell: the only stateful part of a chart. Owns the current subject, the
// in-flight request, and the wiring between components.
//
// A chart definition (charts/<id>/chart.js) is data:
//   { id, config, theme, layout, copy, format, adapter, panels, model,
//     controls, notes, regions }
//
// createApp resolves it into a frozen ctx and hands the same object to every
// component, so nothing reaches for a global and two charts can run different
// themes without either knowing the other exists.
//
// Four sections: the shell itself, then the page furniture, legend and subject
// picker it drives. They were separate files; nothing else ever imported them.






// ---------------------------------------------------------------- shell

function createApp(chart) {
  const theme = makeTheme(chart.theme);
  const format = makeFormat(chart.format);

  // Each panel contributes its geometry defaults under its layout key, so a
  // chart states only what it moves.
  const layout = makeLayout(chart.layout);
  for (const p of chart.panels) {
    layout[p.layoutKey] = deepMerge(p.defaults || {}, layout[p.layoutKey]);
  }

  const ctx = Object.freeze({
    id: chart.id,
    config: chart.config,
    theme, layout, format,
    copy: chart.copy,
    panels: chart.panels,
    // Prose the chart writes from its own data, and the page regions that
    // exist only while there is a chart to put in them. Both default to
    // nothing, so a chart that is only panels declares neither.
    notes: Object.freeze(chart.notes || []),
    regions: Object.freeze(chart.regions || []),
    style: makeStyle(theme, layout)
  });

  const adapter = chart.adapter;
  const exporter = makeExporter(ctx);
  // A chart may build a different shape of model — small multiples need one
  // shared domain across many series, which a single range model cannot hold.
  const buildModel = chart.buildModel || buildRangeModel;

  let subject = null;
  let inflight = null;
  let picker = null;
  let controls = [];

  // Sized before the first fetch, so the page reserves the chart height while
  // loading instead of jumping when data lands.
  function sizeCanvas(p) {
    const c = ctx.layout.canvas[p.id];
    if (!c) throw new Error('No layout.canvas entry for panel "' + p.id + '"');
    Dom.byId(p.id).setAttribute("viewBox", "0 0 " + c.w + " " + c.h);
  }

  function sizeCanvases() {
    for (const p of chart.panels) sizeCanvas(p);
  }

  // Every control is disabled together while a load is in flight: two of them
  // changed in the time one request takes would leave the page showing the
  // result of whichever landed last, not whichever was asked for last.
  function setControlsBusy(busy) {
    if (picker) picker.setBusy(busy);
    for (const c of controls) if (c.setBusy) c.setBusy(busy);
  }

  function setExportsEnabled(on) {
    Dom.byId("downloadBtn").disabled = !on;
    Dom.byId("downloadPngBtn").disabled = !on;
  }

  function render(model) {
    EmptyState.hide(ctx);
    Header.render(model, ctx);
    exporter.setLegend(Legend.render(model, ctx));
    for (const p of chart.panels) {
      // A panel whose size depends on the data — a small-multiples stack has
      // one row per subject — restates it here. Written back to layout.canvas
      // rather than only onto the element, because the exporter measures from
      // that entry and would otherwise lay out against the boot-time height.
      if (p.measure) Object.assign(ctx.layout.canvas[p.id], p.measure(model, ctx));
      sizeCanvas(p);
      p.render(d3.select("#" + p.id), model, ctx);
    }
    exporter.setNotes(Notes.render(model, ctx));
    Footer.render(ctx);
  }

  async function load(next) {
    // Supersede any request still running: switching subject quickly must not
    // let an earlier response overwrite a later one.
    if (inflight) inflight.abort();
    const ctrl = new AbortController();
    inflight = ctrl;

    subject = next;
    Header.setLoading(next.name, ctx);
    setExportsEnabled(false);
    setControlsBusy(true);

    try {
      // Passed through whole, so an adapter can return { series, band } or
      // { facets } without the shell knowing which shape it is.
      const data = await adapter.load(next, { signal: ctrl.signal, ctx });
      if (ctrl.signal.aborted) return;

      render(buildModel({ ...data, subject: next, ...(chart.model || {}) }));
      setExportsEnabled(true);
    } catch (e) {
      if (e.name === "AbortError" || ctrl.signal.aborted) return;
      EmptyState.show(next, e.message, ctx);
    } finally {
      if (inflight === ctrl) inflight = null;
      setControlsBusy(false);
    }
  }

  async function start(query) {
    Header.setLoading(query, ctx);
    setExportsEnabled(false);
    try {
      const resolved = await adapter.resolve(query, { ctx });
      if (picker) picker.setValue(ctx.format.subjectLabel(resolved));
      await load(resolved);
    } catch (e) {
      EmptyState.show({ name: query, sublabel: "" }, e.message, ctx);
    }
  }

  return {
    init() {
      ctx.style.install();
      sizeCanvases();

      const mount = Dom.byId("subjectpicker");
      if (adapter.search && mount) {
        picker = SubjectPicker(mount, { adapter, onSelect: load, ctx });
      } else if (mount) {
        mount.remove();     // no search means no picker, not a dead control
      }

      // A chart may add controls of its own beside the subject picker: a
      // period, a variant, a threshold. They get `reload` rather than a
      // subject, because what they change is something the adapter reads at
      // load time — the subject has not moved, only the question asked about
      // it. A missing mount is a startup error, not a control that quietly
      // never appears.
      for (const control of chart.controls || []) {
        const el = Dom.byId(control.mount);
        if (!el) throw new Error('No element "#' + control.mount + '" for a declared control');
        const handle = control.create(el, { ctx, reload() { if (subject) load(subject); } });
        if (handle) controls.push(handle);
      }

      // Closing the picker before an export is belt-and-braces: the exporter
      // never clones #controls, so the menu cannot reach a download anyway.
      // This just avoids exporting while a panel floats over the chart.
      const exportWith = (fn) => () => {
        if (!subject) return;
        if (picker) picker.close();
        fn(subject);
      };
      Dom.byId("downloadBtn")
        .addEventListener("click", exportWith((s) => exporter.downloadSVG(s)));
      Dom.byId("downloadPngBtn")
        .addEventListener("click", exportWith((s) => exporter.downloadPNG(s)));

      // ?subject= always works; a chart may claim a friendlier alias too.
      const params = new URLSearchParams(location.search);
      const alias = ctx.config.queryParam;
      start(params.get("subject") || (alias && params.get(alias)) || ctx.config.subject);
    }
  };
}

// ---------------------------------------------------------------- chrome

// Page furniture: header, footer, and the empty state that replaces the chart
// when there is nothing to draw. Wording lives in a chart copy.js; these place
// it. All three text roles derive from the current subject and the series
// actually returned, so switching subject cannot leave a stale name on screen.
const Header = {
  titleFor: (subject, ctx) => ctx.config.title || ctx.copy.title(subject, ctx),

  // The lead is prepended to whichever description is in use, so a custom
  // --caption never hides an explanation the reader needs. Optional: it exists
  // to introduce an element some charts do not draw, and an empty string in
  // every chart that lacks one is a key that has to be remembered rather than
  // a decision anyone made.
  descriptionFor: (model, ctx) =>
    (ctx.copy.lead ? ctx.copy.lead(model, ctx) : "")
    + (ctx.config.caption || ctx.copy.howToRead(model, ctx)),

  render(model, ctx) {
    const title = this.titleFor(model.subject, ctx);
    Dom.byId("title").textContent = title;
    Dom.byId("subtitle").textContent = ctx.copy.subtitle(model, ctx);
    Dom.byId("description").textContent = this.descriptionFor(model, ctx);
    document.title = title;      // the browser tab goes stale just as visibly
  },

  setLoading(label, ctx) {
    Dom.byId("subtitle").textContent = ctx.copy.loading(label);
  }
};

// ---------------------------------------------------------------- notes

// Prose a chart writes from the data it just drew: a note beside a panel, a
// standfirst, a method line. Declared like a control — a mount and a function —
// and rendered after the panels, so a sentence and the marks it describes come
// out of the same model on the same load. Nothing here knows any words.
//
//   notes: [{ mount: "note-rank", blocks: (model, ctx) => [ ... ] }]
//
// `blocks` returns data, not markup, and the shell owns the elements and the
// classes. That is deliberate: a note is written from values that arrived over
// the network — a city name, a country name — and a subject called
// "<img onerror=...>" must not become an element. Every string below is set
// with textContent, so it cannot.
const Notes = {
  // Returns what it placed, the way Legend.render returns its model: the
  // exporter draws the same blocks into the download, and re-deriving them
  // there would let the page and the file say different things about one load.
  render(model, ctx) {
    const placed = [];
    for (const note of ctx.notes) {
      const mount = Dom.byId(note.mount);
      if (!mount) throw new Error('No element "#' + note.mount + '" for a declared note');
      const blocks = note.blocks(model, ctx);
      mount.replaceChildren();
      for (const block of blocks) {
        const build = NOTE_BLOCKS[block.kind];
        if (!build) throw new Error('Unknown note block "' + block.kind + '"');
        mount.appendChild(build(block));
      }
      placed.push({ ...note, blocks });
    }
    return placed;
  },

  // A note is only true of the model it was written from. When that model is
  // gone, so is the note — otherwise a failed load leaves last country's
  // sentences sitting under this country's headline.
  clear(ctx) {
    for (const note of ctx.notes) {
      const mount = Dom.byId(note.mount);
      if (mount) mount.replaceChildren();
    }
  }
};

const noteEl = (tag, cls, text) => {
  const el = document.createElement(tag);
  el.className = cls;
  if (text != null) el.textContent = text;
  return el;
};

// The block vocabulary. Small on purpose: a note is a column of running text
// with a heading and, sometimes, the two or three numbers the text turns on.
// Anything a chart cannot say with these belongs in a panel, not in prose.
const NOTE_BLOCKS = {
  eyebrow: (b) => noteEl("p", "nt-eyebrow", b.text),
  head: (b) => noteEl("h2", "nt-head", b.text),
  p: (b) => noteEl("p", "nt-p", b.text),
  // One sentence set larger than the rest: the finding the section is about.
  lede: (b) => noteEl("p", "nt-lede", b.text),
  // The numbers pulled out of the prose, so a reader who skims still gets them.
  stats: (b) => {
    const dl = noteEl("dl", "nt-stats");
    for (const item of b.items) {
      // Label, then the qualifier that names it, then the figure — one line,
      // reading left to right with the number flush right where a column of
      // them can be compared.
      const row = noteEl("div", "nt-stat");
      row.appendChild(noteEl("dt", "nt-stat-label", item.label));
      if (item.note) row.appendChild(noteEl("dd", "nt-stat-note", item.note));
      row.appendChild(noteEl("dd", "nt-stat-value", item.value));
      dl.appendChild(row);
    }
    return dl;
  }
};

const Footer = {
  render(ctx) {
    Dom.byId("datasource").textContent = ctx.copy.dataSource;
    this.renderSignature(ctx);
  },

  // .html(), not .text(): on the page the byline is a real link. The export
  // flattens it to plain text — a static file has nothing to click.
  renderSignature(ctx) {
    const sig = d3.select("#signature");
    const s = ctx.config.signature;
    if (s) {
      sig.html("Created by " + s.name + " · "
        + '<a href="https://' + s.url + '" target="_blank" rel="noopener">' + s.url + "</a>");
    } else {
      sig.text("");
    }
  },

  clearSource() { Dom.byId("datasource").textContent = ""; }
};

// No data means no chart. There is no synthetic fallback anywhere in this
// codebase: a ring of generated numbers looks exactly like a real one, and the
// reader has no way to tell it is fiction.
const EmptyState = {
  show(subject, reason, ctx) {
    const title = Header.titleFor(subject, ctx);
    Dom.byId("title").textContent = title;
    document.title = title;
    Dom.byId("subtitle").textContent = "";
    Dom.byId("description").textContent = "";
    Footer.clearSource();
    Notes.clear(ctx);
    emptyRegions(ctx).forEach(Dom.hide);
    const nd = Dom.byId("nodata");
    nd.querySelector(".nd-head").textContent = ctx.copy.empty.head;
    nd.querySelector(".nd-body").textContent = ctx.copy.empty.body(subject, reason, ctx);
    Dom.show("nodata");
    Footer.renderSignature(ctx);
  },

  // Must run before every successful render: a subject that failed leaves the
  // chart hidden, and the next one that works has to put it back.
  hide(ctx) {
    Dom.hide("nodata");
    emptyRegions(ctx).forEach(Dom.show);
  }
};

// The legend and the panels always go. `regions` is for the furniture a page
// builds around them — a section heading, a rule, the column a note sits in —
// which has nothing to say once the panels are hidden.
const emptyRegions = (ctx) =>
  ["legend", ...ctx.panels.map((p) => p.id), ...ctx.regions];

// ---------------------------------------------------------------- legend

// Colour ramp plus a key row. HTML/CSS rather than SVG so it reflows with the
// page; returns its model so the exporter can rebuild it as real SVG.
//
// Mount contract (see a chart page.html):
//   #legend .lg-cap   #colorbar   #colorticks   #legend .lg-keys

const Legend = {
  render(model, ctx) {
    const { layout: L, copy: C, format: F } = ctx;
    const G = L.legend;
    // The ramp is not always the value axis. A chart can place its marks on one
    // quantity and colour them by another — an absolute temperature for where a
    // bar sits, its departure from normal for what colour it is — and then the
    // legend has to describe the second one. `model.ramp` says what the ramp
    // actually spans; a model without one is coloured by its own values, which
    // is the case every chart here started from.
    const R = model.ramp
      || { min: model.dataMin, max: model.dataMax, colour: model.colour };
    const at = (u) => R.min + u * (R.max - R.min);
    const stops = d3.range(0, 1.0001, 1 / G.gradientSteps).map((u) => R.colour(at(u)));
    const tickVals = d3.range(0, 1.0001, 1 / G.tickSteps).map(at);

    d3.select("#legend .lg-cap").text(C.legend.cap);
    d3.select("#colorbar").style("background", `linear-gradient(to right, ${stops.join(",")})`);
    const ticks = d3.select("#colorticks");
    ticks.html("");
    tickVals.forEach((v) => ticks.append("span").text(F.num(v)));

    const keys = this.keyDefs(model, ctx);
    const keyRow = d3.select(".lg-keys");
    keyRow.html("");
    keys.forEach((k) => {
      const swatch = k.kind === "dash"
        ? `<svg width="${G.keyLine.w}" height="${G.keyLine.h}">`
          + `<line x1="0" y1="${G.keyLine.h / 2}" x2="${G.keyLine.w}" y2="${G.keyLine.h / 2}"`
          + ` stroke="${k.color}" stroke-width="${k.width}" stroke-dasharray="${k.dash}"/></svg>`
        : `<span class="swatch"></span>`;
      keyRow.append("span").attr("class", "key").html(`${swatch} ${k.label}`);
    });

    return { stops, tickVals, keys };
  },

  // Shared with the exporter, which draws the same keys as SVG. It sizes each
  // one from the label itself, so there is no per-key width to state here.
  keyDefs(model, { theme: T, copy: C }) {
    const S = T.stroke;
    const keys = [
      { label: C.legend.medHigh, kind: "dash", ...S.medianHigh },
      { label: C.legend.medLow, kind: "dash", ...S.medianLow }
    ];
    if (model.hasBand) {
      keys.push({
        label: C.legend.band(model), kind: "swatch",
        color: T.color.bandFill, border: T.color.bandStroke
      });
    }
    return keys;
  }
};

// ---------------------------------------------------------------- subject picker

// A searchable combobox over whatever an adapter can look up: cities, tickers,
// repositories. Mounted only when the adapter exposes search(), so a chart with
// a fixed subject gets nothing rather than a control that cannot work.

function SubjectPicker(mount, { adapter, onSelect, ctx }) {
  const C = ctx.copy.search, F = ctx.format;

  mount.innerHTML = [
    '<label class="cs-label" for="cs-input">' + C.label + "</label>",
    '<div class="cs-shell">',
    '  <input id="cs-input" class="cs-input" type="text" autocomplete="off"',
    '         role="combobox" aria-expanded="false" aria-controls="cs-list"',
    '         aria-autocomplete="list" placeholder="' + C.placeholder + '">',
    '  <ul id="cs-list" class="cs-list" role="listbox" hidden></ul>',
    '  <p class="cs-status" role="status" aria-live="polite"></p>',
    "</div>"
  ].join("\n");

  const input = mount.querySelector(".cs-input");
  const list = mount.querySelector(".cs-list");
  const status = mount.querySelector(".cs-status");

  let results = [];
  let active = -1;
  let debounce = null;
  let inflight = null;

  const close = () => {
    list.hidden = true;
    list.innerHTML = "";
    input.setAttribute("aria-expanded", "false");
    input.removeAttribute("aria-activedescendant");
    results = []; active = -1;
  };

  const paint = () => {
    list.innerHTML = "";
    results.forEach((s, i) => {
      const li = document.createElement("li");
      li.id = "cs-opt-" + i;
      li.className = "cs-option" + (i === active ? " is-active" : "");
      li.setAttribute("role", "option");
      li.setAttribute("aria-selected", String(i === active));
      // textContent, not innerHTML: a subject name arrives from a remote lookup
      // and markup in it must not become markup here.
      const name = document.createElement("span");
      name.className = "cs-name";
      name.textContent = s.name;
      const meta = document.createElement("span");
      meta.className = "cs-meta";
      meta.textContent = [s.detail, s.sublabel].filter(Boolean).join(", ");
      li.append(name, meta);
      // mousedown, not click: click fires after blur, which would already have
      // closed the list out from under the pointer.
      li.addEventListener("mousedown", (e) => { e.preventDefault(); choose(i); });
      list.appendChild(li);
    });
    list.hidden = results.length === 0;
    input.setAttribute("aria-expanded", String(results.length > 0));
    if (active >= 0) input.setAttribute("aria-activedescendant", "cs-opt-" + active);
    else input.removeAttribute("aria-activedescendant");
  };

  const choose = (i) => {
    const subject = results[i];
    if (!subject) return;
    input.value = F.subjectLabel(subject);
    close();
    input.blur();
    onSelect(subject);
  };

  const search = async (q) => {
    if (inflight) inflight.abort();
    inflight = new AbortController();
    status.textContent = "";
    try {
      const found = await adapter.search(q, {
        limit: ctx.config.searchLimit, signal: inflight.signal
      });
      results = found;
      active = found.length ? 0 : -1;
      paint();
      status.textContent = found.length ? C.matches(found.length) : C.none;
    } catch (e) {
      if (e.name === "AbortError") return;      // superseded by a later keystroke
      close();
      status.textContent = C.failed;
    }
  };

  input.addEventListener("input", () => {
    const q = input.value;
    clearTimeout(debounce);
    if (!q.trim()) { close(); status.textContent = ""; return; }
    debounce = setTimeout(() => search(q), ctx.config.searchDebounceMs);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!results.length) return;
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length;
      paint();
    } else if (e.key === "Enter") {
      if (active >= 0) { e.preventDefault(); choose(active); }
    } else if (e.key === "Escape") {
      close();
    }
  });

  input.addEventListener("focus", () => { if (results.length) paint(); });
  // mousedown again: the open panel overlaps the download buttons, so closing
  // on click would let the panel swallow the press and the button never see it.
  document.addEventListener("mousedown", (e) => { if (!mount.contains(e.target)) close(); });

  return {
    close,
    setBusy(busy) { input.disabled = busy; },
    setValue(label) { input.value = label; }
  };
}

// ---------------------------------------------------------------- option picker

// A labelled <select> over a fixed list, for a chart control whose choices are
// all known before the page opens — a month, a window, a variant.
//
// Native, where SubjectPicker is a combobox built by hand. That is not
// inconsistency: a searchable list over a remote source has to be rebuilt,
// because no native control can filter as you type against something it cannot
// see. A closed list of twenty-four months has no such problem, and a <select>
// brings its own keyboard handling, its own screen-reader semantics and, on a
// phone, the platform's own picker — all of which a rebuilt one would have to
// re-earn and would get subtly wrong.

function OptionPicker(mount, { id = "op-select", label, options, value, onSelect }) {
  mount.innerHTML = "";

  const lab = document.createElement("label");
  lab.className = "cs-label";
  lab.setAttribute("for", id);
  lab.textContent = label;

  const select = document.createElement("select");
  select.id = id;
  select.className = "op-select";
  for (const o of options) {
    const opt = document.createElement("option");
    opt.value = o.value;
    // textContent, not innerHTML: an option label is derived from data, and
    // markup in it must not become markup here.
    opt.textContent = o.label;
    select.appendChild(opt);
  }
  if (value != null) select.value = value;
  select.addEventListener("change", () => onSelect(select.value));

  mount.append(lab, select);

  return {
    setBusy(busy) { select.disabled = busy; },
    setValue(v) { select.value = v; },
    value() { return select.value; }
  };
}

/* ===== components/ranked-deviation-bars.js ===== */
// Subjects ranked by how far one number sits from a baseline, as bars growing
// left and right of a zero line.
//
// The mark is a bar because the quantity is a *departure*: it has a sign and a
// magnitude, and both are the finding. Length carries the magnitude, the side
// of the zero line carries the sign, and colour carries the same departure a
// second time — a bar that is longer is also more saturated, so the ranking
// survives being read quickly, at a distance, or in greyscale.
//
// Domain-agnostic: it draws whatever scalar the caller's `value` accessor
// returns, off a model that carries a symmetric `anom` domain to place it on.
//
// Model surface used:  facets[] (already in the order to draw)
//                      anom { lo, hi, ticks }
//                      ramp { colour }



const RANKED_DEVIATION_BARS_LAYOUT = {
  margin: { top: 62, right: 84, bottom: 52, left: 24 },
  row: { height: 36, gap: 12 },
  // The same column the stacked strips give a subject name, so the three
  // panels on a page share one left edge and a reader can run an eye straight
  // down a city.
  name: { col: 180, gutter: 14, leading: 22 },
  bar: { height: 18, radius: 2.5, edgeWidth: 0.75 },
  // Both ends of the scale are held back from the plot edges by the same
  // amount a paired panel needs for its outboard labels, so two panels over one
  // domain put their zero lines at the same x and can be read as one axis. It
  // is also the room a bar's own reading needs at the end of the axis — see
  // rankedValue below — so it is not spare space and cannot be reclaimed.
  valuePad: 54,
  valueGap: 12,          // between a bar's end and its reading
  cap: { y: 16 },        // panel caption
  direction: { y: 40, gap: 12 },
  // A drawn axis, not four numbers floating under the plot. `ruleGap` is where
  // the rule sits below the marks, `tickLen` how far a tick drops off it, and
  // `tickGap` where the label's baseline lands — all inside margin.bottom.
  axis: { tickGap: 33, overhang: 10, ruleGap: 13, tickLen: 6 }
};

function rankedDeviationBarsHeight(L, count) {
  return L.margin.top + count * L.row.height + Math.max(0, count - 1) * L.row.gap
    + L.margin.bottom;
}

function RankedDeviationBars({
  id = "ranked",
  layoutKey = id,
  // What to rank by. Default reads `value`; a chart over a different quantity
  // passes its own rather than this file learning the word for it.
  value = (facet) => facet.value,
  // How to colour a bar. Sampling the ramp at the bar's own value is right when
  // the two share a domain; a chart whose ramp is scaled to something else
  // passes a fill that only reports the sign.
  fill = (v, model) => model.ramp.colour(v)
} = {}) {
  return {
    id,
    layoutKey,
    defaults: RANKED_DEVIATION_BARS_LAYOUT,

    measure(model, ctx) {
      return { h: rankedDeviationBarsHeight(ctx.layout[layoutKey], model.facets.length) };
    },

    render(svg, model, ctx) {
      const S = ctx.layout[layoutKey];
      const T = ctx.theme, F = ctx.format, C = ctx.copy.panels[id];
      const canvas = ctx.layout.canvas[id];

      svg.selectAll("*").remove();
      svg.attr("aria-label", C.aria(model.subject, ctx));

      const left = S.margin.left + S.name.col;
      const iw = canvas.w - left - S.margin.right;
      const x = d3.scaleLinear().domain([model.anom.lo, model.anom.hi])
        .range([left + S.valuePad, left + iw - S.valuePad]);

      const rowTop = (i) => S.margin.top + i * (S.row.height + S.row.gap);
      const plotTop = S.margin.top - S.axis.overhang;
      const plotBottom = rowTop(model.facets.length - 1) + S.row.height + S.axis.overhang;

      // Measured once for the panel: every name is set in the same face at the
      // same size, so the font string never changes between rows. Export size,
      // because one SVG is drawn at both scales and only the larger overflows.
      const nameFont = F.font(
        T.type.size.subtitle * ctx.layout.export.typeScale, T.type.serif);
      const nameMax = S.name.col - S.name.gutter;

      rankedCaption(svg, S, F, C);
      deviationAxis({
        svg, S, T, F, x, ticks: model.anom.ticks,
        top: plotTop, bottom: plotBottom, baseline: C.baseline
      });
      rankedDirections(svg, S, F, C, x);

      model.facets.forEach((facet, i) => {
        const top = rowTop(i);
        const cy = top + S.row.height / 2;
        const v = value(facet);

        rankedBar({ svg, S, T, x, cy }, v, fill(v, model));
        rankedName({ svg, S, F, cy, nameFont, nameMax }, facet.subject.name);
        rankedValue({ svg, S, T, F, x, cy }, v);
      });

      // The zero line last, so it sits over every bar that crosses it: it is
      // the one reference the whole panel is measured from, and a bar drawn on
      // top of it hides the very edge the reader is comparing against.
      applyStroke(
        svg.append("line").attr("x1", x(0)).attr("x2", x(0))
          .attr("y1", plotTop).attr("y2", plotBottom),
        T.stroke.bandEdge
      );

      // One mark per subject. Declared so a smoke test can tell a panel that
      // drew its data from one that silently drew nothing.
      svg.attr("data-marks", model.facets.length);
    }
  };
}

function rankedCaption(svg, S, F, C) {
  svg.append("text").attr("x", S.margin.left).attr("y", S.cap.y)
    .attr("class", "panel-cap").text(F.caps(C.cap));
}

// Which way is which, said once at the top rather than left to the colour ramp.
// A diverging scale is only self-explanatory to someone who already knows the
// convention, and half the readers of a temperature chart do not.
function rankedDirections(svg, S, F, C, x) {
  svg.append("text").attr("x", x(0) - S.direction.gap).attr("y", S.direction.y)
    .attr("text-anchor", "end").attr("class", "panel-cap").text(F.caps(C.below));
  svg.append("text").attr("x", x(0) + S.direction.gap).attr("y", S.direction.y)
    .attr("text-anchor", "start").attr("class", "panel-cap").text(F.caps(C.above));
}

// The reading sits at the end of its own bar, on the side the bar grew towards,
// so the number and the length that mean the same thing are one object. Put in
// a column off to the right they are two, and the eye has to carry a row all
// the way across the plot to pair them up — which is the trip the bar was drawn
// to save. It also keeps a negative reading on the left, beside the bar it
// belongs to, rather than filed on the right with the positive ones.
function rankedValue({ svg, S, T, F, x, cy }, v) {
  const outward = v < 0 ? -1 : 1;
  svg.append("text")
    .attr("x", x(v) + outward * S.valueGap).attr("y", cy)
    .attr("dy", T.type.centreDy)
    .attr("text-anchor", outward < 0 ? "end" : "start")
    .attr("class", "row-value")
    .text(F.signed(v));
}

// A hairline edge on every bar: near the middle of a diverging ramp the fill is
// almost paper-coloured, and a bar that means "barely unusual" still has to be
// a shape the reader can see the end of.
function rankedBar({ svg, S, T, x, cy }, v, fill) {
  const x0 = x(0), x1 = x(v);
  svg.append("rect")
    .attr("x", Math.min(x0, x1)).attr("y", cy - S.bar.height / 2)
    .attr("width", Math.abs(x1 - x0)).attr("height", S.bar.height)
    .attr("rx", S.bar.radius)
    .attr("fill", fill)
    .attr("stroke", T.color.bandStroke).attr("stroke-width", S.bar.edgeWidth);
}

function rankedName({ svg, S, F, cy, nameFont, nameMax }, name) {
  const { lines, shrink } = fitLines(name, nameMax, nameFont);
  const first = cy - (lines.length - 1) * S.name.leading / 2;
  lines.forEach((line, i) => {
    const t = svg.append("text")
      .attr("x", S.margin.left).attr("y", first + i * S.name.leading)
      .attr("dy", "0.32em").attr("class", "row-name").text(line);
    // A percentage rather than a pixel size, and inline so it beats the class
    // rule: one SVG renders at two type scales, and a pixel size would pin this
    // row to whichever was current when it was measured.
    if (shrink < 1) t.style("font-size", (shrink * 100).toFixed(1) + "%");
  });
}

/* ===== components/stacked-range-strips.js ===== */
// Small multiples: one horizontal range strip per subject, stacked down the
// page with whitespace between them.
//
// Takes a faceted range model (core/model.js), where every facet already
// shares one value domain and one colour scale — so a bar of the same length
// means the same value in every row, and the rows can actually be compared.
// That shared scale is the whole reason this is a panel rather than N panels.
//
// Domain-agnostic, like every component here: it draws ranges and reads its
// words from ctx.copy.



const STACKED_RANGE_STRIPS_LAYOUT = {
  margin: { top: 34, right: 84, bottom: 56, left: 24 },
  row: {
    height: 92,
    // The whitespace between subjects. It has to clear the two extreme labels
    // that reach into it — the coldest day hanging below one row, the hottest
    // sitting above the next.
    gap: 54
  },
  // Subject names get a column to the left of the plot, vertically centred on
  // the row, so a name and its bars read as one horizontal line.
  //
  //   col     — the column's full width; the plot starts after it
  //   gutter  — clear space at its right edge, before the plot
  //   leading — between wrapped lines, in canvas units
  //
  // A name too long for `col - gutter` wraps rather than running into the bars,
  // which is what makes an arbitrary city name safe here: the subjects are
  // cities in whichever country was picked, and "Rio de Janeiro" is not a width
  // anyone can choose in advance. Wrapping is measured at *export* type size,
  // because one SVG is drawn at both scales and only the larger one can
  // overflow. A single word with nowhere to break is set smaller instead —
  // 19 of the 920 cities in the bundled table need that, "Chichicastenango"
  // being the worst. Sizing the column for those two dozen names instead would
  // cost every other row 60px of plot.
  name: { col: 180, gutter: 14, leading: 30 },
  cap: { y: 16 },  // panel caption, drawn only when the chart supplies one
  valueGap: 12,    // value labels, right of the plot
  // Key labels, below the last row only. Far enough down to clear that row's
  // coldest-day label, which hangs below the plot by `extreme.belowDy` and can
  // land at any x — so distance is the only thing keeping them apart.
  keyGap: 42,
  pointPadding: 0.5,
  bar: { ratio: 0.55, min: 2 },
  extreme: { aboveDy: -10, belowDy: 20 }
};

// Canvas height is a function of how many subjects there are, so a chart
// computes it rather than hardcoding a number that silently stops matching.
function stackedStripsHeight(L, count) {
  return L.margin.top + count * L.row.height + Math.max(0, count - 1) * L.row.gap
    + L.margin.bottom;
}

function StackedRangeStrips({ id = "strips", layoutKey = id } = {}) {
  return {
    id,
    layoutKey,
    defaults: STACKED_RANGE_STRIPS_LAYOUT,

    // How tall this panel has to be for the data it is about to draw. The
    // shell writes it back to layout.canvas before render, so a country with
    // four cities gets a four-row canvas instead of six rows of whitespace —
    // and the exporter, which reads the same entry, agrees.
    measure(model, ctx) {
      return { h: stackedStripsHeight(ctx.layout[layoutKey], model.facets.length) };
    },

    render(svg, model, ctx) {
      const S = ctx.layout[layoutKey];
      const T = ctx.theme, F = ctx.format, C = ctx.copy.panels[id];
      const canvas = ctx.layout.canvas[id];

      svg.selectAll("*").remove();
      svg.attr("aria-label", C.aria(model.subject, ctx));
      const defs = svg.append("defs");

      // The plot begins after the name column; the names own everything left
      // of it, so no bar can ever sit under one.
      const left = S.margin.left + S.name.col;
      const iw = canvas.w - left - S.margin.right;
      // One x scale for every row: the window is identical across facets, so
      // day k sits at the same x in all of them and a vertical read works.
      const x = d3.scalePoint().domain(d3.range(model.days))
        .range([left, left + iw]).padding(S.pointPadding);
      const barW = Math.max(S.bar.min, (iw / model.days) * S.bar.ratio);

      // Measured once for the whole panel, not once per row: every name is set
      // in the same face at the same size, so the font string never changes.
      const nameFont = F.font(
        T.type.size.facet * ctx.layout.export.typeScale, T.type.serif);
      const nameMax = S.name.col - S.name.gutter;
      const fitName = (text) => fitLines(text, nameMax, nameFont);

      // Optional: a panel that is the only one on its page is captioned by the
      // page's own legend, and repeating it above the rows says nothing. A page
      // stacking several panels needs each one named.
      if (C.cap) {
        svg.append("text").attr("x", S.margin.left).attr("y", S.cap.y)
          .attr("class", "panel-cap").text(F.caps(C.cap));
      }

      // Before the rows, so a label reaching into a gap sits over the rule.
      rowDividers(svg, S, T, model, canvas);

      model.facets.forEach((facet, i) => {
        const top = S.margin.top + i * (S.row.height + S.row.gap);
        const y = d3.scaleLinear().domain([model.lo, model.hi])
          .range([top + S.row.height, top]);
        const row = { svg, defs, S, T, F, x, y, left, iw, top, fitName };

        rowBand(row, facet);
        rowMedians(row, facet);
        rowBars(row, facet, id + "-" + i, barW);
        rowBandEdges(row, facet);
        rowExtremes(row, facet);
        rowLabels(row, facet);
      });

      // Key labels once, under the last row: repeating them per row costs six
      // times the ink and says nothing new.
      const lastTop = S.margin.top + (model.facets.length - 1) * (S.row.height + S.row.gap);
      keyLabels({ svg, S, F, x }, model, lastTop + S.row.height + S.keyGap);
    }
  };
}

// A hairline in each gap, so six rows read as six subjects rather than one
// field of bars. It spans the name column too — the same measure the page title
// uses — so the rule starts where every other left edge starts.
function rowDividers(svg, S, T, model, canvas) {
  for (let i = 1; i < model.facets.length; i++) {
    const at = S.margin.top + i * (S.row.height + S.row.gap) - S.row.gap / 2;
    applyStroke(
      svg.append("line")
        .attr("x1", S.margin.left).attr("x2", canvas.w - S.margin.right)
        .attr("y1", at).attr("y2", at),
      T.stroke.rowDivider
    );
  }
}

function rowBand({ svg, T, left, iw, y }, facet) {
  if (!facet.hasBand) return;
  const lo = facet.clampToDomain(facet.band.low);
  const hi = facet.clampToDomain(facet.band.high);
  svg.append("rect").attr("x", left).attr("y", y(hi))
    .attr("width", iw).attr("height", y(lo) - y(hi))
    .attr("fill", T.color.bandFill);
}

// Drawn over the bars: the band fill sits behind them and is mostly hidden, so
// only a visible edge that bars cross can answer "was this day outside normal".
function rowBandEdges({ svg, T, left, iw, y }, facet) {
  if (!facet.hasBand) return;
  [facet.band.low, facet.band.high].forEach((v) => {
    applyStroke(
      svg.append("line")
        .attr("x1", left).attr("x2", left + iw)
        .attr("y1", y(facet.clampToDomain(v))).attr("y2", y(facet.clampToDomain(v))),
      T.stroke.bandEdge
    );
  });
}

function rowMedians({ svg, T, left, iw, y }, facet) {
  const line = (v, token) => applyStroke(
    svg.append("line").attr("x1", left).attr("x2", left + iw).attr("y1", y(v)).attr("y2", y(v)),
    token
  );
  line(facet.medHigh, T.stroke.medianHigh);
  line(facet.medLow, T.stroke.medianLow);
}

// gradPrefix carries the row index: without it every row would define the same
// gradient ids and the last row would win for all of them.
// Where a datum sits and what colour it is are not always the same number. A
// strip can stand on an absolute scale and be coloured by how far that value
// fell from a normal — position answering "how hot", colour answering "how
// unusual". `cLow`/`cHigh` carry the colour value when the two differ; without
// them a datum is coloured by its own position, which is what every chart that
// has only one of these numbers wants.
const stripColourLow = (d) => (d.cLow === undefined ? d.low : d.cLow);
const stripColourHigh = (d) => (d.cHigh === undefined ? d.high : d.cHigh);

function rowBars({ svg, defs, T, x, y }, facet, gradPrefix, barW) {
  facet.series.forEach((d, k) => {
    const cx = x(k);
    const stroke = appendValueGradient(
      defs, gradPrefix + "-" + k, [cx, y(d.low)], [cx, y(d.high)],
      stripColourLow(d), stripColourHigh(d), facet.colour, T.mark.gradientStops
    );
    svg.append("line").attr("x1", cx).attr("x2", cx).attr("y1", y(d.low)).attr("y2", y(d.high))
      .attr("stroke", stroke).attr("stroke-width", barW).attr("stroke-linecap", "round");
  });
}

function rowExtremes({ svg, T, S, F, x, y }, facet) {
  const M = T.mark, E = S.extreme;
  [facet.maxIdx, facet.minIdx].forEach((k) => {
    const d = facet.series[k];
    const isMax = k === facet.maxIdx;
    const v = isMax ? d.high : d.low;
    const cx = x(k), cy = y(v);
    svg.append("circle").attr("cx", cx).attr("cy", cy).attr("r", M.dotR)
      .attr("fill", facet.colour(isMax ? stripColourHigh(d) : stripColourLow(d)))
      .attr("stroke", T.color.paper).attr("stroke-width", M.dotHaloWidth);
    svg.append("text").attr("x", cx).attr("y", cy + (isMax ? E.aboveDy : E.belowDy))
      .attr("text-anchor", "middle").attr("class", "key-label extreme-label")
      .text(F.value(v));
  });
}

// Subject name in the column to the left, on the row's centre line; its own
// high and low at the right, where the plot has no marks. Both sit outside the
// bars, so nothing is occluded.
function rowLabels({ svg, S, F, left, iw, y, top, fitName }, facet) {
  // The group carries the class as well, so a shrunk line has a font size to be
  // a percentage *of*. Without it the percentage would resolve against the
  // document default and ignore the theme entirely.
  const g = svg.append("g").attr("class", "facet-name");

  // Centred as a block: a two-line name straddles the row's middle rather than
  // starting at it, so a long name and a short one still look aligned.
  const { lines, shrink } = fitName(facet.subject.name);
  const first = top + S.row.height / 2 - (lines.length - 1) * S.name.leading / 2;
  lines.forEach((line, i) => {
    const t = g.append("text").attr("x", S.margin.left).attr("y", first + i * S.name.leading)
      .attr("dy", "0.32em").attr("class", "facet-name").text(line);
    // A percentage, not a pixel size, and inline so it beats the class rule:
    // one SVG is rendered at two type scales, and a pixel size would pin this
    // row to whichever one happened to be current when it was measured.
    if (shrink < 1) t.style("font-size", (shrink * 100).toFixed(1) + "%");
  });

  const at = left + iw + S.valueGap;
  g.append("text").attr("x", at).attr("y", y(facet.medHigh))
    .attr("dy", "0.32em").attr("class", "facet-sub")
    .text(F.value(facet.medHigh));
  g.append("text").attr("x", at).attr("y", y(facet.medLow))
    .attr("dy", "0.32em").attr("class", "facet-sub")
    .text(F.value(facet.medLow));
}

function keyLabels({ svg, F, x }, model, yPos) {
  const first = model.facets[0];
  first.series.forEach((d, k) => {
    if (k % model.labelStep !== 0) return;
    svg.append("text").attr("x", x(k)).attr("y", yPos)
      .attr("text-anchor", "middle").attr("class", "key-label").text(F.key(d.key));
  });
}

/* ===== components/paired-deviation-dots.js ===== */
// Two measurements of the same subject, on one axis, joined.
//
// The mark is a pair of dots and the line between them, because the finding is
// the *gap*: which of the two sits further from the baseline, and by how much.
// Two bars side by side say the same thing and say it worse — the eye compares
// two lengths from a shared edge instead of reading one distance directly.
//
// The two series are told apart by colour *and* by shape. Colour alone fails
// for the eight percent of men who cannot separate a warm hue from a cool one,
// and it fails for everybody once the chart is printed or screenshotted grey.
//
// Domain-agnostic: the caller supplies two accessors and the words for them.
//
// Model surface used:  facets[] (already in the order to draw)
//                      anom { lo, hi, ticks }



const PAIRED_DEVIATION_DOTS_LAYOUT = {
  margin: { top: 66, right: 84, bottom: 52, left: 24 },
  row: { height: 34, gap: 12 },
  name: { col: 180, gutter: 14, leading: 22 },
  dot: { r: 6.5, strokeWidth: 1.4 },
  connector: { width: 3 },
  // Each value is labelled beside its own dot, on the side away from the other
  // one, so the two labels in a row can never meet. This is the room that needs
  // to exist at both ends of the scale for that to be true — it is held out of
  // the range rather than trusted to be spare, and it matches the ranked
  // panel's, so the two zero lines land at the same x.
  valuePad: 54,
  valueGap: 11,
  cap: { y: 16 },
  key: { y: 44, gap: 30, labelGap: 13 },
  // A drawn axis, not four numbers floating under the plot. `ruleGap` is where
  // the rule sits below the marks, `tickLen` how far a tick drops off it, and
  // `tickGap` where the label's baseline lands — all inside margin.bottom.
  axis: { tickGap: 33, overhang: 10, ruleGap: 13, tickLen: 6 }
};

function pairedDeviationDotsHeight(L, count) {
  return L.margin.top + count * L.row.height + Math.max(0, count - 1) * L.row.gap
    + L.margin.bottom;
}

function PairedDeviationDots({
  id = "paired",
  layoutKey = id,
  // `a` is drawn as a diamond, `b` as a circle. Which is which is the caller's
  // decision, and so are the words: this file knows there are two of something.
  a = (facet) => facet.a,
  b = (facet) => facet.b
} = {}) {
  return {
    id,
    layoutKey,
    defaults: PAIRED_DEVIATION_DOTS_LAYOUT,

    measure(model, ctx) {
      return { h: pairedDeviationDotsHeight(ctx.layout[layoutKey], model.facets.length) };
    },

    render(svg, model, ctx) {
      const S = ctx.layout[layoutKey];
      const T = ctx.theme, F = ctx.format, C = ctx.copy.panels[id];
      const canvas = ctx.layout.canvas[id];
      const series = T.color.series;

      svg.selectAll("*").remove();
      svg.attr("aria-label", C.aria(model.subject, ctx));

      const left = S.margin.left + S.name.col;
      const iw = canvas.w - left - S.margin.right;
      const x = d3.scaleLinear().domain([model.anom.lo, model.anom.hi])
        .range([left + S.valuePad, left + iw - S.valuePad]);

      const rowTop = (i) => S.margin.top + i * (S.row.height + S.row.gap);
      const plotTop = S.margin.top - S.axis.overhang;
      const plotBottom = rowTop(model.facets.length - 1) + S.row.height + S.axis.overhang;

      const nameFont = F.font(
        T.type.size.subtitle * ctx.layout.export.typeScale, T.type.serif);
      const nameMax = S.name.col - S.name.gutter;

      svg.append("text").attr("x", S.margin.left).attr("y", S.cap.y)
        .attr("class", "panel-cap").text(F.caps(C.cap));

      deviationAxis({
        svg, S, T, F, x, ticks: model.anom.ticks,
        top: plotTop, bottom: plotBottom, baseline: C.baseline
      });
      pairedKey(svg, S, T, F, C, left, series, F.font(
        T.type.size.meta * ctx.layout.export.typeScale, T.type.sans));

      model.facets.forEach((facet, i) => {
        const cy = rowTop(i) + S.row.height / 2;
        const va = a(facet), vb = b(facet);

        applyStroke(
          svg.append("line").attr("x1", x(va)).attr("x2", x(vb))
            .attr("y1", cy).attr("y2", cy),
          { color: T.color.spoke, width: S.connector.width }
        );

        pairedDot(svg, S, T, x(va), cy, series.a, true);
        pairedDot(svg, S, T, x(vb), cy, series.b, false);
        pairedValues({ svg, S, T, F, x, cy }, va, vb);
        pairedName({ svg, S, F, cy, nameFont, nameMax }, facet.subject.name);
      });

      applyStroke(
        svg.append("line").attr("x1", x(0)).attr("x2", x(0))
          .attr("y1", plotTop).attr("y2", plotBottom),
        T.stroke.bandEdge
      );

      svg.attr("data-marks", model.facets.length * 2);
    }
  };
}

// A diamond and a circle of the same visual weight. Drawn as a path rather than
// a rotated rect: a transform on the mark would also rotate the stroke join and
// the shape would read as a slightly wrong square at small sizes.
function pairedDot(svg, S, T, cx, cy, fill, diamond) {
  const r = S.dot.r;
  const node = diamond
    ? svg.append("path").attr("d",
        "M" + cx + "," + (cy - r * 1.18) + "L" + (cx + r * 1.18) + "," + cy
        + "L" + cx + "," + (cy + r * 1.18) + "L" + (cx - r * 1.18) + "," + cy + "Z")
    : svg.append("circle").attr("cx", cx).attr("cy", cy).attr("r", r);
  // A paper-coloured halo, so a dot stays a dot where it overlaps its partner
  // or the connector between them.
  node.attr("fill", fill)
    .attr("stroke", T.color.paper).attr("stroke-width", S.dot.strokeWidth);
}

// Each label outboard of its own dot — the lower value to its left, the higher
// to its right — so the two can never collide however close the dots are.
function pairedValues({ svg, S, T, F, x, cy }, va, vb) {
  const lo = Math.min(va, vb), hi = Math.max(va, vb);
  svg.append("text").attr("x", x(lo) - S.valueGap).attr("y", cy)
    .attr("dy", T.type.centreDy).attr("text-anchor", "end")
    .attr("class", "value-label").text(F.signed(lo));
  svg.append("text").attr("x", x(hi) + S.valueGap).attr("y", cy)
    .attr("dy", T.type.centreDy).attr("text-anchor", "start")
    .attr("class", "value-label").text(F.signed(hi));
}

// The panel's own key. The page legend explains the colour ramp, which is a
// different encoding from these two — a shared legend that tried to hold both
// would be teaching two colour languages in one line.
function pairedKey(svg, S, T, F, C, left, series, keyFont) {
  const r = S.dot.r;
  let at = left;
  [[C.keyA, series.a, true], [C.keyB, series.b, false]].forEach(([label, fill, diamond]) => {
    pairedDot(svg, S, T, at + r, S.key.y, fill, diamond);
    svg.append("text").attr("x", at + r + S.key.labelGap).attr("y", S.key.y)
      .attr("dy", T.type.centreDy).attr("class", "key-label").text(label);
    at += r * 2 + S.key.labelGap + F.textWidth(label, keyFont) + S.key.gap;
  });
}

function pairedName({ svg, S, F, cy, nameFont, nameMax }, name) {
  const { lines, shrink } = fitLines(name, nameMax, nameFont);
  const first = cy - (lines.length - 1) * S.name.leading / 2;
  lines.forEach((line, i) => {
    const t = svg.append("text")
      .attr("x", S.margin.left).attr("y", first + i * S.name.leading)
      .attr("dy", "0.32em").attr("class", "row-name").text(line);
    if (shrink < 1) t.style("font-size", (shrink * 100).toFixed(1) + "%");
  });
}

/* ===== adapters/open-meteo.js ===== */
// Daily min/max temperature from Open-Meteo.
//
// An adapter is the seam between a chart and where its numbers come from:
//   search(query, {limit, signal})  -> Subject[]        optional
//   resolve(query, {ctx})           -> Subject          optional
//   load(subject, {signal, ctx})    -> { series, band }
//
// Nothing above this file knows the word "temperature". A second adapter over
// a different dataset implements the same three methods and the whole chart
// stack works unchanged.



const GEOCODE = "https://geocoding-api.open-meteo.com/v1/search";
// Two endpoints on purpose: forecast covers the recent window right up to
// today, archive covers the decade behind it.
const FORECAST = "https://api.open-meteo.com/v1/forecast";
const ARCHIVE = "https://archive-api.open-meteo.com/v1/archive";

const dayOfYear = (d) => Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);

// Local midnight, so a tab left open across midnight cannot half-include a day.
function today() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// The most recent `days` days, ending today, resolved fresh on every load.
// Deliberately not a calendar month: a pinned month is stale the day after it
// ends, whereas a trailing window means the same thing on every run date.
//
// No date is formatted for the API — past_days does that server-side — so the
// old UTC round-trip bug (toISOString shifting the range a day earlier east of
// Greenwich) has nowhere left to live.
function trailingWindow(days) {
  const end = today();
  return { start: new Date(end.getTime() - (days - 1) * 864e5), end, days };
}

const toSubject = (g) => ({
  id: g.id,
  name: g.name,
  detail: g.admin1 || "",
  sublabel: g.country || "",
  countryCode: g.country_code || "",
  lat: g.latitude,
  lon: g.longitude,
  timezone: g.timezone || "auto"
});

// Response arrays are index-aligned: daily.time[k] pairs with
// daily.temperature_2m_{max,min}[k]. Rows are dropped whole, so a value is
// never paired with another day date.
const openMeteoDailyRows = (daily) => daily.time
  .map((t, k) => ({
    key: new Date(t + "T00:00"),
    low: daily.temperature_2m_min[k],
    high: daily.temperature_2m_max[k]
  }))
  .filter((d) => d.low != null && d.high != null);

const OpenMeteoAdapter = {
  id: "open-meteo",

  async search(query, { limit = 8, signal } = {}) {
    if (!query || !query.trim()) return [];
    const url = GEOCODE + "?name=" + encodeURIComponent(query.trim())
      + "&count=" + limit + "&language=en&format=json";
    const j = await fetchJSON(url, { timeoutMs: 6000, signal });
    return (j.results || []).map(toSubject);
  },

  async resolve(query) {
    const [first] = await this.search(query, { limit: 1 });
    if (!first) throw new Error('No place found for "' + query + '"');
    return first;
  },

  async load(subject, { signal, ctx } = {}) {
    const series = await fetchDaily(subject, ctx, signal);
    // climatologyYears: 0 means a chart has decided it does not compare against
    // a normal range, so the archive is not called at all rather than fetched
    // and thrown away — on a small-multiples chart that is half the requests.
    if (!ctx.config.climatologyYears) return { series, band: null };
    // Optional layer: a failed climatology call must never take down a chart
    // that otherwise has everything it needs.
    let band = null;
    try { band = await fetchClimatology(subject, series, ctx, signal); }
    catch { band = null; }
    return { series, band };
  }
};

// Forecast + past_days rather than the archive: past_days counts back from the
// run date server-side, so the window is anchored to today by construction.
async function fetchDaily(subject, ctx, signal) {
  const { end, days } = trailingWindow(ctx.config.windowDays);
  const url = FORECAST + "?latitude=" + subject.lat + "&longitude=" + subject.lon
    + "&daily=temperature_2m_max,temperature_2m_min"
    + "&past_days=" + days + "&forecast_days=1"
    + "&timezone=" + encodeURIComponent(subject.timezone);
  const j = await fetchJSON(url, { timeoutMs: 8000, signal });
  const rows = openMeteoDailyRows(j.daily)
    // forecast_days=1 is there to reach today at all, not to draw days that
    // have not happened; this guard keeps the window closed at today.
    .filter((d) => d.key <= end)
    .slice(-days)     // past_days=N plus today is N+1 rows; keep the newest N
  ;
  if (!rows.length) throw new Error("No data for this location");
  return rows;
}

// Ten years ending the year before the window, matched by day-of-year and
// averaged into one normal low/high — "was this window typical", not a per-day
// envelope. Optional: the caller treats failure as "no band".
async function fetchClimatology(subject, series, ctx, signal) {
  if (!series.length) throw new Error("No window to compare");
  const first = series[0].key, last = series[series.length - 1].key;
  const startDOY = dayOfYear(first), endDOY = dayOfYear(last);
  const wraps = endDOY < startDOY;              // window crosses a year boundary
  const refYear = last.getFullYear();
  const years = ctx.config.climatologyYears;
  const fromYear = refYear - years, toYear = refYear - 1;

  const url = ARCHIVE + "?latitude=" + subject.lat + "&longitude=" + subject.lon
    + "&start_date=" + fromYear + "-01-01&end_date=" + toYear + "-12-31"
    + "&daily=temperature_2m_max,temperature_2m_min"
    + "&timezone=" + encodeURIComponent(subject.timezone);
  const j = await fetchJSON(url, { timeoutMs: 10000, signal });

  const inWindow = (d) => {
    const doy = dayOfYear(d);
    return wraps ? (doy >= startDOY || doy <= endDOY) : (doy >= startDOY && doy <= endDOY);
  };
  const matched = openMeteoDailyRows(j.daily).filter((d) => inWindow(d.key));
  if (!matched.length) throw new Error("No climatology data");
  return {
    low: d3.mean(matched, (d) => d.low),
    high: d3.mean(matched, (d) => d.high),
    fromYear, toYear
  };
}

/* ===== adapters/countries.js ===== */
// Generated by tools/make-countries.mjs — do not edit by hand.
//
// Every country the strips chart can draw, and the 6 cities it draws for
// each, in the order they are drawn: the capital first, then the largest by
// population, each at least 45 km from the last so no two rows are the same
// weather. Countries with fewer than 3 qualifying cities are left out — there
// is no small multiple in two rows.
//
// Coordinates are here so the chart can go straight to the weather API: the
// geocoder would otherwise cost one extra request per row and could resolve a
// city name to the wrong continent.

/* ===== adapters/open-meteo-countries.js ===== */
// A whole country of cities, from Open-Meteo.
//
// Its own file because of what it costs: adapters/countries.js is a 28 KB
// bundled table, and build/bundle.mjs is a flat concatenation with no
// tree-shaking, so anything importing it pays for it. A chart about one city
// imports adapters/open-meteo.js and never sees this.




// A whole country, one load: its largest cities as facets, which is what a
// small-multiples panel needs instead of a series.
//
// The city set is not searched for — it is read from adapters/countries.js, a
// baked GeoNames extract. Open-Meteo's geocoder answers "where is this named
// place", never "what are the cities in this country", so the rows a country
// draws cannot come from the API. Baking them also removes one geocode request
// per row and stops a city name resolving to the wrong continent.
//
// search() is over that same table, so the picker filters instantly, offline,
// and always offers exactly the countries the chart can actually draw.

const CONTINENTS = {
  AF: "Africa", AS: "Asia", EU: "Europe",
  NA: "North America", SA: "South America", OC: "Oceania", AN: "Antarctica"
};

// Accents and apostrophes come off both sides, so "Türkiye" typed either way
// reaches Turkey and "cote divoire" reaches Côte d'Ivoire. U+0300-U+036F is
// the combining-marks block NFD splits an accented letter into.
const fold = (s) => s.normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "")
  .replace(/['’.]/g, "")
  .toLowerCase().trim();

// GeoNames names a country the way its own gazetteer does, which is not always
// the name a reader will type. Only where the two genuinely differ — this is a
// list of names people use, not a place to editorialise about which is right.
const ALIASES = {
  TR: ["Türkiye"],
  CI: ["Cote d'Ivoire"],
  CZ: ["Czech Republic"],
  MM: ["Burma"],
  CV: ["Cape Verde"],
  NL: ["Holland"],
  GB: ["UK", "Great Britain", "Britain", "England"],
  US: ["USA", "America"],
  AE: ["UAE"],
  CD: ["DRC", "Congo-Kinshasa", "Zaire"],
  CG: ["Congo-Brazzaville"],
  MK: ["Macedonia"],
  LA: ["Lao PDR"],
  TL: ["East Timor"]
};

// Folded once at load rather than per keystroke: this runs on every character
// typed, across every country in the table.
const SEARCHABLE = COUNTRIES.map((c) => ({
  country: c,
  code: fold(c.code),
  names: [c.name, ...(ALIASES[c.code] || [])].map(fold)
}));

const toCountrySubject = (c) => ({
  id: c.code,
  name: c.name,
  // Empty on purpose: `sublabel` joins into the headline, and "Saudi Arabia,
  // Asia" is not what the title should say. The continent is picker-only, so
  // it goes in `detail`.
  sublabel: "",
  detail: CONTINENTS[c.continent] || "",
  cities: c.cities
});

const OpenMeteoCountriesAdapter = {
  id: "open-meteo-countries",

  // Local, so there is no debounce to wait out and no request to fail. Ranked
  // rather than filtered: a country whose name starts with the query outranks
  // one that merely contains it, so typing "ind" offers India before Indonesia
  // and never before Finland.
  async search(query, { limit = 8 } = {}) {
    const q = fold(query || "");
    if (!q) return [];
    return SEARCHABLE
      .map((entry) => {
        // Exact first, then prefix, then anywhere — so "uk" offers the
        // United Kingdom ahead of Ukraine, and "ind" offers India before
        // Indonesia and neither before Finland.
        const rank = entry.code === q || entry.names.includes(q) ? 0
          : entry.names.some((n) => n.startsWith(q)) ? 1
            : entry.names.some((n) => n.includes(q)) ? 2 : -1;
        return { entry, rank };
      })
      .filter((m) => m.rank >= 0)
      .sort((a, b) => a.rank - b.rank
        || a.entry.country.name.localeCompare(b.entry.country.name, "en"))
      .slice(0, limit)
      .map((m) => toCountrySubject(m.entry.country));
  },

  async resolve(query) {
    const [first] = await this.search(query, { limit: 1 });
    if (!first) throw new Error('No country called "' + query + '" in the list');
    return first;
  },

  async load(subject, { signal, ctx } = {}) {
    const wanted = (subject.cities || []).slice(0, ctx.config.cityCount);
    if (!wanted.length) throw new Error("No cities listed for " + subject.name);

    // In parallel: six cities served sequentially would make the first paint
    // wait on the slowest chain of twelve requests instead of one.
    const settled = await Promise.all(
      wanted.map((city) => loadCity(city, subject, ctx, signal)));

    // A city that fails is dropped rather than taking the whole chart down,
    // and the header counts what actually arrived — so the page never claims
    // more cities than it drew.
    const facets = settled.filter(Boolean);
    if (!facets.length) throw new Error("No city data could be loaded");
    return { facets };
  }
};

async function loadCity(city, country, ctx, signal) {
  // timezone "auto" rather than a baked one: Open-Meteo derives it from the
  // coordinates, which is one fewer field to keep correct in the table and
  // survives a country redrawing its zones.
  const place = {
    id: country.code + ":" + city.name,
    name: city.name, sublabel: country.name, detail: "",
    lat: city.lat, lon: city.lon, timezone: "auto"
  };
  try {
    const { series, band } = await OpenMeteoAdapter.load(place, { signal, ctx });
    return { subject: place, series, band };
  } catch (e) {
    if (e.name === "AbortError") throw e;   // a superseded load must stay aborted
    return null;
  }
}

/* ===== adapters/open-meteo-month.js ===== */
// One calendar month of a country's cities, against the same month's normal.
//
// The other adapters read a *trailing* window — the last 30 days, whatever
// today is — because a pinned month goes stale the day after it ends. This one
// is the opposite on purpose: the question is "how unusual was July", and July
// is a fixed thing. So the window is a calendar month, chosen by the reader,
// and the comparison is the same calendar month across the ten years before it.
//
// Cost: one archive request per city, not two. The target month and its normal
// come out of a single range — (year - N)-MM-01 through the end of year-MM —
// and are split apart here. Asking for each year separately would be eleven
// requests per city and sixty-six for a country.





const MONTH_ARCHIVE = "https://archive-api.open-meteo.com/v1/archive";

const MONTH_NAMES = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"
];

const pad2 = (n) => String(n).padStart(2, "0");

// Built from the parts, never from Date#toISOString: that converts to UTC, and
// east of Greenwich a local midnight lands on the previous day — the shift bug
// the rest of this repo is written to avoid.
const isoDate = (y, m0, d) => y + "-" + pad2(m0 + 1) + "-" + pad2(d);

// Day 0 of the next month is the last day of this one, and Date does the
// leap-year arithmetic so nothing here has to know about February.
const lastDayOfMonth = (y, m0) => new Date(y, m0 + 1, 0).getDate();

/** "2026-07" -> { year, month0 }. Throws rather than guessing: a month that
 *  silently fell back to a default would draw a chart titled for one month out
 *  of another month's numbers. */
function parseMonthKey(key) {
  const m = /^(\d{4})-(\d{2})$/.exec(String(key || "").trim());
  if (!m) throw new Error('Month must look like "2026-07", got "' + key + '"');
  const year = Number(m[1]), month0 = Number(m[2]) - 1;
  if (month0 < 0 || month0 > 11) throw new Error('No month "' + m[2] + '" — use 01 to 12');
  return { year, month0 };
}

const monthKeyLabel = (key) => {
  const { year, month0 } = parseMonthKey(key);
  return MONTH_NAMES[month0] + " " + year;
};

/** The most recent month whose observations have certainly landed.
 *
 *  Open-Meteo's archive is reanalysis, and it trails real time by about five
 *  days. `settleDays` is that lag plus a margin: without it, a chart opened on
 *  the 2nd would offer last month and draw a month missing its final week —
 *  which looks like a complete month, and is the kind of wrong that no error
 *  message ever appears for. */
function latestCompleteMonth(settleDays = 7) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - settleDays);
  d.setDate(1);                 // set before setMonth, so no day-of-month overflows
  d.setMonth(d.getMonth() - 1);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
}

/** The `count` most recent complete months, newest first, for a picker. */
function recentMonths(count = 24, settleDays = 7) {
  const { year, month0 } = parseMonthKey(latestCompleteMonth(settleDays));
  const out = [];
  for (let i = 0; i < count; i++) {
    const d = new Date(year, month0 - i, 1);
    const key = d.getFullYear() + "-" + pad2(d.getMonth() + 1);
    out.push({ value: key, label: MONTH_NAMES[d.getMonth()] + " " + d.getFullYear() });
  }
  return out;
}

const OpenMeteoMonthAdapter = {
  id: "open-meteo-month",

  // The country list is the same bundled GeoNames table the strips chart reads,
  // so this delegates rather than carrying a second copy of the ranking rules.
  search(query, opts) { return OpenMeteoCountriesAdapter.search(query, opts); },
  resolve(query, opts) { return OpenMeteoCountriesAdapter.resolve(query, opts); },

  async load(subject, { signal, ctx } = {}) {
    const key = ctx.config.month || latestCompleteMonth(ctx.config.monthSettleDays);
    const { year, month0 } = parseMonthKey(key);
    const years = ctx.config.climatologyYears;
    if (!years || years < 1) throw new Error("This chart needs climatologyYears >= 1");

    const wanted = (subject.cities || []).slice(0, ctx.config.cityCount);
    if (!wanted.length) throw new Error("No cities listed for " + subject.name);

    // In parallel: six cities served one after another would make the first
    // paint wait on the slowest chain of six requests instead of on one.
    const settled = await Promise.all(wanted.map(
      (city) => loadCityMonth(city, subject, { year, month0, years }, signal)));

    // A city that fails is dropped rather than taking the country down with it,
    // and everything downstream counts what actually arrived — so the page
    // never claims more cities than it drew.
    const facets = settled.filter((r) => r.facet).map((r) => r.facet);
    if (!facets.length) {
      // Why it failed, not just that it did. "No data for July 2026" reads as
      // "that month is empty, try another" when the real cause was a 502 from
      // the archive — and those two point the reader in opposite directions.
      const failed = settled.find((r) => r.error);
      throw new Error(MONTH_NAMES[month0] + " " + year + " did not load for any "
        + subject.name + " city: " + (failed ? failed.error : "reason unknown"));
    }

    return {
      facets,
      month: {
        key, year, month0,
        name: MONTH_NAMES[month0],
        label: MONTH_NAMES[month0] + " " + year,
        fromYear: year - years,
        toYear: year - 1
      }
    };
  }
};

async function loadCityMonth(city, country, { year, month0, years }, signal) {
  const place = {
    id: country.code + ":" + city.name,
    name: city.name, sublabel: country.name, detail: "",
    // "auto" rather than a baked zone: Open-Meteo derives it from the
    // coordinates, which is one fewer field to keep correct in the table.
    lat: city.lat, lon: city.lon, timezone: "auto"
  };

  const url = MONTH_ARCHIVE + "?latitude=" + place.lat + "&longitude=" + place.lon
    + "&start_date=" + isoDate(year - years, month0, 1)
    + "&end_date=" + isoDate(year, month0, lastDayOfMonth(year, month0))
    + "&daily=temperature_2m_max,temperature_2m_min"
    + "&timezone=" + encodeURIComponent(place.timezone);

  try {
    // Ten years of daily rows is a fat response, so the timeout is generous —
    // but it is still a timeout: an unreachable host has to fail, never hang.
    const j = await fetchJSON(url, { timeoutMs: 20000, signal });
    const rows = openMeteoDailyRows(j.daily).filter((d) => d.key.getMonth() === month0);

    const series = rows.filter((d) => d.key.getFullYear() === year);
    const history = rows.filter((d) => d.key.getFullYear() < year);
    if (!series.length) return { error: "no observations for that month" };
    if (!history.length) return { error: "no earlier years to compare against" };

    return { facet: {
      subject: place,
      series,
      // The normal is one number for the month, not a per-day envelope: the
      // question is "was this month unusual", and a daily envelope answers a
      // different one — "was this Tuesday unusual" — thirty-one times over.
      band: {
        low: d3.mean(history, (d) => d.low),
        high: d3.mean(history, (d) => d.high),
        fromYear: year - years,
        toYear: year - 1,
        days: history.length
      }
    } };
  } catch (e) {
    if (e.name === "AbortError") throw e;   // a superseded load must stay aborted
    return { error: e.message };
  }
}

/* ===== charts/country-heat-anomaly/chart.js ===== */
// ---------------------------------------------------------------- what to draw

const CONFIG = {

  subject: "Saudi Arabia",


  queryParam: "country",


  cityCount: 6,


  title: null,
  caption: null,
  signature: { name: "Muhammad Azhar", url: "imagineazhar.com" },

  // null resolves, when the file is opened, to the most recent month whose
  // observations have certainly landed. Not baked at generation time: a chart
  // made in March and opened in August should offer August's answer, not
  // March's, and a month is the one thing here that a stale default gets
  // silently and completely wrong.
  month: null,

  monthChoices: 24,     // months offered in the picker


  // Open-Meteo's archive is reanalysis and trails real time by about five days.
  // This is that lag plus a margin: without it the picker offers a month still
  // missing its last week, which draws exactly like a complete one.
  monthSettleDays: 7,


  // The normal every panel is measured against. Ten years is long enough to
  // average out one freak month and short enough to still describe the climate
  // people actually remember.
  climatologyYears: 10,

  searchLimit: 8,

  searchDebounceMs: 0
};

// ---------------------------------------------------------------- where it sits

// The page is an article: a panel and the prose that reads it, side by side,
// mirrored between the first section and the third. So two of the three panels
// are drawn at a column width rather than the page width, and the widths below
// are the grid — charts/country-heat-anomaly/styles.css reads all of them out
// of LAYOUT.page and states none of its own.
//
//   |<------------------------ CANVAS_W (the strips panel) ------------------>|
//   | COLUMN_W          | GUTTER | note                       |   right      |
//   |<---------------------- STORY_W ------------------------->|   margin    |

const CANVAS_W = 1140;      // the page measure, and the wide panel's canvas
const COLUMN_W = 664;       // the two column panels' canvas, drawn 1:1
const GUTTER_W = 52;        // between a panel column and its note

// Both column panels move together: they are one axis read twice, mirrored
// across the page, so a difference between them would put the two zero lines at
// different distances from their own left edges and the mirror would stop
// reading as one scale. The narrower canvas buys the room back from the name
// column and the value margin, not from the plot.
const COLUMN_PANEL = {
  // No value column on the right: the ranked panel writes each reading at the
  // end of its own bar, so this is just the margin a plot needs. `valuePad` is
  // what actually holds the readings, at both ends of the axis, and it is the
  // larger of what the two panels need — outboard of a bar's tip here, inboard
  // of a dot there.
  margin: { right: 40 },
  // Narrower than the strips panel's, which has to hold a name beside a whole
  // month of bars. Here the name sits next to a single mark, and a column wide
  // enough for the worst name in the table leaves every ordinary one stranded
  // a long way from the thing it labels. 118px of it is usable, which covers
  // about 92 per cent of the bundled city names on one line; the rest wrap or
  // are set down, which fitLines already does and a row has the height for.
  name: { col: 132 },
  valuePad: 60
};

const RANKED = deepMerge(RANKED_DEVIATION_BARS_LAYOUT, COLUMN_PANEL);
const PAIRED = deepMerge(PAIRED_DEVIATION_DOTS_LAYOUT, COLUMN_PANEL);
const STRIPS = STACKED_RANGE_STRIPS_LAYOUT;

const PLOT_X = STRIPS.margin.left;
const PLOT_RIGHT = STRIPS.margin.right;

// Exactly the five numbers a panel's x-scale is built out of. Not the whole
// layout: the paired panel carries a key row and so needs a deeper top margin,
// and a difference there moves nothing horizontally. Checked rather than
// commented, because this is the kind of agreement that breaks silently the
// next time one component's own defaults are tuned.
const axisGeometry = (L, canvasW) =>
  [canvasW, L.margin.left, L.margin.right, L.name.col, L.valuePad].join("/");

if (axisGeometry(RANKED, COLUMN_W) !== axisGeometry(PAIRED, COLUMN_W)) {
  throw new Error("country-heat-anomaly: the ranked and paired panels have drifted "
    + "apart; they are one axis read twice, mirrored across the page, and must "
    + "share canvas, margins, name column and value padding or their zero lines "
    + "stop landing at the same place");
}

// One left edge for the whole page: the headline, the notes, the legend and the
// byline all hang on the inset below, and every panel puts its caption and its
// name column the same distance inside its own canvas — so a column panel and
// the full-width one under it start on the same line.
if (RANKED.margin.left !== PLOT_X) {
  throw new Error("country-heat-anomaly: the panels no longer share a left edge; "
    + "page chrome is inset to " + PLOT_X + " because that is where a panel's "
    + "caption starts");
}

// From the edge the captions start on to the edge the widest plot stops at.
const MEASURE_W = CANVAS_W - PLOT_X - PLOT_RIGHT;
// The grid the two split sections run on: the full measure plus the inset it
// starts inside, because a panel column begins at the page edge and only its
// contents are inset.
const STORY_W = PLOT_X + MEASURE_W;
const NOTE_W = STORY_W - COLUMN_W - GUTTER_W;

// Narrower than the measure on purpose: running text wants about seventy
// characters a line, and the standfirst is set at the width the export wraps it
// to, so the paragraph breaks at the same words on screen and in a download.
const PROSE_W = 620;
const LEGEND_BAR_W = 320;

if (NOTE_W < 300) {
  throw new Error("country-heat-anomaly: the note column is down to " + NOTE_W
    + "px, under about forty characters a line — widen CANVAS_W or narrow COLUMN_W");
}

const LAYOUT = {
  canvas: {

    strips: { w: CANVAS_W, h: stackedStripsHeight(STRIPS, CONFIG.cityCount) },
    paired: { w: COLUMN_W, h: pairedDeviationDotsHeight(PAIRED, CONFIG.cityCount) }
  },

  // Panel geometry, keyed by panel id. Each component merges its own defaults

  ranked: COLUMN_PANEL,
  paired: COLUMN_PANEL,

  // Four intervals, not the default five. A diverging ramp's whole subject is

  legend: { tickSteps: 4 },

  page: {
    maxWidth: CANVAS_W,
    prose: PROSE_W,
    foot: PROSE_W,
    inset: PLOT_X / CANVAS_W,
    measure: MEASURE_W / CANVAS_W,
    column: COLUMN_W,
    gutter: GUTTER_W,
    colorbar: LEGEND_BAR_W
  },

  // The download builds its own chrome, so it has to be told the same thing:
  // same anchor, same edges, one-line legend. It does not get the article — a
