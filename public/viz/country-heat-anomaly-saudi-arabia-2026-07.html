/* country-heat-anomaly only, appended after core/page.css by build/bundle.mjs.

   the toolbar down to the byline, and alternates: the ranked panel with its
   note on the right, the month full width, then the night/day panel with its
   note on the left. The mirror is the point — three panels down one column read
   as a list, and a reader stops looking for the argument between them.

   Every measurement here comes from the chart's LAYOUT, which derives them from
   the canvas widths the panels are actually drawn at:

     --page-inset    the panels' own left margin, so the headline hangs on the
                     same edge as the panel captions
     --page-measure  out to where the widest panel's plot stops
     --w-column      the width the two column panels are drawn at, so the grid
                     track they sit in is their canvas and they render 1:1
     --page-gutter   the space between that column and its note

   So there is no width in this file to keep in sync with chart.js. The two
   literals below are breakpoints, which a media query cannot read a custom
   property in. */

/* Wider margins than the shared default, and a slower vertical rhythm. The
   graphics are the loudest things on the page; what keeps them from reading as
   a dashboard is the amount of nothing around them. */
#app { padding: 44px 40px 76px; }

/* ---------------------------------------------------------------- toolbar */

/* Pickers left, downloads right, one hairline under both. Above the headline
   rather than under it: these change what the page is about, and a control that
   reframes the whole article belongs before it, not after. */
#masthead {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 14px 32px; flex-wrap: wrap;
  padding: 0 0 16px; margin: 0 0 54px;
  border-bottom: 1px solid var(--grid-line);
}
#controls { margin: 0; justify-content: flex-start; }
#downloadRow { margin: 0; }

/* ---------------------------------------------------------------- header */

#head { text-align: left; margin-left: var(--page-inset); max-width: var(--page-measure); }

/* No measure of its own: the headline runs the full width, from the edge the
   panel captions start on to the edge the widest plot stops at. That is also
   exactly what the export wraps its title to, so a two-line headline breaks at
   the same word on screen and in a download. */
#title { line-height: 1.12; }

#subtitle { margin-top: 16px; }

/* The standfirst: the finding, then how to read the page. One column, running
   the full measure under the headline. layout.export.description carries those
   same two facts to the download, so the paragraph breaks at the same words on
   screen and in a file. */
#description {
  /* max-width, explicitly: core/page.css caps this at the reading measure for a
     centred chart, and a rule that simply stops mentioning the property does
     not override it — it inherits the cap and stops short of the headline. */
  max-width: none; margin: 18px 0 0; text-align: left;
  font-size: var(--fs-notice); color: var(--ink); line-height: 1.5;
}

#nodata { margin-left: var(--page-inset); margin-right: 0; text-align: left; }

/* ---------------------------------------------------------------- sections */

/* A rule above each section, and enough air over it that the rule reads as the
   start of something rather than the underline of what came before. */
.story {
  margin-top: 78px; padding-top: 42px;
  border-top: 1px solid var(--grid-line);
}
/* Author-level, so it beats .story's own display rule — the UA [hidden] rule
   does not, and a failed load would leave three empty grids on the page. */

/* The panel column is its canvas width, fixed, so the graphic is never resampled
   to fit a grid; the note column takes what is left. Stopping at
   inset + measure is what puts the note's right edge on the same line the
   panels' plots stop at, rather than out at the page's own edge. */
.story-split {
  display: grid;
  grid-template-columns: var(--w-column) minmax(0, 1fr);
  column-gap: var(--page-gutter);
  max-width: calc(var(--page-inset) + var(--page-measure));
}
/* The mirror. Same grid, columns swapped, so the note is on the left and the
   panel on the right — and because the note is first in the markup, the reading
   order and the visual order still agree. */
.story-flip { grid-template-columns: minmax(0, 1fr) var(--w-column); }

/* The wide section is the full page, because the panel in it is: its canvas is
   the page measure. Only its prose and its legend take the inset.

   The lead-in spans that whole measure in one column, heading and prose alike,
   so it does not leave a hole beside a graphic that runs edge to edge. */
.story-intro, .story-wide #legend {
  margin-left: var(--page-inset); max-width: var(--page-measure);
}
.story-intro .nt-p { margin-top: 14px; }

/* The note column's first line sits level with the panel caption beside it,
   which with no line above the heading means the heading itself. Its last line
   sits level with the bottom of the panel: the grid row makes the column as
   tall as the graphic, and the closing figures take up the slack, so prose and
   chart start and finish together instead of one trailing off above the other. */
.story-text { padding-top: 2px; display: flex; flex-direction: column; }
.story-text .nt-stats { margin-top: auto; }
.nt-head { font-size: var(--fs-facet); margin-top: 9px; }
.nt-head:first-child { margin-top: 0; }

/* Panels are placed by their section now, so the stacked rhythm core/page.css
   gives them would just be a gap nobody asked for. */
.story .panel { margin-top: 0; }
.story-viz { min-width: 0; }

#legend { margin-top: 40px; justify-content: flex-start; }
.lg-cap { text-align: left; }
.viz-scroll { margin-top: 38px; }

/* ---------------------------------------------------------------- footer */

#foot {
  margin-top: 78px; padding-top: 26px;
  border-top: 1px solid var(--grid-line);
  margin-left: var(--page-inset); max-width: var(--page-measure);
}
#datasource, #signature { margin-left: 0; max-width: var(--w-prose); text-align: left; }
#datasource { margin-top: 0; }

/* ---------------------------------------------------------------- narrow */

/* One column, set where the note column would otherwise drop under about 40
   characters a line. The note goes under its panel in both sections — including
   the mirrored one, where the markup has it first, so it is moved rather than
   left to lead a chart the reader has not seen yet. The panel column is capped
   at its canvas so it stops at 1:1 instead of being scaled up to fill the page.
*/
@media (max-width: 1140px) {
  .story-split, .story-flip { grid-template-columns: minmax(0, 1fr); }
  .story-flip .story-text { order: 2; }
  .story-viz { max-width: var(--w-column); }
  .story-text { padding-top: 0; margin-top: 30px; max-width: var(--w-prose); }
}

/* Below this the panels stop being readable at the width they are given: the
   month's daily bars stop being separable, and the row labels fall under the
   12px floor the type scale is built on. So each panel keeps a workable width
   and its own container scrolls, rather than the whole page doing it. */
@media (max-width: 760px) {
  /* Two columns of forty characters is worse than one of eighty. */
  .story-intro { max-width: var(--w-prose); }
  .viz-scroll, .story-viz { overflow-x: auto; }
  .viz-scroll > .panel { min-width: 900px; }
  .story-viz > .panel { min-width: 560px; }
}

@media (max-width: 520px) {
  #app { padding: 28px 20px 56px; }
  #masthead { align-items: stretch; }
  #downloadRow { display: flex; gap: 8px; }
  #downloadBtn, #downloadPngBtn { flex: 1 1 auto; margin: 0; }
  .story { margin-top: 52px; padding-top: 28px; }
}

<div id="app">

  <!-- Interactive chrome. data-noexport documents that it never reaches a
       download; core/exporter.js is what enforces it. The two pickers and the
       two download buttons are one toolbar because they are one kind of thing:
       controls over the page, not part of the story told on it. -->
  <div id="masthead" data-noexport>
    <div id="controls">
      <div id="subjectpicker"></div>
      <div id="monthpicker"></div>
    </div>
    <div id="downloadRow">
      <button id="downloadBtn" type="button" disabled>Download SVG</button>
      <button id="downloadPngBtn" type="button" disabled>Download PNG</button>
    </div>
  </div>

  <!-- Headline, meta line, standfirst — all three written by the shell. -->
  <header id="head">
    <h1 id="title">How unusual was last month?</h1>
    <p id="subtitle">Loading…</p>
    <p id="description"></p>
  </header>

  <div id="nodata" hidden>
    <p class="nd-head"></p>
    <p class="nd-body"></p>
  </div>

  <!-- Three sections, in reading order: the ranked answer, the month it came
       out of, then the split inside it. Each is a panel and the prose that
       explains it; the two side-by-side sections mirror each other so the page
       alternates rather than marching down one column.

       Every section carries an id because the shell hides them with the panels
       when a load fails — a heading over an empty grid is worse than nothing. -->

  <section id="sec-rank" class="story story-split">
    <div class="story-viz">
      <svg id="ranked" class="panel" role="img" aria-label="Cities ranked by temperature anomaly"></svg>
    </div>
    <div class="story-text" id="note-rank"></div>
  </section>

  <!-- The wide one. A month of daily bars across six cities needs the full
       measure, so this section runs full width and puts its prose above the
       graphic instead of beside it. The colour ramp belongs here too: it
       describes these bars, not the two panels that only report a sign. -->
  <section id="sec-daily" class="story story-wide">
    <div class="story-intro" id="note-daily"></div>

    <div id="legend">
      <div class="lg-block">
        <div class="lg-cap"></div>
        <div id="colorbar"></div>
        <div id="colorticks"></div>
      </div>
      <div class="lg-keys"></div>
    </div>

    <!-- Scrolls rather than shrinks below the breakpoint: a month of daily bars
         squeezed into a phone's width is a texture, not a chart. -->
    <div class="viz-scroll">
      <svg id="strips" class="panel" role="img" aria-label="Daily temperature range by city"></svg>
    </div>
  </section>

  <!-- The mirror of the first: prose left, panel right. -->
  <section id="sec-split" class="story story-split story-flip">
    <div class="story-text" id="note-split"></div>
    <div class="story-viz">
      <svg id="paired" class="panel" role="img" aria-label="Night-time against daytime anomaly by city"></svg>
    </div>
  </section>

  <footer id="foot">
    <p id="datasource"></p>
    <p id="signature"></p>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
"use strict";
(function () {

/* ===== core/kit.js ===== */
// Small shared utilities: DOM access, fetch, object merge, polar geometry, SVG
// helpers and value formatting.
//
// These were six files of a dozen lines each. They are grouped here because
// none of them is worth opening on its own — you come looking for one helper,
// not for a module.

// ---------------------------------------------------------------- DOM

const Dom = {
  byId: (id) => document.getElementById(id),
  show: (id) => Dom.byId(id).removeAttribute("hidden"),
  // setAttribute, not `.hidden`: that property only exists on HTMLElement, so
  // assigning it to an <svg> panel silently does nothing.
  hide: (id) => Dom.byId(id).setAttribute("hidden", "")
};

// ---------------------------------------------------------------- fetch

/** Shared JSON fetch. Aborts on either the timeout or the caller's signal, so
 *  a slow source cannot hang the page and a superseded request can be dropped. */
async function fetchJSON(url, { timeoutMs = 8000, signal } = {}) {
  const ctrl = new AbortController();
  // The timeout and the caller's signal abort the same request, so both arrive
  // downstream as an AbortError — and they mean opposite things. A cancelled
  // request has been superseded and must stay silent; a timed-out one is a
  // failure the reader has to be told about. Conflated, every adapter that
  // rethrows AbortError to honour cancellation also swallows its own timeouts,
  // and a dead source shows as a page still reading "Loading" with nothing
  // behind it and no error anywhere. So the timeout is re-thrown as an ordinary
  // Error, which is what the shell knows how to show.
  let expired = false;
  const timer = setTimeout(() => { expired = true; ctrl.abort(); }, timeoutMs);
  if (signal) signal.addEventListener("abort", () => ctrl.abort(), { once: true });
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (e) {
    if (expired) throw new Error("timed out after " + Math.round(timeoutMs / 1000) + "s");
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// ---------------------------------------------------------------- merge

// Plain objects merge key by key; everything else replaces wholesale. So a chart
// can override one stroke colour without restating its weight and dash, but
// overriding a list is always a replacement rather than a confusing splice.

const isPlain = (v) => v !== null && typeof v === "object" && !Array.isArray(v);

function deepMerge(base, override) {
  if (!override) return base;
  const out = { ...base };
  for (const [k, v] of Object.entries(override)) {
    out[k] = isPlain(v) && isPlain(base[k]) ? deepMerge(base[k], v) : v;
  }
  return out;
}

// ---------------------------------------------------------------- polar

// Polar geometry, clockwise from the top: x = cx + r*sin(a), y = cy - r*cos(a).
// d3.arc() uses the same convention, so arcs and these helpers agree with no
// sign-flipping anywhere.

const TAU = Math.PI * 2;

function polar(cx, cy) {
  return {
    pt: (r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)],
    // Centre-relative, for anything inside the translated group — including
    // userSpaceOnUse gradients, which inherit that transform.
    rel: (r, a) => [r * Math.sin(a), -r * Math.cos(a)],

    start: (i, n) => i / n * TAU,
    end: (i, n) => (i + 1) / n * TAU,
    centre: (i, n) => (i + 0.5) / n * TAU,

    // d3.arc() draws around the origin. Without this every arc piles into the
    // top-left corner instead of forming a ring.
    transform: () => `translate(${cx},${cy})`
  };
}

// ---------------------------------------------------------------- SVG

const SVG_NS = "http://www.w3.org/2000/svg";

/** A detached SVG element, for the exporter — which builds a document rather
 *  than selecting into one. */
function svgEl(tag, attrs = {}, text) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text != null) node.textContent = text;
  return node;
}

/** A gradient running along a mark, sampling a colour scale between two values.
 *  A range bar is the one mark whose colour must vary *along* it, which a single
 *  fill cannot express. Every panel calls this rather than building its own. */
function appendValueGradient(defs, id, [x1, y1], [x2, y2], vLow, vHigh, colour, stops = 6) {
  const grad = defs.append("linearGradient")
    .attr("id", id).attr("gradientUnits", "userSpaceOnUse")
    .attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2);
  for (let k = 0; k <= stops; k++) {
    const v = vLow + (vHigh - vLow) * k / stops;
    grad.append("stop").attr("offset", (k / stops * 100) + "%").attr("stop-color", colour(v));
  }
  return `url(#${id})`;
}

/** Apply a theme stroke token, so a reference line's colour, weight and dash
 *  always travel together and cannot be half-copied. */
function applyStroke(sel, token) {
  sel.attr("stroke", token.color).attr("stroke-width", token.width);
  if (token.dash) sel.attr("stroke-dasharray", token.dash);
  return sel;
}

/** The horizontal axis a deviation panel is read against: gridlines through
 *  the plot, a rule under it, a tick under every labelled value, and the
 *  baseline named in words rather than drawn as "0".
 *
 *  Shared rather than written twice because the panels that use it are one axis
 *  read twice — a chart that mirrors a ranked panel and a paired one across a
 *  page needs the two to carry the same ticks in the same places, and two
 *  copies of this drift the first time either is tuned.
 *
 *  The zero *gridline* is left out: the panels draw it themselves, solid and on
 *  top of their marks, because it is the one reference everything is measured
 *  from and a bar drawn over it hides the edge being compared against. Its tick
 *  and its label still come from here, so the axis stays one object.
 *
 *  `S.axis` supplies: overhang (already applied to top/bottom by the caller),
 *  ruleGap (plot to rule), tickLen, tickGap (plot to label baseline).           */
function deviationAxis({ svg, S, T, F, x, ticks, top, bottom, baseline }) {
  const A = S.axis;
  const ruleY = bottom + A.ruleGap;

  ticks.forEach((t) => {
    if (t !== 0) {
      applyStroke(
        svg.append("line").attr("x1", x(t)).attr("x2", x(t))
          .attr("y1", top).attr("y2", bottom),
        T.stroke.grid
      );
    }
    applyStroke(
      svg.append("line").attr("x1", x(t)).attr("x2", x(t))
        .attr("y1", ruleY).attr("y2", ruleY + A.tickLen),
      T.stroke.bandEdge
    );
    svg.append("text").attr("x", x(t)).attr("y", bottom + A.tickGap)
      .attr("text-anchor", "middle").attr("class", "key-label")
      .text(t === 0 ? baseline : F.signedWhole(t));
  });

  // The rule after the ticks, spanning the scale rather than the canvas: an
  // axis line that runs past its own last tick claims the scale continues,
  // which on a domain rounded out to whole ticks it does not.
  applyStroke(
    svg.append("line")
      .attr("x1", x(ticks[0])).attr("x2", x(ticks[ticks.length - 1]))
      .attr("y1", ruleY).attr("y2", ruleY),
    T.stroke.rowDivider
  );
}

// ---------------------------------------------------------------- format

// Value to string. The generic half is the same for every chart; the domain
// half is not, so a chart supplies its own via makeFormat.
//
// A subject is whatever the chart is about — a city, a ticker, a repository:
//   { id, name, sublabel, detail }
// `name` is the headline, `sublabel` the short qualifier, `detail` the longer
// one shown only in the picker.

const FORMAT_DEFAULTS = {
  value: (v) => v.toFixed(1),
  valueWhole: (v) => String(v),
  // Rounded: decimals on an average imply a precision it does not have.
  valueRange: (lo, hi) => `${Math.round(lo)}–${Math.round(hi)}`,
  num: (v) => v.toFixed(1),
  key: (k) => (k instanceof Date ? k.toISOString().slice(0, 10) : String(k)),

  subjectTitle: (s) => [s.name, s.sublabel].filter(Boolean).join(", "),
  subjectLabel: (s) => [s.name, s.detail, s.sublabel].filter(Boolean).join(", ")
};

// One canvas for every measurement anywhere. The old code made a fresh one per
// wrap() call; a panel that measures a label per row would make one per row.
const measureContext = (() => {
  let c2d = null;
  return () => (c2d || (c2d = document.createElement("canvas").getContext("2d")));
})();

const FORMAT_SHARED = {
  // Here rather than a CSS text-transform, which is unevenly applied to <text>.
  caps: (s) => String(s).toUpperCase(),

  /** Real glyph metrics, for the places SVG gives us no CSS to lay text out
   *  with: wrapping a paragraph, sizing a legend key, fitting a row label. */
  textWidth(text, font) {
    const c2d = measureContext();
    c2d.font = font;
    return c2d.measureText(text).width;
  },

  /** Greedy wrap, for the export's description block and a panel's row labels.
   *  A word wider than the measure gets a line to itself and overruns it —
   *  there is nowhere to break — so a caller that cannot afford the overrun has
   *  to check the returned lines against `textWidth`. */
  wrap(text, maxWidthPx, font) {
    const lines = [];
    let line = "";
    for (const word of text.split(/\s+/)) {
      const test = line ? line + " " + word : word;
      if (line && this.textWidth(test, font) > maxWidthPx) { lines.push(line); line = word; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  },

  // So canvas measurement and the rendered text agree on the font.
  font: (sizePx, family) => `${sizePx}px ${family}`
};

/** Wrap, then even the lines out. A greedy wrap fills each line to the brim and
 *  leaves the last one with whatever is left, which for a headline means
 *  "...across Saudi" above a line reading "Arabia?". A balanced one breaks the
 *  same text into the same number of lines with the width shared between them.
 *
 *  Done by narrowing the measure until one more line would be needed: greedy
 *  wrapping at the narrowest width that still fits in n lines is as even as the
 *  words allow. Twenty-odd wraps of a short string, once per export.
 *
 *  For a headline, not for body copy — a paragraph wants a flush left edge and
 *  a full measure, and balancing it would just make it narrow. */
function wrapBalanced(text, maxWidthPx, font) {
  const lines = FORMAT_SHARED.wrap.call(FORMAT_SHARED, text, maxWidthPx, font);
  if (lines.length < 2) return lines;
  const fits = (w) =>
    FORMAT_SHARED.wrap.call(FORMAT_SHARED, text, w, font).length <= lines.length;
  let lo = 0, hi = maxWidthPx;
  while (hi - lo > 1) {
    const mid = (lo + hi) / 2;
    if (fits(mid)) hi = mid; else lo = mid;
  }
  return FORMAT_SHARED.wrap.call(FORMAT_SHARED, text, hi, font);
}

/** Fit a subject name into a fixed column: wrap it to the measure, and if a
 *  single word still overruns — there is nowhere to break "Chichicastenango" —
 *  report the ratio it has to be set down by. Shared by every panel that puts a
 *  name in a column beside its marks, so they all shrink at the same threshold.
 *
 *  `font` is the caller's, and it should be the *export* size: one SVG is drawn
 *  at both type scales and only the larger one can overflow. */
function fitLines(text, maxWidthPx, font) {
  const lines = FORMAT_SHARED.wrap.call(FORMAT_SHARED, text, maxWidthPx, font);
  const widest = Math.max(...lines.map((l) => FORMAT_SHARED.textWidth(l, font)));
  return { lines, shrink: widest > maxWidthPx ? maxWidthPx / widest : 1 };
}

const makeFormat = (overrides = {}) =>
  ({ ...FORMAT_DEFAULTS, ...FORMAT_SHARED, ...overrides });

/* ===== core/model.js ===== */
// Every derived number, computed once per load:
//   series  [{ key, low, high }]   key indexes the series — a Date, a label
//   subject { id, name, sublabel, detail }
//   band    { low, high, ...meta } | null
//
// Nothing positional lives here. `lo`/`hi` are the rounded value domain; each
// panel builds its own radial or cartesian scale from them, which is what lets
// a radial and a cartesian view share one model.

// Rounded out to whole gridlines, so bar lengths and grid density agree.
function valueDomain(series, tickStep) {
  const dataMin = d3.min(series, (d) => d.low);
  const dataMax = d3.max(series, (d) => d.high);
  return {
    dataMin, dataMax,
    lo: Math.floor(dataMin / tickStep) * tickStep,
    hi: Math.ceil(dataMax / tickStep) * tickStep
  };
}

// Colour tracks value across the range actually covered, so a uniformly cold
// city is not rendered entirely blue.
function colourScale(dataMin, dataMax, interpolate, invert) {
  const span = (dataMax - dataMin) || 1;
  return (v) => {
    const t = Math.max(0, Math.min(1, (v - dataMin) / span));
    return interpolate(invert ? 1 - t : t);
  };
}

function buildRangeModel({
  series,
  subject,
  band = null,
  tickStep = 5,
  interpolate = d3.interpolateRdYlBu,
  invert = true,        // RdYlBu runs blue->red, so high values want the far end
  labelTarget = 9,
  // Set by buildFacetedRangeModel so every facet shares one domain and one
  // colour scale. Without that, each row would be scaled to itself and the
  // rows could not be compared — which is the whole point of small multiples.
  shared = null
}) {
  if (!series || !series.length) throw new Error("buildRangeModel: empty series");

  const n = series.length;
  const { dataMin, dataMax, lo, hi } = shared || valueDomain(series, tickStep);
  const colour = shared ? shared.colour : colourScale(dataMin, dataMax, interpolate, invert);

  let maxIdx = 0, minIdx = 0;
  series.forEach((d, i) => {
    if (d.high > series[maxIdx].high) maxIdx = i;
    if (d.low < series[minIdx].low) minIdx = i;
  });

  const hasBand = !!(band && Number.isFinite(band.low) && Number.isFinite(band.high));

  return Object.freeze({
    series, subject, n,
    band: hasBand ? band : null,
    hasBand,
    dataMin, dataMax, lo, hi,
    ticks: d3.range(lo, hi + 0.001, tickStep),
    colour,
    medLow: d3.median(series, (d) => d.low),
    medHigh: d3.median(series, (d) => d.high),
    spread: d3.median(series, (d) => d.high - d.low),
    maxIdx, minIdx,
    // ~9 labels regardless of length: a fixed "every 7th slot" leaves a month
    // with 4 labels and a year with an unreadable crowd.
    labelStep: Math.max(1, Math.round(n / labelTarget)),
    firstKey: series[0].key,
    lastKey: series[n - 1].key,
    // Clamp a band bound into the domain, so an unusual window still renders
    // inside the panel instead of distorting the scale.
    clampToDomain(v) { return Math.max(this.lo, Math.min(this.hi, v)); }
  });
}

// Small multiples: many subjects, one shared scale.
//
// facets  [{ subject, series, band }]
//
// The union domain is computed across every facet before any sub-model is
// built, so a bar of the same length means the same value in every row. The
// result carries the same surface a plain range model does (dataMin, dataMax,
// colour, ticks) so the legend and header need no special case.
function buildFacetedRangeModel({
  facets,
  subject,
  tickStep = 5,
  interpolate = d3.interpolateRdYlBu,
  invert = true,
  labelTarget = 9
}) {
  if (!facets || !facets.length) throw new Error("buildFacetedRangeModel: no facets");

  const every = facets.flatMap((f) => f.series);
  const domain = valueDomain(every, tickStep);
  const colour = colourScale(domain.dataMin, domain.dataMax, interpolate, invert);
  const shared = { ...domain, colour };

  const models = facets.map((f) => buildRangeModel({ ...f, tickStep, labelTarget, shared }));
  const withBand = models.find((m) => m.hasBand);

  return Object.freeze({
    facets: models,
    subject,
    n: models.length,
    ...domain,
    colour,
    ticks: d3.range(domain.lo, domain.hi + 0.001, tickStep),
    hasBand: !!withBand,
    // All facets read the same archive window, so one representative set of
    // years is correct for the legend and the description.
    bandYears: withBand ? { fromYear: withBand.band.fromYear, toYear: withBand.band.toYear } : null,
    // The window is identical across facets; take it from the first.
    firstKey: models[0].firstKey,
    lastKey: models[0].lastKey,
    days: models[0].n,
    labelStep: models[0].labelStep
  });
}

// ---------------------------------------------------------------- anomaly

// A diverging scale, symmetric about zero. The symmetry is the whole point: an
// anomaly scale whose midpoint is not zero puts "normal" somewhere arbitrary in
// the ramp, and every colour on the page then means something other than it
// looks like. `limit` is what saturates at each end.
function divergingScale(limit, interpolate, invert) {
  const span = (2 * limit) || 1;
  return (a) => {
    const t = Math.max(0, Math.min(1, (a + limit) / span));
    return interpolate(invert ? 1 - t : t);
  };
}

// Rounded out to a whole tick, and never smaller than two ticks: a country
// whose cities all landed within a tenth of a degree of normal would otherwise
// get an axis a fraction of a degree wide, where rounding noise looks like a
// finding.
function symmetricLimit(values, step, minTicks = 2) {
  const peak = d3.max(values, (v) => Math.abs(v)) || 0;
  return Math.max(minTicks * step, Math.ceil(peak / step) * step);
}

// The colour ramp is scaled off a high quantile of the daily departures rather
// than their maximum. One freak day at +14 would otherwise set the ends of the
// ramp and leave every ordinary day sitting in the pale middle of it — the
// whole chart washed out by a single value. Past the quantile, colour clips,
// which is the right answer: those days are off the scale, and saying so is
// more useful than re-scaling everything else to accommodate them.
function rampLimit(values, step, quantile = 0.98) {
  const magnitudes = values.map((v) => Math.abs(v)).sort(d3.ascending);
  const q = d3.quantile(magnitudes, quantile) || 0;
  return Math.max(step, Math.ceil(q / step) * step);
}

// One calendar month, many cities, measured against the same month's normal.
//
// facets  [{ subject, series, band }]   band is the multi-year monthly normal
//
// Carries two domains, which is the thing to understand about this model:
//
//   lo / hi     absolute temperature — where a strip's bars sit
//   anom        departure from normal — the axis the ranked and paired panels
//               use, symmetric about zero
//   ramp        departure from normal again, but the *colour* domain, scaled to
//               daily spread rather than to monthly means
//
// The axis and the ramp are both anomalies and are still not the same numbers:
// a month's mean departure is small next to the day-to-day swing inside it. One
// domain for both would either flatten the ranked panel or blow out the strips.
function buildMonthAnomalyModel({
  facets,
  subject,
  month,
  tickStep = 5,
  // Two different jobs, deliberately two numbers.
  //
  // `anomAxisStep` is what the reader sees: the interval the anomaly axis is
  // ticked and labelled at, and the whole number its ends are rounded out to.
  // Wide, because a departure axis is read for *which side of normal and roughly
  // how far*, not off the gridlines — every mark on these panels carries its own
  // printed value to a tenth of a degree. Ticking it every degree spent nine
  // labels saying what three say, and the reader still read the numbers.
  //
  // `anomTickStep` is what the colour ramp is quantised to, so the legend ends
  // on a whole number. It is finer because daily departures are what the ramp
  // spans, and rounding those out to five degrees would throw the scale away.
  anomAxisStep = 5,
  anomTickStep = 1,
  interpolate = d3.interpolateRdYlBu,
  invert = true,          // RdYlBu runs blue->red, so a hot anomaly wants the far end
  labelTarget = 9
}) {
  if (!facets || !facets.length) throw new Error("buildMonthAnomalyModel: no facets");
  const usable = facets.filter((f) => f.series && f.series.length && f.band);
  if (!usable.length) throw new Error("buildMonthAnomalyModel: no facet has a normal to compare against");

  // Positions first: every row shares one absolute scale, so a bar of the same
  // height means the same temperature in every city.
  const domain = valueDomain(usable.flatMap((f) => f.series), tickStep);

  // Each day carries the departure of its own low and its own high. A night is
  // compared with normal nights and a day with normal days — comparing both
  // against one mid-point would report every night as cold and every day as
  // hot in a month that was entirely ordinary.
  const prepared = usable.map((f) => {
    const series = f.series.map((d) => ({
      ...d,
      cLow: d.low - f.band.low,
      cHigh: d.high - f.band.high
    }));
    const meanLow = d3.mean(series, (d) => d.low);
    const meanHigh = d3.mean(series, (d) => d.high);
    return {
      facet: { ...f, series },
      stats: {
        normalLow: f.band.low,
        normalHigh: f.band.high,
        meanLow, meanHigh,
        nightAnom: meanLow - f.band.low,
        dayAnom: meanHigh - f.band.high,
        // The mean of the two ends, not the mean of the daily means: a month's
        // low and high are what the normal is stated as, so this is the same
        // arithmetic on both sides of the subtraction.
        meanAnom: (meanLow + meanHigh) / 2 - (f.band.low + f.band.high) / 2
      }
    };
  });

  const monthly = prepared.flatMap((p) => [p.stats.dayAnom, p.stats.nightAnom, p.stats.meanAnom]);
  const daily = prepared.flatMap((p) => p.facet.series.flatMap((d) => [d.cLow, d.cHigh]));

  // One tick minimum, not two: at a five-degree step a single tick each side is
  // already a five-degree axis, and an ordinary month would otherwise be drawn
  // on a ±10° scale with every bar in the middle third of it.
  const anomLimit = symmetricLimit(monthly, anomAxisStep, 1);
  const colour = divergingScale(rampLimit(daily, anomTickStep), interpolate, invert);
  const shared = { ...domain, colour };

  const models = prepared.map((p) => Object.freeze({
    ...buildRangeModel({ ...p.facet, tickStep, labelTarget, shared }),
    ...p.stats
  }));

  // Ranked, and every panel draws them in this order — the ranking is the
  // finding, and a reader who has learnt the order in the top panel can carry
  // it down the page instead of re-reading six names in a new sequence.
  const ranked = [...models].sort((a, b) => d3.descending(a.meanAnom, b.meanAnom));

  const longest = ranked.reduce((a, m) => (m.n > a.n ? m : a), ranked[0]);
  const rampEnd = rampLimit(daily, anomTickStep);

  return Object.freeze({
    facets: ranked,
    subject,
    month,
    n: ranked.length,
    ...domain,
    colour,
    ticks: d3.range(domain.lo, domain.hi + 0.001, tickStep),

    // The symmetric axis the ranked and paired panels measure against.
    anom: Object.freeze({
      lo: -anomLimit, hi: anomLimit, limit: anomLimit, tickStep: anomAxisStep,
      ticks: d3.range(-anomLimit, anomLimit + 0.001, anomAxisStep)
    }),

    // What the legend draws. Present so the legend stops assuming the ramp and
    // the value axis are the same numbers — here they are not even the same
    // quantity.
    //
    // `cool` and `warm` are for a mark whose *length* already carries the
    // magnitude. Sampling the ramp at that mark's own value would encode the
    // number twice on two different scales — the ramp spans daily swings, the
    // mark spans monthly means — and a bar could then reach the end of its axis
    // while sitting in the pale middle of its colour. These say only which side
    // of normal a thing fell on, in the language the rest of the page uses.
    // Two thirds of the way out, not the full end: the extremes belong to the
    // days that earned them.
    ramp: Object.freeze({
      min: -rampEnd, max: rampEnd, colour,
      cool: colour(-rampEnd * (2 / 3)),
      warm: colour(rampEnd * (2 / 3))
    }),

    hasBand: true,
    bandYears: { fromYear: month.fromYear, toYear: month.toYear },
    firstKey: longest.firstKey,
    lastKey: longest.lastKey,
    days: longest.n,
    labelStep: longest.labelStep,
    warmest: ranked[0],
    coolest: ranked[ranked.length - 1]
  });
}

/* ===== core/theme.js ===== */
// Every design decision a chart can override, and the CSS they compile into.
//
// Three sections, in the order you would change them:
//   BASE_THEME    colour, type, stroke and mark sizes
//   BASE_LAYOUT   page measures and the export vertical rhythm
//   makeStyle     both of the above, emitted as CSS for the page and the export
//
// A chart states only what it moves; deepMerge fills in the rest.



// ---------------------------------------------------------------- theme

// PALETTE exists so a grey is named once: the single-file version declared the
// same hex as both `color.gridLine` and `stroke.grid.color`, free to drift.
const PALETTE = {
  ink: "#23262b",         // ~15:1 on paper
  secondary: "#565b62",   // ~6.8:1
  tertiary: "#6b7078",    // ~5:1
  paper: "#ffffff",
  gridLine: "#d9dbdf",
  spoke: "#c9ccd1",
  hubStroke: "#e6e8eb",
  bandStroke: "#6e7681",  // ~4.4:1 — the inside/outside boundary
  bandFill: "#e9edf1",
  medianHigh: "#80868e",
  medianLow: "#9aa1a9",

  // The only two hues in the base theme. Everything else here is grey, because
  // a chart's colour normally comes from its value scale — these are for the
  // other case: a panel comparing two *named* series, where colour identifies
  // which is which and carries no magnitude at all.
  seriesA: "#2f5d8a",     // ~6.9:1 on paper
  seriesB: "#b4531b"      // ~5.0:1 on paper
};

const BASE_THEME = {
  // The three text tiers are all >= 4.5:1 on white (WCAG AA). Check the ratio
  // before lightening any of them: muted and illegible look alike on screen.
  color: {
    ink: PALETTE.ink,
    secondary: PALETTE.secondary,
    tertiary: PALETTE.tertiary,
    paper: PALETTE.paper,

    gridLine: PALETTE.gridLine,
    spoke: PALETTE.spoke,
    hubStroke: PALETTE.hubStroke,

    // Reference-line hierarchy, strongest first. The band's edges outrank the
    // medians on purpose — the other way round, the band reads as decoration.
    bandStroke: PALETTE.bandStroke,
    bandFill: PALETTE.bandFill,
    medianHighLine: PALETTE.medianHigh,
    medianLowLine: PALETTE.medianLow,

    // Two categorical marks, for a panel that compares two series of the same
    // quantity rather than plotting one across a scale. A panel using these
    // must also give the two different shapes: eight percent of men cannot
    // separate a warm hue from a cool one, and nobody can once a download has
    // been printed or screenshotted in grey.
    series: { a: PALETTE.seriesA, b: PALETTE.seriesB },

    // Interactive chrome only. Never drawn into a chart or an export.
    ui: {
      border: "#d9dbdf",
      borderHover: "#b7bbc2",
      focus: "#8f959d",
      surfaceActive: "#f1f3f5",
      placeholder: "#9aa0a7",
      buttonInk: "#4a4e54",
      shadow: "rgba(35, 38, 43, 0.10)"
    }
  },

  type: {
    // System stacks, no web fonts: a downloaded chart must render identically
    // offline, on a machine that has never seen it.
    serif: '"Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif',
    sans: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
    // A ~1.2 ratio from a 12px floor. The floor is what matters: these charts
    // are made to be exported and read as a picture — dropped in a slide,
    // scaled to fit a viewer, posted to a feed — where the smallest tier
    // carries the axis dates, the tick values and the byline. Below 12 those
    // are the first thing to go, and no amount of export scaling rescues a
    // hierarchy that started out too tight to have one.
    //
    // Every number here is a page size. An export multiplies all of them by
    // layout.export.typeScale, so the tier that has to survive at a distance
    // is `meta`, and it lands at 15.
    size: {
      title: 32,
      titleCompact: 25,   // narrow viewports only
      hub: 23,            // the ring's centre name
      facet: 21,          // a strip's subject name — the label for a whole row
      notice: 18,
      subtitle: 15,
      body: 14,
      note: 13,
      meta: 12            // nothing goes below this — smaller strains to read
    },
    // 400, not 500: Georgia ships regular and bold only, and browsers resolve a
    // missing weight inconsistently. Let the serif carry hierarchy.
    weight: { normal: 400, strong: 600 },
    tracking: { eyebrow: "0.6px", sub: "1.5px" },
    proseLeading: 1.55,
    exportLeading: 21,     // px between wrapped description lines in an export
    centreDy: "0.32em"     // optical vertical centring for SVG <text>
  },

  stroke: {
    grid: { color: PALETTE.gridLine, width: 1, dash: "2,4" },
    spoke: { color: PALETTE.spoke, width: 1, dash: "1,4" },
    medianHigh: { color: PALETTE.medianHigh, width: 1.1, dash: "1,3" },
    medianLow: { color: PALETTE.medianLow, width: 1.1, dash: "5,4" },
    // Solid, where every other reference line is dashed, so the band's
    // thresholds are never confused with the grid or the medians.
    bandEdge: { color: PALETTE.bandStroke, width: 1.4 },
    // Between subjects in a small-multiples panel, not inside one. The lightest
    // line in the theme on purpose: it separates rows without joining the
    // hierarchy of reference lines that carry meaning within a row.
    rowDivider: { color: PALETTE.gridLine, width: 1 },
    hub: { color: PALETTE.hubStroke, width: 1 },
    tick: { width: 1 },
    tickExtreme: { width: 1.6 }
  },

  mark: {
    barCorner: 2.5,
    barGap: 0.004,        // radians trimmed off each end, so bars don't touch
    gradientStops: 6,
    dotR: 2.6,
    dotHaloWidth: 1       // paper-coloured, so the dot reads over any bar
  }
};

const makeTheme = (overrides) => deepMerge(BASE_THEME, overrides);

// ---------------------------------------------------------------- layout

// Page-level measures only. A panel owns its own geometry and exports its
// defaults, so a chart that uses neither the ring nor the strip carries
// neither one's numbers.
const BASE_LAYOUT = {
  // Keyed by panel id. Written to each viewBox before the first fetch, so the
  // page reserves the chart's height instead of jumping when data lands.
  canvas: {},

  // `prose` is also the width the export wraps its description to, so the
  // paragraph breaks the same way on screen and in a download.
  //
  // `inset` and `measure` are fractions of the page width, published to CSS as
  // --page-inset and --page-measure. A chart whose page runs flush with its
  // panel derives them from that panel's margins, so the text edge follows the
  // plot edge instead of being a second number free to drift. The default is
  // the full width, which the centred layout in page.css ignores.
  //
  // `column` and `gutter` are the same idea one level up, for a page that sets
  // a panel beside its prose: the width of the panel's column and the space
  // between it and the text. Published as --w-column and --page-gutter, and
  // `column` is the canvas width that panel is actually drawn at — so the
  // column cannot end up a different width from the graphic inside it, and the
  // panel renders at 1:1 rather than at whatever the grid left it. Zero is no
  // second column, which every stacked layout ignores.
  //
  // `colorbar` is published as --w-colorbar for a chart that puts its ramp and
  // its keys on one line; page.css leaves the ramp full-width and ignores it.
  page: {
    maxWidth: 820, prose: 620, foot: 620, notice: 480, search: 300,
    inset: 0, measure: 1, column: 0, gutter: 0, colorbar: 320
  },

  legend: {
    gradientSteps: 10,   // colour-bar stops, minus one
    tickSteps: 5,
    keyLine: { w: 34, h: 10 }
  },

  // The export cannot rely on DOM flow for its sequence, so its vertical rhythm
  // is explicit — these are the gaps between sections, in stacking order.
  export: {
    // Title, subtitle, description, legend and footer are centred on the
    // canvas. A chart with a left-aligned page sets anchor "start" and the same
    // inset its panels use, so the download does not quietly re-centre chrome
    // the reader just saw hanging off a left edge. `inset` is in canvas units.
    // `insetRight` is separate because a panel's right margin is rarely its
    // left one: the strips chart starts its chrome at the plot's left edge but
    // has to stop where the bars stop, not where the canvas does.
    align: { anchor: "middle", inset: 0, insetRight: 0 },

    // Keys beside the colour bar rather than under it, so the whole legend —
    // ramp, ticks and every key — reads as one line. Set false to stack the
    // keys below instead, which is a taller legend for the same file.
    keysInline: true, keysInlineGap: 22,

    // A download is read at a distance the page is not: dropped into a slide,
    // scaled to fit an image viewer, or posted to a feed. At the page's own
    // ratio the 10px labels survive none of that, so every type size in an
    // export is multiplied by this — and so is every gap and key metric that
    // has to move with it. The hierarchy is untouched; only the ratio between
    // the words and the marks changes.
    //
    // 1.25, not more: the panels and the colour ramp keep their own geometry,
    // so this is bounded by how much room a label has before it reaches its
    // neighbour. Most of the lift now lives in type.size instead, which the
    // panel geometry is measured against directly — a ratio that has to
    // rescue an undersized ramp on its own always runs out of room first.
    typeScale: 1.25,

    titleY: 40, subtitleY: 68,
    // A headline in a download is one line: it is the first thing read, and a
    // two-line one in a picture reads as two headlines. Its length is entirely
    // the subject's doing — "Democratic Republic of the Congo" is nobody's
    // layout decision — so what gives is the size, not the line count: the
    // title is set down until it fits the measure. `titleMinScale` is the
    // fraction of full size past which it has stopped being a headline at all;
    // below that it wraps instead, at full size, and `titleLeading` is the
    // space between those lines.
    titleMinScale: 0.5,
    titleLeading: 38,
    descriptionGap: 26, descriptionGapAfter: 32,
    // Negative space around the whole download, on every side. A file that runs
    // to its own edge reads as cropped the moment it is pasted onto anything.
    // Not multiplied by typeScale — this is margin, not type.
    pad: 50,

    // barW is the ramp's width when the keys are stacked under it. With inline
    // keys the ramp instead fills whatever they leave, so that the legend spans
    // the same measure as the chart; barMinW is the floor, below which a
    // gradient stops reading as one.
    legendBarGap: 18, barW: 420, barMinW: 150,
    barH: 12, barRadius: 2, tickGap: 18, keysGap: 28,
    panelLeadGap: 56,   // legend keys -> first panel
    panelGap: 36,       // between panels
    sourceGap: 40, signatureGap: 20, bottomPad: 16,

    // A download that drops the page's prose leaves a hole where the prose
    // was: a panel with a note beside it is narrower than the canvas, and
    // nothing fills the rest. So the export draws the notes too, into the same
    // column the page puts them in — see `notes` in a chart definition.
    //
    // `description` is the standfirst: `width` is "prose" for the readable
    // measure a centred page keeps it at, or "measure" for a page that runs it
    // edge to edge, and `columns` splits whichever of the two is chosen. Set
    // both to match the page, or the paragraph breaks at different words on
    // screen and in the file.
    // Everything under `note` is a page-unit gap and scales with the type;
    // `ascent`/`descent` are the fractions of a font size above and below its
    // baseline, which is how a block of <text> gets a height at all.
    description: { width: "prose", columns: 1 },
    noteGap: 26,
    note: {
      eyebrowTop: 0, headTop: 10, ledeTop: 14, paraTop: 12,
      statsTop: 20, statRowTop: 7, statRowBottom: 7, statGap: 12,
      proseLeading: 1.55, headLeading: 1.26, eyebrowLeading: 1.35,
      ascent: 0.8, descent: 0.25,
      // Notes keep the page's own type size rather than taking `typeScale`.
      // That scale exists so a chart's *labels* survive a download being read
      // small; a note is running prose, and the column it gets is the same
      // width in the file as on the page — so scaling it up would only make it
      // a quarter longer than the graphic it was written to sit beside. Raise
      // this for a download meant to be read at a distance, and expect a note
      // to outrun its panel.
      scale: 1
    },
    keysRise: 8,
    keySwatch: { w: 20, h: 11 },
    keyLine: { w: 26, y: 5 },
    keyLabel: { x: 30, y: 10 },
    // How many device pixels a download gets per page unit. The SVG is the
    // lossless copy; the PNG is the one that actually gets pasted into a slide,
    // a doc or a feed, and at 2 the smallest tier — axis labels, tick values,
    // the byline — was arriving at roughly 30px tall in a file people then view
    // at half size. 3.5 is a 4000px-wide picture whose 15px labels rasterise at
    // 52, which survives that trip.
    //
    // Bounded, because a canvas is not: browsers refuse one past a maximum
    // dimension or total area and hand back a blank or a null blob rather than
    // an error, so a tall chart at a high scale would silently download an
    // empty file. The exporter scales down to fit these instead — a slightly
    // smaller picture beats no picture. Chrome's own ceilings are 65535 per
    // side and about 2**28 pixels; these sit well inside both, with room for the
    // memory the rasterisation itself needs.
    pngScale: 3.5,
    pngMaxSide: 16000,
    pngMaxPixels: 8e7
  }
};

const makeLayout = (overrides) => deepMerge(BASE_LAYOUT, overrides);

// ---------------------------------------------------------------- style

// The theme compiled into CSS: custom properties for page.css, plus the classes
// used inside panel <svg>s. The page and the export consume the same svgRules()
// string — they used to carry separate copies, free to drift.

function makeStyle(theme, layout) {
  return {
    vars() {
      const { color: c, type: t } = theme;
      const p = layout.page;
      return `:root{
      --ink:${c.ink};
      --secondary:${c.secondary};
      --tertiary:${c.tertiary};
      --paper:${c.paper};
      --band-fill:${c.bandFill};
      --band-stroke:${c.bandStroke};
      --grid-line:${c.gridLine};
      --line:${c.ui.border};
      --line-hover:${c.ui.borderHover};
      --focus:${c.ui.focus};
      --surface-active:${c.ui.surfaceActive};
      --placeholder:${c.ui.placeholder};
      --button-ink:${c.ui.buttonInk};
      --shadow:${c.ui.shadow};
      --font-sans:${t.sans};
      --font-serif:${t.serif};
      --fs-title:${t.size.title}px;
      --fs-title-compact:${t.size.titleCompact}px;
      --fs-facet:${t.size.facet}px;
      --fs-notice:${t.size.notice}px;
      --fs-subtitle:${t.size.subtitle}px;
      --fs-body:${t.size.body}px;
      --fs-note:${t.size.note}px;
      --fs-meta:${t.size.meta}px;
      --weight-normal:${t.weight.normal};
      --weight-strong:${t.weight.strong};
      --tracking-eyebrow:${t.tracking.eyebrow};
      --leading-prose:${t.proseLeading};
      --w-page:${p.maxWidth}px;
      --w-prose:${p.prose}px;
      --w-foot:${p.foot}px;
      --w-notice:${p.notice}px;
      --w-search:${p.search}px;
      --page-inset:${p.inset * 100}%;
      --page-measure:${p.measure * 100}%;
      --page-gutter:${p.gutter}px;
      --w-column:${p.column}px;
      --w-colorbar:${p.colorbar}px;
    }`;
    },

    // `scale` multiplies every font size. The page renders at 1; an export
    // renders at layout.export.typeScale. One rule set, two ratios — the page
    // and the download cannot drift into different type hierarchies.
    svgRules(scale = 1) {
      const { color: c, type: t } = theme;
      const fs = (v) => +(v * scale).toFixed(2);
      return `
    .panel-cap { fill:${c.tertiary}; font-size:${fs(t.size.meta)}px; font-weight:${t.weight.strong}; letter-spacing:${t.tracking.eyebrow}; text-transform:uppercase; }
    .value-label { fill:${c.tertiary}; font-size:${fs(t.size.meta)}px; font-variant-numeric:tabular-nums; }
    .key-label { fill:${c.tertiary}; font-size:${fs(t.size.meta)}px; font-variant-numeric:tabular-nums; }
    .extreme-label { fill:${c.ink}; font-weight:${t.weight.strong}; }
    .band-cap { font-size:${fs(t.size.note)}px; font-weight:${t.weight.strong}; fill:${c.secondary}; }
    .band-cap-sub { font-size:${fs(t.size.meta)}px; fill:${c.tertiary}; font-variant-numeric:tabular-nums; }
    .hub-name { font-family:${t.serif}; font-weight:${t.weight.normal}; font-size:${fs(t.size.hub)}px; fill:${c.ink}; }
    .hub-sub { font-size:${fs(t.size.meta)}px; letter-spacing:${t.tracking.sub}; fill:${c.tertiary}; }
    .facet-name { font-family:${t.serif}; font-weight:${t.weight.strong}; font-size:${fs(t.size.facet)}px; fill:${c.ink}; }
    .facet-sub { font-size:${fs(t.size.meta)}px; fill:${c.tertiary}; font-variant-numeric:tabular-nums; }
    .row-name { font-family:${t.serif}; font-weight:${t.weight.strong}; font-size:${fs(t.size.subtitle)}px; fill:${c.ink}; }
    .row-value { font-size:${fs(t.size.note)}px; font-weight:${t.weight.strong}; fill:${c.ink}; font-variant-numeric:tabular-nums; }`;
    },

    // The page rules plus the blocks only a standalone file needs.
    exportRules() {
      const { color: c, type: t } = theme;
      const scale = layout.export.typeScale;
      const fs = (v) => +(v * scale).toFixed(2);
      // Note prose runs at its own ratio — see layout.export.note.scale.
      const nfs = (v) => +(v * layout.export.note.scale).toFixed(2);
      return `
    text { font-family:${t.sans}; }
    .export-title { font-family:${t.serif}; font-weight:${t.weight.normal}; font-size:${fs(t.size.title)}px; fill:${c.ink}; }
    .export-subtitle { font-size:${fs(t.size.subtitle)}px; fill:${c.secondary}; font-variant-numeric:tabular-nums; }
    .export-description { font-size:${fs(t.size.body)}px; fill:${c.secondary}; }
    .export-datasource, .export-signature { font-size:${fs(t.size.meta)}px; fill:${c.tertiary}; }
    .export-legend-cap { font-size:${fs(t.size.meta)}px; fill:${c.tertiary}; font-weight:${t.weight.strong}; letter-spacing:${t.tracking.eyebrow}; text-transform:uppercase; }
    .export-legend-tick { font-size:${fs(t.size.meta)}px; fill:${c.tertiary}; font-variant-numeric:tabular-nums; }
    .export-legend-key { font-size:${fs(t.size.body)}px; fill:${c.tertiary}; }
    .export-note-eyebrow { font-size:${nfs(t.size.meta)}px; fill:${c.tertiary}; font-weight:${t.weight.strong}; letter-spacing:${t.tracking.eyebrow}; }
    .export-note-head { font-family:${t.serif}; font-weight:${t.weight.normal}; font-size:${nfs(t.size.facet)}px; fill:${c.ink}; }
    .export-note-lede { font-size:${nfs(t.size.body)}px; fill:${c.ink}; }
    .export-note-body { font-size:${nfs(t.size.body)}px; fill:${c.secondary}; }
    .export-note-label { font-size:${nfs(t.size.meta)}px; fill:${c.tertiary}; font-weight:${t.weight.strong}; letter-spacing:${t.tracking.eyebrow}; }
    .export-note-meta { font-size:${nfs(t.size.meta)}px; fill:${c.tertiary}; }
    .export-note-value { font-family:${t.serif}; font-size:${nfs(t.size.notice)}px; fill:${c.ink}; font-variant-numeric:tabular-nums; }`
        + this.svgRules(scale);
    },

    install() {
      const el = document.createElement("style");
      el.id = "chart-theme";
      el.textContent = this.vars() + this.svgRules();
      document.head.appendChild(el);
    }
  };
}

/* ===== core/exporter.js ===== */
// Rebuilds the whole page as a standalone SVG: title, subtitle, description,
// legend and footer drawn fresh, panels cloned wholesale.
//
// Interactive chrome cannot leak into a download — this builds a new document
// and clones only the declared panels. data-noexport in page.html documents
// that contract; this is what enforces it.



function makeExporter(ctx) {
  let legendModel = null;
  let notes = [];

  // Type in a download is larger than on the page (layout.export.typeScale), so
  // every measure that exists to separate two pieces of text has to grow with
  // it — otherwise bigger words land in the same gaps and the legend collides
  // with its own keys. `s()` marks exactly those. What it is deliberately not
  // applied to: the colour ramp's width, the panels, and align.inset, which is
  // locked to a panel edge and would stop lining up if it drifted.
  const K = ctx.layout.export.typeScale;
  const s = (v) => v * K;

  // Real glyph metrics. The key row needs them: a fixed slot per key is either
  // wasteful or — once the type scales — too narrow, and too narrow means the
  // next key lands on top of the previous label.
  const measureText = (text, font) => ctx.format.textWidth(text, font);

  // A key is a swatch plus a label, and the label is text — so this is the one
  // part of the legend whose width is a fact rather than a choice.
  const sizeKeys = (keys, font) => {
    const labelX = s(ctx.layout.export.keyLabel.x);
    return keys.map((k) => ({ ...k, w: labelX + measureText(k.label, font) }));
  };

  const rowWidth = (sized, gap) =>
    sized.reduce((a, k) => a + k.w, 0) + Math.max(0, sized.length - 1) * gap;

  // Keys flow left to right and wrap when the next one would run past the right
  // edge, so the legend grows a row instead of running off the canvas. That is
  // what lets typeScale move, or a chart add a fourth key, without anyone
  // having to re-tune a slot width by hand.
  function layoutKeys(sized, x0, rightEdge, W) {
    const gap = s(ctx.layout.export.keysInlineGap);

    const rows = [];
    let row = [], rowW = 0;
    for (const k of sized) {
      const add = row.length ? gap + k.w : k.w;
      if (row.length && x0 + rowW + add > rightEdge) {
        rows.push({ items: row, w: rowW });
        row = []; rowW = 0;
      }
      rowW += row.length ? gap + k.w : k.w;
      row.push(k);
    }
    if (row.length) rows.push({ items: row, w: rowW });

    // Centred blocks centre each row on its own width; a left-aligned one keeps
    // every row on the same edge as the rest of the chrome.
    return rows.map((r) => {
      let x = x0 === null ? (W - r.w) / 2 : x0;
      return r.items.map((k) => {
        const placed = { ...k, x };
        x += k.w + gap;
        return placed;
      });
    });
  }

  // ---- notes ------------------------------------------------------------

  // The page's prose, laid out as <text> in a column of `w`. Same five block
  // kinds core/app.js renders as HTML, same order, same words — the blocks come
  // straight from Notes.render rather than being derived a second time here.
  //
  // Returns placed items plus the height the column came to. The height is the
  // point: a section in the download is as tall as its prose when the prose
  // outruns the panel, which is what stops the two overlapping.
  function layoutNote(blocks, w, x0) {
    const T = ctx.theme.type, N = ctx.layout.export.note;
    // Notes have a type ratio of their own, so their sizes and the gaps between
    // them scale together and independently of the chart's labels.
    const n = (v) => v * N.scale;
    const items = [];
    // Where the closing figures start, so a caller with room to spare can drop
    // them to the foot of the column — the page's `margin-top: auto`, which SVG
    // has no equivalent of.
    let tailFrom = -1;
    let y = 0;

    // One run of wrapped text. `y` tracks the bottom edge of what has been
    // placed; a baseline is that edge plus the font's ascent, because SVG text
    // hangs off a baseline and a CSS block does not.
    const run = (text, size, family, cls, leadRatio, top) => {
      // The gaps are between blocks, so the first one in a column starts at its
      // own top edge — otherwise a note hangs lower than the panel beside it by
      // however much its opening block happened to ask for.
      if (items.length) y += n(top);
      const leading = size * leadRatio;
      const lines = ctx.format.wrap(text, w, ctx.format.font(size, family));
      lines.forEach((line, i) => items.push({
        text: line, cls, x: x0, y: y + size * N.ascent + i * leading
      }));
      y += size * N.ascent + (lines.length - 1) * leading + size * N.descent;
    };

    for (const b of blocks) {
      if (b.kind === "eyebrow") {
        // Uppercased here rather than by CSS: text-transform is unevenly
        // applied to <text>, which is why the panel captions do the same.
        run(ctx.format.caps(b.text), n(T.size.meta), T.sans,
          "export-note-eyebrow", N.eyebrowLeading, N.eyebrowTop);
      } else if (b.kind === "head") {
        run(b.text, n(T.size.facet), T.serif, "export-note-head",
          N.headLeading, N.headTop);
      } else if (b.kind === "lede") {
        run(b.text, n(T.size.body), T.sans, "export-note-lede",
          N.proseLeading, N.ledeTop);
      } else if (b.kind === "p") {
        run(b.text, n(T.size.body), T.sans, "export-note-body",
          N.proseLeading, N.paraTop);
      } else if (b.kind === "stats") {
        tailFrom = items.length;
        if (items.length) y += n(N.statsTop);
        for (const item of b.items) {
          const size = n(T.size.notice);
          const meta = ctx.format.font(n(T.size.meta), T.sans);
          items.push({ rule: true, x: x0, y, w });
          y += n(N.statRowTop);
          const base = y + size * N.ascent;
          const label = ctx.format.caps(item.label);
          const labelW = measureText(label, meta);
          const valueW = measureText(item.value, ctx.format.font(size, T.serif));
          const gap = n(N.statGap);
          items.push({ text: label, cls: "export-note-label", x: x0, y: base });
          items.push({
            text: item.value, cls: "export-note-value",
            x: x0 + w, anchor: "end", y: base
          });
          // The qualifier is the first thing to go when a row is too narrow for
          // all three: it names the figure, and the figure survives without it.
          if (item.note
            && labelW + gap + measureText(item.note, meta) + gap + valueW <= w) {
            items.push({
              text: item.note, cls: "export-note-meta",
              x: x0 + w - valueW - gap, anchor: "end", y: base
            });
          }
          y = base + size * N.descent + n(N.statRowBottom);
        }
      } else {
        throw new Error('Unknown note block "' + b.kind + '" in the export');
      }
    }
    return { items, height: y, tailFrom };
  }

  // What a block asks for above itself. The same numbers layoutNote applies
  // between two blocks, named once so a column that has to reproduce that gap
  // across a call boundary cannot quietly pick a different one.
  function noteBlockTop(kind) {
    const N = ctx.layout.export.note;
    const top = { lede: N.ledeTop, p: N.paraTop, stats: N.statsTop }[kind];
    if (top == null) throw new Error('Unknown note block "' + kind + '" in the export');
    return top;
  }

  // A note above a full-width panel: its heading spans the measure and its
  // paragraphs run in columns under it, which is what the page does. Whole
  // paragraphs are dealt into the columns rather than lines being poured
  // through them — a paragraph torn across a fold is harder to read than an
  // uneven column.
  function layoutNoteColumns(blocks, totalW, x0, columns) {
    const gutter = ctx.layout.page.gutter;
    const heads = blocks.filter((b) => b.kind === "eyebrow" || b.kind === "head");
    const flow = blocks.filter((b) => !(b.kind === "eyebrow" || b.kind === "head"));

    const top = layoutNote(heads, totalW, x0);
    const colW = (totalW - (columns - 1) * gutter) / columns;
    const cols = Array.from({ length: columns }, () => []);
    flow.forEach((b, i) => cols[i % columns].push(b));

    // The space under the heading has to be put back by hand here. layoutNote
    // only ever puts a gap *between* blocks, and each column is a fresh call
    // whose first block therefore starts flush at its own top edge — correct
    // inside a column, wrong under a heading the columns are running below.
    // Without this the heading and the first line of prose sit a bare descender
    // apart in a download while the same two are a clear line apart on the page,
    // and only the one section whose note runs above its panel is affected.
    //
    // The gap the *first* block would have asked for, given to every column, so
    // they still start on one line rather than stepping down past each other.
    const lead = top.items.length && flow.length
      ? noteBlockTop(flow[0].kind) * ctx.layout.export.note.scale
      : 0;

    const items = [...top.items];
    let tallest = 0;
    cols.forEach((blocksInCol, i) => {
      const laid = layoutNote(blocksInCol, colW, x0 + i * (colW + gutter));
      laid.items.forEach((it) => items.push({ ...it, y: it.y + top.height + lead }));
      tallest = Math.max(tallest, laid.height);
    });
    return { items, height: top.height + lead + tallest };
  }

  // A single paragraph poured through columns — the standfirst, which is one
  // string rather than blocks. Balanced rather than filled: two columns of four
  // lines read better than one of seven beside one of one.
  function flowLines(lines, columns) {
    const perCol = Math.ceil(lines.length / columns);
    return Array.from({ length: columns },
      (_, i) => lines.slice(i * perCol, (i + 1) * perCol));
  }

  const noteFor = (panelId) => notes.find((n) => n.panel === panelId);

  // Vertical rhythm is explicit, in the same order as the page — an export
  // cannot rely on DOM flow for its sequence. Every gap comes from
  // layout.export; nothing is measured off the page.
  function measure(descRowCount, titleLineCount) {
    const E = ctx.layout.export, T = ctx.theme.type;
    const panels = ctx.panels.map((p) => ({ id: p.id, ...ctx.layout.canvas[p.id] }));
    const W = canvasWidth();

    const leading = s(T.exportLeading);
    // A wrapped title pushes everything under it down. Every measure below is
    // stated relative to `subtitleY` rather than to the constant, so a two-line
    // headline moves the whole page instead of landing on its own subtitle.
    const subtitleY = s(E.subtitleY) + Math.max(0, titleLineCount - 1) * s(E.titleLeading);
    const descriptionTop = subtitleY + s(E.descriptionGap);
    const legendTop = descriptionTop + descRowCount * leading + s(E.descriptionGapAfter);
    const barY = legendTop + s(E.legendBarGap);
    const tickY = barY + s(E.barH) + s(E.tickGap);

    // Inline keys sit beside the ramp instead of under it, so the legend ends
    // at its ticks and everything below moves up by a whole row.
    const inline = E.keysInline;

    // One anchor for every piece of chrome, so a left-aligned page cannot
    // download as a centred one. `flush` is the x each block starts from when
    // anchored left; centred blocks each have their own centre.
    const left = E.align.anchor === "start";
    const flush = E.align.inset;
    const flushRight = E.align.insetRight;

    const inlineGap = s(E.keysInlineGap);
    const sizedKeys = sizeKeys(
      legendModel ? legendModel.keys : [], ctx.format.font(s(T.size.body), T.sans));

    // Beside the ramp, the legend is one object: ramp, gap, keys. The keys
    // cannot shrink, so the ramp is what gives — it takes whatever is left,
    // down to barMinW, rather than holding a fixed width the keys then have to
    // wrap under. That is what keeps the whole legend on one line when the type
    // ramp grows or a chart adds a fourth key, with no width to re-tune here.
    // A centred legend has no inset to sit inside, so it keeps one gap clear on
    // each side rather than running to the canvas edge.
    const side = left ? flush : inlineGap;
    const room = W - side - (left ? flushRight : side) - inlineGap;
    // No upper cap: the ramp takes everything the keys leave, so the legend
    // spans the full measure instead of ending somewhere short of the chart it
    // explains. `barW` is the width for stacked keys, which have no keys beside
    // them to size against.
    const barW = inline
      ? Math.max(E.barMinW, room - rowWidth(sizedKeys, inlineGap))
      : E.barW;

    // Centred means the whole block is centred, not the ramp — with the keys
    // hanging off its right edge, a centred ramp puts them past the canvas.
    const blockW = inline ? barW + inlineGap + rowWidth(sizedKeys, inlineGap) : barW;
    const barX = left ? flush : Math.max(side, (W - blockW) / 2);

    // keysTop is the key row's own top edge, not a baseline: inline keys centre
    // on the legend block, stacked ones hang a fixed drop below the ticks.
    const keyRows = layoutKeys(
      sizedKeys,
      inline ? barX + barW + inlineGap : (left ? flush : null),
      W - (left ? flushRight : side),
      W
    );
    const extraRows = Math.max(0, keyRows.length - 1);
    const keysTop = inline
      ? (legendTop + tickY) / 2 - s(E.keyLabel.y) / 2 - extraRows * leading / 2
      : tickY + s(E.keysGap) - s(E.keysRise);
    const keysBottom = keysTop + extraRows * leading + s(E.keyLabel.y);
    const legendBottom = inline ? Math.max(tickY, keysBottom) : keysBottom;

    // Where the widest plot stops. A note column runs out to it, so the
    // download keeps the page's right edge rather than growing one of its own.
    const storyW = W - flushRight;
    const gutter = ctx.layout.page.gutter;

    let cursor = legendBottom + s(E.panelLeadGap);
    const placed = panels.map((p, i) => {
      const top = cursor + (i ? s(E.panelGap) : 0);
      const note = noteFor(p.id);

      if (!note) {
        cursor = top + p.h;
        return { ...p, top, x: 0 };
      }

      if (note.side === "above") {
        const laid = layoutNoteColumns(
          note.blocks, storyW - flush, flush, note.columns || 1);
        const panelTop = top + laid.height + s(E.noteGap);
        cursor = panelTop + p.h;
        return { ...p, top: panelTop, x: 0, note: { ...laid, top } };
      }

      // Beside it, on the side the page puts it. The panel keeps its own canvas
      // width, so the note takes whatever is left of the measure — the same
      // arithmetic the page grid does, from the same two numbers.
      const noteW = storyW - p.w - gutter;
      const left = note.side === "start";
      const laid = layoutNote(note.blocks, noteW, left ? 0 : p.w + gutter);

      // Prose and graphic end on one line, as they do on the page: the section
      // is as tall as the taller of the two, and whatever slack that leaves the
      // note goes above its closing figures rather than below them.
      const slack = Math.max(0, p.h - laid.height);
      const items = slack && laid.tailFrom >= 0
        ? laid.items.map((it, i) => (i >= laid.tailFrom ? { ...it, y: it.y + slack } : it))
        : laid.items;

      cursor = top + Math.max(p.h, laid.height);
      return { ...p, top, x: left ? noteW + gutter : 0, note: { items, top } };
    });

    const datasourceTop = cursor + s(E.sourceGap);
    const hasSig = !!ctx.config.signature;
    const sigY = datasourceTop + s(E.signatureGap);

    return {
      W, titleY: s(E.titleY), subtitleY, titleLeading: s(E.titleLeading),
      descriptionTop, legendTop, leading,
      textAnchor: E.align.anchor, textX: left ? flush : W / 2,
      barY, barH: s(E.barH), barW, barX,
      tickY, keysTop, keyRows,
      panels: placed, datasourceTop, hasSig, sigY,
      totalH: (hasSig ? sigY : datasourceTop) + s(E.bottomPad)
    };
  }

  // The panels decide the canvas width, so it is knowable before anything is
  // laid out — which is what lets the title be wrapped to it and the wrapped
  // line count then fed back into measure().
  const canvasWidth = () => Math.max(...ctx.panels.map((p) => ctx.layout.canvas[p.id].w));

  // How wide a line of chrome may run. A left-aligned page starts at its inset
  // and stops where its panels stop; a centred one keeps one gap clear at each
  // edge, the same way the legend does.
  function textMeasure() {
    const E = ctx.layout.export;
    const W = canvasWidth();
    return E.align.anchor === "start"
      ? W - E.align.inset - E.align.insetRight
      : W - 2 * s(E.keysInlineGap);
  }

  // One line, set down until it fits — see layout.export.titleMinScale. The
  // fallback wrap is balanced: a headline that has to take two lines should
  // split them evenly rather than hanging one word under a full one.
  function fitTitle(text) {
    const T = ctx.theme.type, E = ctx.layout.export;
    const full = s(T.size.title);
    const measure = textMeasure();
    const font = ctx.format.font(full, T.serif);
    const w = measureText(text, font);
    if (w <= measure) return { lines: [text], size: full };
    const fitted = full * (measure / w);
    if (fitted >= full * E.titleMinScale) return { lines: [text], size: fitted };
    return { lines: wrapBalanced(text, measure, font), size: full };
  }

  function build() {
    const T = ctx.theme.type;
    const title = fitTitle(Dom.byId("title").textContent.trim());
    const titleLines = title.lines;
    // The standfirst wraps to whatever column the page runs it in: one column
    // at the prose measure, or the full measure split in two. Same width here
    // as there, so the paragraph breaks at the same words in both.
    const D = ctx.layout.export.description;
    const descCols = D.columns;
    const gutter = ctx.layout.page.gutter;
    const descTotal = D.width === "measure" ? textMeasure() : ctx.layout.page.prose;
    const descColW = (descTotal - (descCols - 1) * gutter) / descCols;
    const descLines = ctx.format.wrap(
      Dom.byId("description").textContent.trim(),
      descColW,
      // The scaled size, not the page's: measuring at 12px and drawing at 16
      // would overrun the measure by a third of a line on every line.
      ctx.format.font(s(T.size.body), T.sans)
    );
    const descColumns = flowLines(descLines, descCols);
    const L = measure(descColumns[0].length, titleLines.length);

    // No explicit xmlns: svgEl() creates in the SVG namespace, and the
    // serializer emits the declaration from that. Setting it as an attribute
    // as well produced `xmlns=... xmlns=...` — a duplicate attribute name,
    // which is fatal to an XML parser, so the downloaded .svg was not
    // well-formed even though a lenient browser still drew it.
    // A download is a picture, not a page: it gets pasted onto a slide, a
    // README, a feed, and content running to the file's edge reads as cropped.
    // So the canvas is the chart plus a margin on every side, and everything
    // below is drawn inside a group inset by it — one translate, rather than
    // `pad +` on every coordinate in this file.
    const pad = ctx.layout.export.pad;
    const totalW = L.W + 2 * pad, totalH = L.totalH + 2 * pad;

    const out = svgEl("svg", {
      viewBox: "0 0 " + totalW + " " + totalH,
      width: totalW, height: totalH, role: "img"
    });
    // A downloaded file has no surrounding page to inherit an accessible name.
    out.appendChild(svgEl("title", {}, ctx.copy.exportTitle(Dom.byId("title").textContent)));
    out.appendChild(svgEl("rect", { width: totalW, height: totalH, fill: ctx.theme.color.paper }));
    out.appendChild(svgEl("style", {}, ctx.style.exportRules()));

    const art = svgEl("g", { transform: "translate(" + pad + "," + pad + ")" });
    out.appendChild(art);

    const lead = { x: L.textX, "text-anchor": L.textAnchor };
    // The fitted size is inline because it is per-render: the class carries the
    // ceiling, this carries what this subject's name actually left room for.
    const titleEl = svgEl("text", {
      ...lead, class: "export-title",
      style: "font-size:" + title.size.toFixed(2) + "px"
    });
    titleLines.forEach((line, i) => titleEl.appendChild(
      svgEl("tspan", { x: L.textX, y: L.titleY + i * L.titleLeading }, line)));
    art.appendChild(titleEl);

    art.appendChild(svgEl("text", { ...lead, y: L.subtitleY, class: "export-subtitle" },
      Dom.byId("subtitle").textContent));

    descColumns.forEach((lines, col) => {
      const x = L.textX + col * (descColW + gutter);
      const desc = svgEl("text",
        { class: "export-description", "text-anchor": L.textAnchor });
      lines.forEach((line, i) => desc.appendChild(
        svgEl("tspan", { x, y: L.descriptionTop + i * L.leading }, line)));
      art.appendChild(desc);
    });

    appendLegend(art, L);
    L.panels.forEach((p) => {
      if (p.note) appendNote(art, p.note);
      appendPanel(art, p.id, p.top, p.x);
    });

    art.appendChild(svgEl("text", { ...lead, y: L.datasourceTop, class: "export-datasource" },
      Dom.byId("datasource").textContent));
    if (L.hasSig) {
      art.appendChild(svgEl("text", { ...lead, y: L.sigY, class: "export-signature" },
        ctx.copy.signature(ctx.config.signature)));
    }
    return { node: out, width: totalW, height: totalH };
  }

  function appendLegend(out, L) {
    if (!legendModel) return;
    const E = ctx.layout.export;
    const { stops, tickVals } = legendModel;

    out.appendChild(svgEl("text",
      { x: L.textX, y: L.legendTop, "text-anchor": L.textAnchor, class: "export-legend-cap" },
      ctx.copy.legend.cap));

    const gradId = "export-legend-grad";
    const grad = svgEl("linearGradient", { id: gradId, x1: "0", x2: "1", y1: "0", y2: "0" });
    stops.forEach((c, i) => grad.appendChild(
      svgEl("stop", { offset: (i / (stops.length - 1) * 100) + "%", "stop-color": c })));
    out.appendChild(grad);
    out.appendChild(svgEl("rect", {
      x: L.barX, y: L.barY, width: L.barW, height: L.barH,
      rx: s(E.barRadius), fill: "url(#" + gradId + ")"
    }));

    tickVals.forEach((v, i) => out.appendChild(svgEl("text", {
      x: L.barX + i / (tickVals.length - 1) * L.barW, y: L.tickY,
      "text-anchor": i === 0 ? "start" : i === tickVals.length - 1 ? "end" : "middle",
      class: "export-legend-tick"
    }, ctx.format.num(v))));

    L.keyRows.forEach((row, r) => {
      const y = L.keysTop + r * L.leading;
      row.forEach((k) => {
        const g = svgEl("g", { transform: "translate(" + k.x + "," + y + ")" });
        g.appendChild(k.kind === "dash"
          ? svgEl("line", {
              x1: 0, y1: s(E.keyLine.y), x2: s(E.keyLine.w), y2: s(E.keyLine.y), stroke: k.color,
              "stroke-width": k.width, "stroke-dasharray": k.dash
            })
          : svgEl("rect", {
              width: s(E.keySwatch.w), height: s(E.keySwatch.h), fill: k.color,
              ...(k.border ? { stroke: k.border, "stroke-width": ctx.theme.stroke.hub.width } : {})
            }));
        g.appendChild(svgEl("text",
          { x: s(E.keyLabel.x), y: s(E.keyLabel.y), class: "export-legend-key" }, k.label));
        out.appendChild(g);
      });
    });
  }

  function appendPanel(out, id, top, x = 0) {
    const g = svgEl("g", { transform: "translate(" + x + ", " + top + ")" });
    Array.from(Dom.byId(id).childNodes).forEach((n) => g.appendChild(n.cloneNode(true)));
    out.appendChild(g);
  }

  // Drawn before its panel, so a rule can never land over a mark. Every item
  // carries its own absolute position from layoutNote; only the block's own top
  // offset is added here.
  function appendNote(out, note) {
    const rule = ctx.theme.stroke.rowDivider;
    for (const it of note.items) {
      if (it.rule) {
        out.appendChild(svgEl("line", {
          x1: it.x, x2: it.x + it.w, y1: note.top + it.y, y2: note.top + it.y,
          stroke: rule.color, "stroke-width": rule.width
        }));
        continue;
      }
      out.appendChild(svgEl("text", {
        x: it.x, y: note.top + it.y, class: it.cls,
        ...(it.anchor ? { "text-anchor": it.anchor } : {})
      }, it.text));
    }
  }

  const XML_DECL = '<?xml version="1.0" standalone="no"?>\n';

  // A data: URI, not blob: — sandboxed iframes commonly allow blob: for an
  // <a download> but block it as an <img> src, and PNG rasterisation needs the
  // SVG loaded into an <img>.
  function dataUri(node) {
    const xml = new XMLSerializer().serializeToString(node);
    return "data:image/svg+xml;base64,"
      + btoa(unescape(encodeURIComponent(XML_DECL + xml)));
  }

  const slug = (subject) => ((subject && subject.name) || "chart")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-");
  const filename = (subject, ext) => slug(subject) + "-" + ctx.id + "." + ext;
