/* Page chrome, shared by every chart. Every value comes from the theme via the
   custom properties style.install() writes. The classes used inside the panels
   (.value-label, .hub-name, .band-cap) are not here — style.svgRules()
   generates them, so the page and the export share one definition of each. */

#app {
  max-width: var(--w-page); margin: 0 auto; padding: 28px 24px 48px;
  font-family: var(--font-sans);
  color: var(--ink); background: var(--paper);
}

/* ---- subject picker ---- */
#controls { display: flex; justify-content: center; margin-bottom: 26px; }
#subjectpicker { display: flex; align-items: center; gap: 10px; }
.cs-label {
  color: var(--tertiary); font-size: var(--fs-meta); font-weight: var(--weight-strong);
  letter-spacing: var(--tracking-eyebrow); text-transform: uppercase;
}
.cs-shell { position: relative; width: var(--w-search); }
.cs-input {
  width: 100%; box-sizing: border-box; padding: 7px 11px;
  font-family: inherit; font-size: var(--fs-subtitle); color: var(--ink);
  background: var(--paper); border: 1px solid var(--line); border-radius: 5px;
}
.cs-input::placeholder { color: var(--placeholder); }
.cs-input:hover:not(:disabled) { border-color: var(--line-hover); }
.cs-input:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
.cs-input:disabled { opacity: 0.55; }
.cs-list {
  position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0;
  margin: 0; padding: 4px; list-style: none; max-height: 264px; overflow-y: auto;
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 6px 20px var(--shadow);
}
.cs-list[hidden] { display: none; }
.cs-option {
  display: flex; flex-direction: column; gap: 1px;
  padding: 6px 9px; border-radius: 4px; cursor: pointer;
}
.cs-option.is-active { background: var(--surface-active); }
.cs-name { font-size: var(--fs-subtitle); color: var(--ink); }
.cs-meta { font-size: var(--fs-note); color: var(--tertiary); }
.cs-status {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;      /* announced, not shown */
}

#head { text-align: center; margin: 0; }
#title {
  font-family: var(--font-serif); font-weight: var(--weight-normal);
  font-size: var(--fs-title); margin: 0;
}
#subtitle {
  color: var(--secondary); font-size: var(--fs-subtitle); margin: 8px 0 0;
  font-variant-numeric: tabular-nums;
}

  max-width: var(--w-prose); margin: 10px auto 0; text-align: center;
  color: var(--secondary); font-size: var(--fs-body); line-height: var(--leading-prose);
}

/* Shown instead of the chart when there are no observations */
#nodata { max-width: var(--w-notice); margin: 72px auto; text-align: center; }
#nodata[hidden] { display: none; }
.nd-head { margin: 0; color: var(--ink); font-size: var(--fs-notice); font-weight: var(--weight-strong); }
.nd-body {
  margin: 8px 0 0; color: var(--tertiary); font-size: var(--fs-body);
  line-height: var(--leading-prose);
}
/* Author-level, so they beat the .panel display rule — the UA [hidden] rule
   does not, and the empty SVGs would keep their full height. */
#legend[hidden], .panel[hidden] { display: none; }

#downloadRow { margin-top: 16px; }
#downloadBtn, #downloadPngBtn {
  margin: 0 3px; padding: 6px 14px; font-size: var(--fs-body);
  font-family: inherit; color: var(--button-ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 5px; cursor: pointer;
}
#downloadBtn:hover:not(:disabled), #downloadPngBtn:hover:not(:disabled) { border-color: var(--line-hover); }
#downloadBtn:disabled, #downloadPngBtn:disabled { opacity: 0.45; cursor: default; }

.panel { width: 100%; height: auto; display: block; margin-top: 32px; }
.panel:first-of-type { margin-top: 34px; }

/* Ramp and keys on one line. The keys are text and cannot shrink, so they take
   what they need and the ramp fills the rest — capped at --w-colorbar, because
   a ramp only has to be long enough to read a gradient and its tick labels off.
   Sizing it the other way round is what pushes the keys onto a second row.
   `flex-wrap` on the container is the narrow-viewport fallback. */
#legend {
  margin: 32px auto 0;
  display: flex; align-items: center; justify-content: center;
  gap: 24px; flex-wrap: wrap;
}
/* No max-width: the ramp fills whatever the keys leave, so the legend spans the
   full measure rather than stopping short of it. --w-colorbar is the basis it

.lg-block { flex: 1 1 var(--w-colorbar); min-width: 200px; }
.lg-cap {
  color: var(--tertiary); font-size: var(--fs-meta);
  font-weight: var(--weight-strong); letter-spacing: var(--tracking-eyebrow);

}

#colorticks span { color: var(--tertiary); font-size: var(--fs-meta); font-variant-numeric: tabular-nums; }
.lg-keys { flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: 16px; margin-top: 0; }
.key { display: inline-flex; align-items: center; gap: 6px; color: var(--tertiary); font-size: var(--fs-body); }
.swatch {
  width: 20px; height: 11px; display: inline-block;
  background: var(--band-fill); border: 1px solid var(--band-stroke);
}

/* Data source + signature: one small quiet closing block */
#datasource {
  max-width: var(--w-foot); margin: 36px auto 0; text-align: center;
  color: var(--tertiary); font-size: var(--fs-meta);
}
#signature { text-align: center; color: var(--tertiary); font-size: var(--fs-meta); margin: 6px 0 0; }
#signature a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--tertiary); }
#signature a:hover { color: var(--ink); border-color: var(--ink); }

/* A media query cannot read a custom property in its condition, so this

@media (max-width: 520px) {

  #subjectpicker { flex-direction: column; align-items: stretch; gap: 5px; }
  .cs-shell { width: min(var(--w-search), 78vw); }
}

/* country-strips only, appended after core/page.css by build/bundle.mjs.
   This chart runs flush left instead of centred: the headline starts on the
   same edge as the city names and ends where the bars end, so the page has one
   left edge from the title down to the byline rather than a centred block of

  margin-left: var(--page-inset);

  max-width: var(--page-measure);
}

#head, #description, #datasource, #signature, .lg-cap { text-align: left; }

/* The picker starts on the same edge as everything else rather than centring

/* Still capped to a readable measure — it just no longer centres itself

/* The one-line legend is core/page.css's default now; this only moves it off

<div id="app">

  <!-- Interactive chrome. data-noexport documents that it never reaches a
       download; core/exporter.js is what enforces it. The shell mounts the
       country picker here, because the adapter can search. -->
  <div id="controls" data-noexport>
    <div id="subjectpicker"></div>
  </div>

  <header id="head">
    <h1 id="title">Saudi cities</h1>
    <p id="subtitle">Loading…</p>
    <p id="description"></p>
    <div id="downloadRow">
      <button id="downloadBtn" type="button" disabled>Download SVG</button>
      <button id="downloadPngBtn" type="button" disabled>Download PNG</button>
    </div>
  </header>

  </div>

      <div id="colorticks"></div>
    </div>
    <div class="lg-keys"></div>
  </div>

  <!-- One panel: the component draws a row per city inside it. -->
  <svg id="strips" class="panel" role="img" aria-label="Daily temperature range by city"></svg>

  <p id="datasource"></p>
  <p id="signature"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
"use strict";
(function () {

/* ===== core/kit.js ===== */
// Small shared utilities: DOM access, fetch, object merge, polar geometry, SVG
// helpers and value formatting.
//
// These were six files of a dozen lines each. They are grouped here because
// none of them is worth opening on its own — you come looking for one helper,
// not for a module.

// ---------------------------------------------------------------- DOM

const Dom = {
  byId: (id) => document.getElementById(id),
  show: (id) => Dom.byId(id).removeAttribute("hidden"),
  // setAttribute, not `.hidden`: that property only exists on HTMLElement, so
  // assigning it to an <svg> panel silently does nothing.
  hide: (id) => Dom.byId(id).setAttribute("hidden", "")
};

// ---------------------------------------------------------------- fetch

/** Shared JSON fetch. Aborts on either the timeout or the caller's signal, so
 *  a slow source cannot hang the page and a superseded request can be dropped. */
async function fetchJSON(url, { timeoutMs = 8000, signal } = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  if (signal) signal.addEventListener("abort", () => ctrl.abort(), { once: true });
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

// ---------------------------------------------------------------- merge

// Plain objects merge key by key; everything else replaces wholesale. So a chart
// can override one stroke colour without restating its weight and dash, but
// overriding a list is always a replacement rather than a confusing splice.

const isPlain = (v) => v !== null && typeof v === "object" && !Array.isArray(v);

function deepMerge(base, override) {
  if (!override) return base;
  const out = { ...base };
  for (const [k, v] of Object.entries(override)) {
    out[k] = isPlain(v) && isPlain(base[k]) ? deepMerge(base[k], v) : v;
  }
  return out;
}

// ---------------------------------------------------------------- polar

// Polar geometry, clockwise from the top: x = cx + r*sin(a), y = cy - r*cos(a).
// d3.arc() uses the same convention, so arcs and these helpers agree with no
// sign-flipping anywhere.

const TAU = Math.PI * 2;

function polar(cx, cy) {
  return {
    pt: (r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)],
    // Centre-relative, for anything inside the translated group — including
    // userSpaceOnUse gradients, which inherit that transform.
    rel: (r, a) => [r * Math.sin(a), -r * Math.cos(a)],

    start: (i, n) => i / n * TAU,
    end: (i, n) => (i + 1) / n * TAU,
    centre: (i, n) => (i + 0.5) / n * TAU,

    // d3.arc() draws around the origin. Without this every arc piles into the
    // top-left corner instead of forming a ring.
    transform: () => `translate(${cx},${cy})`
  };
}

// ---------------------------------------------------------------- SVG

const SVG_NS = "http://www.w3.org/2000/svg";

/** A detached SVG element, for the exporter — which builds a document rather
 *  than selecting into one. */
function svgEl(tag, attrs = {}, text) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text != null) node.textContent = text;
  return node;
}

/** A gradient running along a mark, sampling a colour scale between two values.
 *  A range bar is the one mark whose colour must vary *along* it, which a single
 *  fill cannot express. Every panel calls this rather than building its own. */
function appendValueGradient(defs, id, [x1, y1], [x2, y2], vLow, vHigh, colour, stops = 6) {
  const grad = defs.append("linearGradient")
    .attr("id", id).attr("gradientUnits", "userSpaceOnUse")
    .attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2);
  for (let k = 0; k <= stops; k++) {
    const v = vLow + (vHigh - vLow) * k / stops;
    grad.append("stop").attr("offset", (k / stops * 100) + "%").attr("stop-color", colour(v));
  }
  return `url(#${id})`;
}

/** Apply a theme stroke token, so a reference line's colour, weight and dash
 *  always travel together and cannot be half-copied. */
function applyStroke(sel, token) {
  sel.attr("stroke", token.color).attr("stroke-width", token.width);
  if (token.dash) sel.attr("stroke-dasharray", token.dash);
  return sel;
}

// ---------------------------------------------------------------- format

// Value to string. The generic half is the same for every chart; the domain
// half is not, so a chart supplies its own via makeFormat.
//
// A subject is whatever the chart is about — a city, a ticker, a repository:
//   { id, name, sublabel, detail }
// `name` is the headline, `sublabel` the short qualifier, `detail` the longer
// one shown only in the picker.

const FORMAT_DEFAULTS = {
  value: (v) => v.toFixed(1),
  valueWhole: (v) => String(v),
  // Rounded: decimals on an average imply a precision it does not have.
  valueRange: (lo, hi) => `${Math.round(lo)}–${Math.round(hi)}`,
  num: (v) => v.toFixed(1),
  key: (k) => (k instanceof Date ? k.toISOString().slice(0, 10) : String(k)),

  subjectTitle: (s) => [s.name, s.sublabel].filter(Boolean).join(", "),
  subjectLabel: (s) => [s.name, s.detail, s.sublabel].filter(Boolean).join(", ")
};

// One canvas for every measurement anywhere. The old code made a fresh one per
// wrap() call; a panel that measures a label per row would make one per row.
const measureContext = (() => {
  let c2d = null;
  return () => (c2d || (c2d = document.createElement("canvas").getContext("2d")));
})();

const FORMAT_SHARED = {
  // Here rather than a CSS text-transform, which is unevenly applied to <text>.
  caps: (s) => String(s).toUpperCase(),

  /** Real glyph metrics, for the places SVG gives us no CSS to lay text out
   *  with: wrapping a paragraph, sizing a legend key, fitting a row label. */
  textWidth(text, font) {
    const c2d = measureContext();
    c2d.font = font;
    return c2d.measureText(text).width;
  },

  /** Greedy wrap, for the export's description block and a panel's row labels.
   *  A word wider than the measure gets a line to itself and overruns it —
   *  there is nowhere to break — so a caller that cannot afford the overrun has
   *  to check the returned lines against `textWidth`. */
  wrap(text, maxWidthPx, font) {
    const lines = [];
    let line = "";
    for (const word of text.split(/\s+/)) {
      const test = line ? line + " " + word : word;
      if (line && this.textWidth(test, font) > maxWidthPx) { lines.push(line); line = word; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  },

  // So canvas measurement and the rendered text agree on the font.
  font: (sizePx, family) => `${sizePx}px ${family}`
};

const makeFormat = (overrides = {}) =>
  ({ ...FORMAT_DEFAULTS, ...FORMAT_SHARED, ...overrides });

/* ===== core/model.js ===== */
// Every derived number, computed once per load:
//   series  [{ key, low, high }]   key indexes the series — a Date, a label
//   subject { id, name, sublabel, detail }
//   band    { low, high, ...meta } | null
//
// Nothing positional lives here. `lo`/`hi` are the rounded value domain; each
// panel builds its own radial or cartesian scale from them, which is what lets
// a radial and a cartesian view share one model.

// Rounded out to whole gridlines, so bar lengths and grid density agree.
function valueDomain(series, tickStep) {
  const dataMin = d3.min(series, (d) => d.low);
  const dataMax = d3.max(series, (d) => d.high);
  return {
    dataMin, dataMax,
    lo: Math.floor(dataMin / tickStep) * tickStep,
    hi: Math.ceil(dataMax / tickStep) * tickStep
  };
}

// Colour tracks value across the range actually covered, so a uniformly cold
// city is not rendered entirely blue.
function colourScale(dataMin, dataMax, interpolate, invert) {
  const span = (dataMax - dataMin) || 1;
  return (v) => {
    const t = Math.max(0, Math.min(1, (v - dataMin) / span));
    return interpolate(invert ? 1 - t : t);
  };
}

function buildRangeModel({
  series,
  subject,
  band = null,
  tickStep = 5,
  interpolate = d3.interpolateRdYlBu,
  invert = true,        // RdYlBu runs blue->red, so high values want the far end
  labelTarget = 9,
  // Set by buildFacetedRangeModel so every facet shares one domain and one
  // colour scale. Without that, each row would be scaled to itself and the
  // rows could not be compared — which is the whole point of small multiples.
  shared = null
}) {
  if (!series || !series.length) throw new Error("buildRangeModel: empty series");

  const n = series.length;
  const { dataMin, dataMax, lo, hi } = shared || valueDomain(series, tickStep);
  const colour = shared ? shared.colour : colourScale(dataMin, dataMax, interpolate, invert);

  let maxIdx = 0, minIdx = 0;
  series.forEach((d, i) => {
    if (d.high > series[maxIdx].high) maxIdx = i;
    if (d.low < series[minIdx].low) minIdx = i;
  });

  const hasBand = !!(band && Number.isFinite(band.low) && Number.isFinite(band.high));

  return Object.freeze({
    series, subject, n,
    band: hasBand ? band : null,
    hasBand,
    dataMin, dataMax, lo, hi,
    ticks: d3.range(lo, hi + 0.001, tickStep),
    colour,
    medLow: d3.median(series, (d) => d.low),
    medHigh: d3.median(series, (d) => d.high),
    spread: d3.median(series, (d) => d.high - d.low),
    maxIdx, minIdx,
    // ~9 labels regardless of length: a fixed "every 7th slot" leaves a month
    // with 4 labels and a year with an unreadable crowd.
    labelStep: Math.max(1, Math.round(n / labelTarget)),
    firstKey: series[0].key,
    lastKey: series[n - 1].key,
    // Clamp a band bound into the domain, so an unusual window still renders
    // inside the panel instead of distorting the scale.
    clampToDomain(v) { return Math.max(this.lo, Math.min(this.hi, v)); }
  });
}

// Small multiples: many subjects, one shared scale.
//
// facets  [{ subject, series, band }]
//
// The union domain is computed across every facet before any sub-model is
// built, so a bar of the same length means the same value in every row. The
// result carries the same surface a plain range model does (dataMin, dataMax,
// colour, ticks) so the legend and header need no special case.
function buildFacetedRangeModel({
  facets,
  subject,
  tickStep = 5,
  interpolate = d3.interpolateRdYlBu,
  invert = true,
  labelTarget = 9
}) {
  if (!facets || !facets.length) throw new Error("buildFacetedRangeModel: no facets");

  const every = facets.flatMap((f) => f.series);
  const domain = valueDomain(every, tickStep);
  const colour = colourScale(domain.dataMin, domain.dataMax, interpolate, invert);
  const shared = { ...domain, colour };

  const models = facets.map((f) => buildRangeModel({ ...f, tickStep, labelTarget, shared }));
  const withBand = models.find((m) => m.hasBand);

  return Object.freeze({
    facets: models,
    subject,
    n: models.length,
    ...domain,
    colour,
    ticks: d3.range(domain.lo, domain.hi + 0.001, tickStep),
    hasBand: !!withBand,
    // All facets read the same archive window, so one representative set of
    // years is correct for the legend and the description.
    bandYears: withBand ? { fromYear: withBand.band.fromYear, toYear: withBand.band.toYear } : null,
    // The window is identical across facets; take it from the first.
    firstKey: models[0].firstKey,
    lastKey: models[0].lastKey,
    days: models[0].n,
    labelStep: models[0].labelStep
  });
}

/* ===== components/stacked-range-strips.js ===== */
// Small multiples: one horizontal range strip per subject, stacked down the
// page with whitespace between them.
//
// Takes a faceted range model (core/model.js), where every facet already
// shares one value domain and one colour scale — so a bar of the same length
// means the same value in every row, and the rows can actually be compared.
// That shared scale is the whole reason this is a panel rather than N panels.
//
// Domain-agnostic, like every component here: it draws ranges and reads its
// words from ctx.copy.



const STACKED_RANGE_STRIPS_LAYOUT = {
  margin: { top: 34, right: 84, bottom: 56, left: 24 },
  row: {
    height: 92,
    // The whitespace between subjects. It has to clear the two extreme labels
    // that reach into it — the coldest day hanging below one row, the hottest
    // sitting above the next.
    gap: 54
  },
  // Subject names get a column to the left of the plot, vertically centred on
  // the row, so a name and its bars read as one horizontal line.
  //
  //   col     — the column's full width; the plot starts after it
  //   gutter  — clear space at its right edge, before the plot
  //   leading — between wrapped lines, in canvas units
  //
  // A name too long for `col - gutter` wraps rather than running into the bars,
  // which is what makes an arbitrary city name safe here: the subjects are
  // cities in whichever country was picked, and "Rio de Janeiro" is not a width
  // anyone can choose in advance. Wrapping is measured at *export* type size,
  // because one SVG is drawn at both scales and only the larger one can
  // overflow. A single word with nowhere to break is set smaller instead —
  // 19 of the 920 cities in the bundled table need that, "Chichicastenango"
  // being the worst. Sizing the column for those two dozen names instead would
  // cost every other row 60px of plot.
  name: { col: 180, gutter: 14, leading: 30 },
  valueGap: 12,    // value labels, right of the plot
  // Key labels, below the last row only. Far enough down to clear that row's
  // coldest-day label, which hangs below the plot by `extreme.belowDy` and can
  // land at any x — so distance is the only thing keeping them apart.
  keyGap: 42,
  pointPadding: 0.5,
  bar: { ratio: 0.55, min: 2 },
  extreme: { aboveDy: -10, belowDy: 20 }
};

// Canvas height is a function of how many subjects there are, so a chart
// computes it rather than hardcoding a number that silently stops matching.
function stackedStripsHeight(L, count) {
  return L.margin.top + count * L.row.height + Math.max(0, count - 1) * L.row.gap
    + L.margin.bottom;
}

function StackedRangeStrips({ id = "strips", layoutKey = id } = {}) {
  return {
    id,
    layoutKey,
    defaults: STACKED_RANGE_STRIPS_LAYOUT,

    // How tall this panel has to be for the data it is about to draw. The
    // shell writes it back to layout.canvas before render, so a country with
    // four cities gets a four-row canvas instead of six rows of whitespace —
    // and the exporter, which reads the same entry, agrees.
    measure(model, ctx) {
      return { h: stackedStripsHeight(ctx.layout[layoutKey], model.facets.length) };
    },

    render(svg, model, ctx) {
      const S = ctx.layout[layoutKey];
      const T = ctx.theme, F = ctx.format, C = ctx.copy.panels[id];
      const canvas = ctx.layout.canvas[id];

      svg.selectAll("*").remove();
      svg.attr("aria-label", C.aria(model.subject, ctx));
      const defs = svg.append("defs");

      // The plot begins after the name column; the names own everything left
      // of it, so no bar can ever sit under one.
      const left = S.margin.left + S.name.col;
      const iw = canvas.w - left - S.margin.right;
      // One x scale for every row: the window is identical across facets, so
      // day k sits at the same x in all of them and a vertical read works.
      const x = d3.scalePoint().domain(d3.range(model.days))
        .range([left, left + iw]).padding(S.pointPadding);
      const barW = Math.max(S.bar.min, (iw / model.days) * S.bar.ratio);

      // Measured once for the whole panel, not once per row: every name is set
      // in the same face at the same size, so the font string never changes.
      const nameFont = F.font(
        T.type.size.facet * ctx.layout.export.typeScale, T.type.serif);
      const nameMax = S.name.col - S.name.gutter;
      const fitName = (text) => {
        const lines = F.wrap(text, nameMax, nameFont);
        const widest = Math.max(...lines.map((l) => F.textWidth(l, nameFont)));
        return { lines, shrink: widest > nameMax ? nameMax / widest : 1 };
      };

      // Before the rows, so a label reaching into a gap sits over the rule.
      rowDividers(svg, S, T, model, canvas);

      model.facets.forEach((facet, i) => {
        const top = S.margin.top + i * (S.row.height + S.row.gap);
        const y = d3.scaleLinear().domain([model.lo, model.hi])
          .range([top + S.row.height, top]);
        const row = { svg, defs, S, T, F, x, y, left, iw, top, fitName };

        rowBand(row, facet);
        rowMedians(row, facet);
        rowBars(row, facet, id + "-" + i, barW);
        rowBandEdges(row, facet);
        rowExtremes(row, facet);
        rowLabels(row, facet);
      });

      // Key labels once, under the last row: repeating them per row costs six
      // times the ink and says nothing new.
      const lastTop = S.margin.top + (model.facets.length - 1) * (S.row.height + S.row.gap);
      keyLabels({ svg, S, F, x }, model, lastTop + S.row.height + S.keyGap);
    }
  };
}

// A hairline in each gap, so six rows read as six subjects rather than one
// field of bars. It spans the name column too — the same measure the page title
// uses — so the rule starts where every other left edge starts.
function rowDividers(svg, S, T, model, canvas) {
  for (let i = 1; i < model.facets.length; i++) {
    const at = S.margin.top + i * (S.row.height + S.row.gap) - S.row.gap / 2;
    applyStroke(
      svg.append("line")
        .attr("x1", S.margin.left).attr("x2", canvas.w - S.margin.right)
        .attr("y1", at).attr("y2", at),
      T.stroke.rowDivider
    );
  }
}

function rowBand({ svg, T, left, iw, y }, facet) {
  if (!facet.hasBand) return;
  const lo = facet.clampToDomain(facet.band.low);
  const hi = facet.clampToDomain(facet.band.high);
  svg.append("rect").attr("x", left).attr("y", y(hi))
    .attr("width", iw).attr("height", y(lo) - y(hi))
    .attr("fill", T.color.bandFill);
}

// Drawn over the bars: the band fill sits behind them and is mostly hidden, so
// only a visible edge that bars cross can answer "was this day outside normal".
function rowBandEdges({ svg, T, left, iw, y }, facet) {
  if (!facet.hasBand) return;
  [facet.band.low, facet.band.high].forEach((v) => {
    applyStroke(
      svg.append("line")
        .attr("x1", left).attr("x2", left + iw)
        .attr("y1", y(facet.clampToDomain(v))).attr("y2", y(facet.clampToDomain(v))),
      T.stroke.bandEdge
    );
  });
}

function rowMedians({ svg, T, left, iw, y }, facet) {
  const line = (v, token) => applyStroke(
    svg.append("line").attr("x1", left).attr("x2", left + iw).attr("y1", y(v)).attr("y2", y(v)),
    token
  );
  line(facet.medHigh, T.stroke.medianHigh);
  line(facet.medLow, T.stroke.medianLow);
}

// gradPrefix carries the row index: without it every row would define the same
// gradient ids and the last row would win for all of them.
function rowBars({ svg, defs, T, x, y }, facet, gradPrefix, barW) {
  facet.series.forEach((d, k) => {
    const cx = x(k);
    const stroke = appendValueGradient(
      defs, gradPrefix + "-" + k, [cx, y(d.low)], [cx, y(d.high)],
      d.low, d.high, facet.colour, T.mark.gradientStops
    );
    svg.append("line").attr("x1", cx).attr("x2", cx).attr("y1", y(d.low)).attr("y2", y(d.high))
      .attr("stroke", stroke).attr("stroke-width", barW).attr("stroke-linecap", "round");
  });
}

function rowExtremes({ svg, T, S, F, x, y }, facet) {
  const M = T.mark, E = S.extreme;
  [facet.maxIdx, facet.minIdx].forEach((k) => {
    const d = facet.series[k];
    const isMax = k === facet.maxIdx;
    const v = isMax ? d.high : d.low;
    const cx = x(k), cy = y(v);
    svg.append("circle").attr("cx", cx).attr("cy", cy).attr("r", M.dotR)
      .attr("fill", facet.colour(v))
      .attr("stroke", T.color.paper).attr("stroke-width", M.dotHaloWidth);
    svg.append("text").attr("x", cx).attr("y", cy + (isMax ? E.aboveDy : E.belowDy))
      .attr("text-anchor", "middle").attr("class", "key-label extreme-label")
      .text(F.value(v));
  });
}

// Subject name in the column to the left, on the row's centre line; its own
// high and low at the right, where the plot has no marks. Both sit outside the
// bars, so nothing is occluded.
function rowLabels({ svg, S, F, left, iw, y, top, fitName }, facet) {
  // The group carries the class as well, so a shrunk line has a font size to be
  // a percentage *of*. Without it the percentage would resolve against the
  // document default and ignore the theme entirely.
  const g = svg.append("g").attr("class", "facet-name");

  // Centred as a block: a two-line name straddles the row's middle rather than
  // starting at it, so a long name and a short one still look aligned.
  const { lines, shrink } = fitName(facet.subject.name);
  const first = top + S.row.height / 2 - (lines.length - 1) * S.name.leading / 2;
  lines.forEach((line, i) => {
    const t = g.append("text").attr("x", S.margin.left).attr("y", first + i * S.name.leading)
      .attr("dy", "0.32em").attr("class", "facet-name").text(line);
    // A percentage, not a pixel size, and inline so it beats the class rule:
    // one SVG is rendered at two type scales, and a pixel size would pin this
    // row to whichever one happened to be current when it was measured.
    if (shrink < 1) t.style("font-size", (shrink * 100).toFixed(1) + "%");
  });

  const at = left + iw + S.valueGap;
  g.append("text").attr("x", at).attr("y", y(facet.medHigh))
    .attr("dy", "0.32em").attr("class", "facet-sub")
    .text(F.value(facet.medHigh));
  g.append("text").attr("x", at).attr("y", y(facet.medLow))
    .attr("dy", "0.32em").attr("class", "facet-sub")
    .text(F.value(facet.medLow));
}

function keyLabels({ svg, F, x }, model, yPos) {
  const first = model.facets[0];
  first.series.forEach((d, k) => {
    if (k % model.labelStep !== 0) return;
    svg.append("text").attr("x", x(k)).attr("y", yPos)
      .attr("text-anchor", "middle").attr("class", "key-label").text(F.key(d.key));
  });
}

/* ===== adapters/open-meteo.js ===== */
// Daily min/max temperature from Open-Meteo.
//
// An adapter is the seam between a chart and where its numbers come from:
//   search(query, {limit, signal})  -> Subject[]        optional
//   resolve(query, {ctx})           -> Subject          optional
//   load(subject, {signal, ctx})    -> { series, band }
//
// Nothing above this file knows the word "temperature". A second adapter over
// a different dataset implements the same three methods and the whole chart
// stack works unchanged.



const GEOCODE = "https://geocoding-api.open-meteo.com/v1/search";
// Two endpoints on purpose: forecast covers the recent window right up to
// today, archive covers the decade behind it.
const FORECAST = "https://api.open-meteo.com/v1/forecast";
const ARCHIVE = "https://archive-api.open-meteo.com/v1/archive";

const dayOfYear = (d) => Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);

// Local midnight, so a tab left open across midnight cannot half-include a day.
function today() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// The most recent `days` days, ending today, resolved fresh on every load.
// Deliberately not a calendar month: a pinned month is stale the day after it
// ends, whereas a trailing window means the same thing on every run date.
//
// No date is formatted for the API — past_days does that server-side — so the
// old UTC round-trip bug (toISOString shifting the range a day earlier east of
// Greenwich) has nowhere left to live.
function trailingWindow(days) {
  const end = today();
  return { start: new Date(end.getTime() - (days - 1) * 864e5), end, days };
}

const toSubject = (g) => ({
  id: g.id,
  name: g.name,
  detail: g.admin1 || "",
  sublabel: g.country || "",
  countryCode: g.country_code || "",
  lat: g.latitude,
  lon: g.longitude,
  timezone: g.timezone || "auto"
});

// Response arrays are index-aligned: daily.time[k] pairs with
// daily.temperature_2m_{max,min}[k]. Rows are dropped whole, so a value is
// never paired with another day date.
const toRows = (daily) => daily.time
  .map((t, k) => ({
    key: new Date(t + "T00:00"),
    low: daily.temperature_2m_min[k],
    high: daily.temperature_2m_max[k]
  }))
  .filter((d) => d.low != null && d.high != null);

const OpenMeteoAdapter = {
  id: "open-meteo",

  async search(query, { limit = 8, signal } = {}) {
    if (!query || !query.trim()) return [];
    const url = GEOCODE + "?name=" + encodeURIComponent(query.trim())
      + "&count=" + limit + "&language=en&format=json";
    const j = await fetchJSON(url, { timeoutMs: 6000, signal });
    return (j.results || []).map(toSubject);
  },

  async resolve(query) {
    const [first] = await this.search(query, { limit: 1 });
    if (!first) throw new Error('No place found for "' + query + '"');
    return first;
  },

  async load(subject, { signal, ctx } = {}) {
    const series = await fetchDaily(subject, ctx, signal);
    // climatologyYears: 0 means a chart has decided it does not compare against
    // a normal range, so the archive is not called at all rather than fetched
    // and thrown away — on a small-multiples chart that is half the requests.
    if (!ctx.config.climatologyYears) return { series, band: null };
    // Optional layer: a failed climatology call must never take down a chart
    // that otherwise has everything it needs.
    let band = null;
    try { band = await fetchClimatology(subject, series, ctx, signal); }
    catch { band = null; }
    return { series, band };
  }
};

// Forecast + past_days rather than the archive: past_days counts back from the
// run date server-side, so the window is anchored to today by construction.
async function fetchDaily(subject, ctx, signal) {
  const { end, days } = trailingWindow(ctx.config.windowDays);
  const url = FORECAST + "?latitude=" + subject.lat + "&longitude=" + subject.lon
    + "&daily=temperature_2m_max,temperature_2m_min"
    + "&past_days=" + days + "&forecast_days=1"
    + "&timezone=" + encodeURIComponent(subject.timezone);
  const j = await fetchJSON(url, { timeoutMs: 8000, signal });
  const rows = toRows(j.daily)
    // forecast_days=1 is there to reach today at all, not to draw days that
    // have not happened; this guard keeps the window closed at today.
    .filter((d) => d.key <= end)
    .slice(-days)     // past_days=N plus today is N+1 rows; keep the newest N
  ;
  if (!rows.length) throw new Error("No data for this location");
  return rows;
}

// Ten years ending the year before the window, matched by day-of-year and
// averaged into one normal low/high — "was this window typical", not a per-day
// envelope. Optional: the caller treats failure as "no band".
async function fetchClimatology(subject, series, ctx, signal) {
  if (!series.length) throw new Error("No window to compare");
  const first = series[0].key, last = series[series.length - 1].key;
  const startDOY = dayOfYear(first), endDOY = dayOfYear(last);
  const wraps = endDOY < startDOY;              // window crosses a year boundary
  const refYear = last.getFullYear();
  const years = ctx.config.climatologyYears;
  const fromYear = refYear - years, toYear = refYear - 1;

  const url = ARCHIVE + "?latitude=" + subject.lat + "&longitude=" + subject.lon
    + "&start_date=" + fromYear + "-01-01&end_date=" + toYear + "-12-31"
    + "&daily=temperature_2m_max,temperature_2m_min"
    + "&timezone=" + encodeURIComponent(subject.timezone);
  const j = await fetchJSON(url, { timeoutMs: 10000, signal });

  const inWindow = (d) => {
    const doy = dayOfYear(d);
    return wraps ? (doy >= startDOY || doy <= endDOY) : (doy >= startDOY && doy <= endDOY);
  };
  const matched = toRows(j.daily).filter((d) => inWindow(d.key));
  if (!matched.length) throw new Error("No climatology data");
  return {
    low: d3.mean(matched, (d) => d.low),
    high: d3.mean(matched, (d) => d.high),
    fromYear, toYear
  };
}

/* ===== adapters/open-meteo-countries.js ===== */
// A whole country of cities, from Open-Meteo.
//
// Its own file because of what it costs: adapters/countries.js is a 28 KB
// bundled table, and build/bundle.mjs is a flat concatenation with no
// tree-shaking, so anything importing it pays for it. A chart about one city
// imports adapters/open-meteo.js and never sees this.




// A whole country, one load: its largest cities as facets, which is what a
// small-multiples panel needs instead of a series.
//
// The city set is not searched for — it is read from adapters/countries.js, a
// baked GeoNames extract. Open-Meteo's geocoder answers "where is this named
// place", never "what are the cities in this country", so the rows a country
// draws cannot come from the API. Baking them also removes one geocode request
// per row and stops a city name resolving to the wrong continent.
//
// search() is over that same table, so the picker filters instantly, offline,
// and always offers exactly the countries the chart can actually draw.

const CONTINENTS = {
  AF: "Africa", AS: "Asia", EU: "Europe",
  NA: "North America", SA: "South America", OC: "Oceania", AN: "Antarctica"
};

// Accents and apostrophes come off both sides, so "Türkiye" typed either way
// reaches Turkey and "cote divoire" reaches Côte d'Ivoire. U+0300-U+036F is
// the combining-marks block NFD splits an accented letter into.
const fold = (s) => s.normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "")
  .replace(/['’.]/g, "")
  .toLowerCase().trim();

// GeoNames names a country the way its own gazetteer does, which is not always
// the name a reader will type. Only where the two genuinely differ — this is a
// list of names people use, not a place to editorialise about which is right.
const ALIASES = {
  TR: ["Türkiye"],
  CI: ["Cote d'Ivoire"],
  CZ: ["Czech Republic"],
  MM: ["Burma"],
  CV: ["Cape Verde"],
  NL: ["Holland"],
  GB: ["UK", "Great Britain", "Britain", "England"],
  US: ["USA", "America"],
  AE: ["UAE"],
  CD: ["DRC", "Congo-Kinshasa", "Zaire"],
  CG: ["Congo-Brazzaville"],
  MK: ["Macedonia"],
  LA: ["Lao PDR"],
  TL: ["East Timor"]
};

// Folded once at load rather than per keystroke: this runs on every character
// typed, across every country in the table.
const SEARCHABLE = COUNTRIES.map((c) => ({
  country: c,
  code: fold(c.code),
  names: [c.name, ...(ALIASES[c.code] || [])].map(fold)
}));

const toCountrySubject = (c) => ({
  id: c.code,
  name: c.name,
  // Empty on purpose: `sublabel` joins into the headline, and "Saudi Arabia,
  // Asia" is not what the title should say. The continent is picker-only, so
  // it goes in `detail`.
  sublabel: "",
  detail: CONTINENTS[c.continent] || "",
  cities: c.cities
});

const OpenMeteoCountriesAdapter = {
  id: "open-meteo-countries",

  // Local, so there is no debounce to wait out and no request to fail. Ranked
  // rather than filtered: a country whose name starts with the query outranks
  // one that merely contains it, so typing "ind" offers India before Indonesia
  // and never before Finland.
  async search(query, { limit = 8 } = {}) {
    const q = fold(query || "");
    if (!q) return [];
    return SEARCHABLE
      .map((entry) => {
        // Exact first, then prefix, then anywhere — so "uk" offers the
        // United Kingdom ahead of Ukraine, and "ind" offers India before
        // Indonesia and neither before Finland.
        const rank = entry.code === q || entry.names.includes(q) ? 0
          : entry.names.some((n) => n.startsWith(q)) ? 1
            : entry.names.some((n) => n.includes(q)) ? 2 : -1;
        return { entry, rank };
      })
      .filter((m) => m.rank >= 0)
      .sort((a, b) => a.rank - b.rank
        || a.entry.country.name.localeCompare(b.entry.country.name, "en"))
      .slice(0, limit)
      .map((m) => toCountrySubject(m.entry.country));
  },

  async resolve(query) {
    const [first] = await this.search(query, { limit: 1 });
    if (!first) throw new Error('No country called "' + query + '" in the list');
    return first;
  },

  async load(subject, { signal, ctx } = {}) {
    const wanted = (subject.cities || []).slice(0, ctx.config.cityCount);
    if (!wanted.length) throw new Error("No cities listed for " + subject.name);

    // In parallel: six cities served sequentially would make the first paint
    // wait on the slowest chain of twelve requests instead of one.
    const settled = await Promise.all(
      wanted.map((city) => loadCity(city, subject, ctx, signal)));

    // A city that fails is dropped rather than taking the whole chart down,
    // and the header counts what actually arrived — so the page never claims
    // more cities than it drew.
    const facets = settled.filter(Boolean);
    if (!facets.length) throw new Error("No city data could be loaded");
    return { facets };
  }
};

async function loadCity(city, country, ctx, signal) {
  // timezone "auto" rather than a baked one: Open-Meteo derives it from the
  // coordinates, which is one fewer field to keep correct in the table and
  // survives a country redrawing its zones.
  const place = {
    id: country.code + ":" + city.name,
    name: city.name, sublabel: country.name, detail: "",
    lat: city.lat, lon: city.lon, timezone: "auto"
  };
  try {
    const { series, band } = await OpenMeteoAdapter.load(place, { signal, ctx });
    return { subject: place, series, band };
  } catch (e) {
    if (e.name === "AbortError") throw e;   // a superseded load must stay aborted
    return null;
  }
}
