    // Centred blocks centre each row on its own width; a left-aligned one keeps
    // every row on the same edge as the rest of the chrome.
    return rows.map((r) => {
      let x = x0 === null ? (W - r.w) / 2 : x0;
      return r.items.map((k) => {
        const placed = { ...k, x };
        x += k.w + gap;
        return placed;
      });
    });
  }

  // ---- notes ------------------------------------------------------------

  // The page's prose, laid out as <text> in a column of `w`. Same five block
  // kinds core/app.js renders as HTML, same order, same words — the blocks come
  // straight from Notes.render rather than being derived a second time here.
  //
  // Returns placed items plus the height the column came to. The height is the
  // point: a section in the download is as tall as its prose when the prose
  // outruns the panel, which is what stops the two overlapping.
  function layoutNote(blocks, w, x0) {
    const T = ctx.theme.type, N = ctx.layout.export.note;
    // Notes have a type ratio of their own, so their sizes and the gaps between
    // them scale together and independently of the chart's labels.
    const n = (v) => v * N.scale;
    const items = [];
    // Where the closing figures start, so a caller with room to spare can drop
    // them to the foot of the column — the page's `margin-top: auto`, which SVG
    // has no equivalent of.
    let tailFrom = -1;
    let y = 0;

    // One run of wrapped text. `y` tracks the bottom edge of what has been
    // placed; a baseline is that edge plus the font's ascent, because SVG text
    // hangs off a baseline and a CSS block does not.
    const run = (text, size, family, cls, leadRatio, top) => {
      // The gaps are between blocks, so the first one in a column starts at its
      // own top edge — otherwise a note hangs lower than the panel beside it by
      // however much its opening block happened to ask for.
      if (items.length) y += n(top);
      const leading = size * leadRatio;
      const lines = ctx.format.wrap(text, w, ctx.format.font(size, family));
      lines.forEach((line, i) => items.push({
        text: line, cls, x: x0, y: y + size * N.ascent + i * leading
      }));
      y += size * N.ascent + (lines.length - 1) * leading + size * N.descent;
    };

    for (const b of blocks) {
      if (b.kind === "eyebrow") {
        // Uppercased here rather than by CSS: text-transform is unevenly
        // applied to <text>, which is why the panel captions do the same.
        run(ctx.format.caps(b.text), n(T.size.meta), T.sans,
          "export-note-eyebrow", N.eyebrowLeading, N.eyebrowTop);
      } else if (b.kind === "head") {
        run(b.text, n(T.size.facet), T.serif, "export-note-head",
          N.headLeading, N.headTop);
      } else if (b.kind === "lede") {
        run(b.text, n(T.size.body), T.sans, "export-note-lede",
          N.proseLeading, N.ledeTop);
      } else if (b.kind === "p") {
        run(b.text, n(T.size.body), T.sans, "export-note-body",
          N.proseLeading, N.paraTop);
      } else if (b.kind === "stats") {
        tailFrom = items.length;
        if (items.length) y += n(N.statsTop);
        for (const item of b.items) {
          const size = n(T.size.notice);
          const meta = ctx.format.font(n(T.size.meta), T.sans);
          items.push({ rule: true, x: x0, y, w });
          y += n(N.statRowTop);
          const base = y + size * N.ascent;
          const label = ctx.format.caps(item.label);
          const labelW = measureText(label, meta);
          const valueW = measureText(item.value, ctx.format.font(size, T.serif));
          const gap = n(N.statGap);
          items.push({ text: label, cls: "export-note-label", x: x0, y: base });
          items.push({
            text: item.value, cls: "export-note-value",
            x: x0 + w, anchor: "end", y: base
          });
          // The qualifier is the first thing to go when a row is too narrow for
          // all three: it names the figure, and the figure survives without it.
          if (item.note
            && labelW + gap + measureText(item.note, meta) + gap + valueW <= w) {
            items.push({
              text: item.note, cls: "export-note-meta",
              x: x0 + w - valueW - gap, anchor: "end", y: base
            });
          }
          y = base + size * N.descent + n(N.statRowBottom);
        }
      } else {
        throw new Error('Unknown note block "' + b.kind + '" in the export');
      }
    }
    return { items, height: y, tailFrom };
  }

  // What a block asks for above itself. The same numbers layoutNote applies
  // between two blocks, named once so a column that has to reproduce that gap
  // across a call boundary cannot quietly pick a different one.
  function noteBlockTop(kind) {
    const N = ctx.layout.export.note;
    const top = { lede: N.ledeTop, p: N.paraTop, stats: N.statsTop }[kind];
    if (top == null) throw new Error('Unknown note block "' + kind + '" in the export');
    return top;
  }

  // A note above a full-width panel: its heading spans the measure and its
  // paragraphs run in columns under it, which is what the page does. Whole
  // paragraphs are dealt into the columns rather than lines being poured
  // through them — a paragraph torn across a fold is harder to read than an
  // uneven column.
  function layoutNoteColumns(blocks, totalW, x0, columns) {
    const gutter = ctx.layout.page.gutter;
    const heads = blocks.filter((b) => b.kind === "eyebrow" || b.kind === "head");
    const flow = blocks.filter((b) => !(b.kind === "eyebrow" || b.kind === "head"));

    const top = layoutNote(heads, totalW, x0);
    const colW = (totalW - (columns - 1) * gutter) / columns;
    const cols = Array.from({ length: columns }, () => []);
    flow.forEach((b, i) => cols[i % columns].push(b));

    // The space under the heading has to be put back by hand here. layoutNote
    // only ever puts a gap *between* blocks, and each column is a fresh call
    // whose first block therefore starts flush at its own top edge — correct
    // inside a column, wrong under a heading the columns are running below.
    // Without this the heading and the first line of prose sit a bare descender
    // apart in a download while the same two are a clear line apart on the page,
    // and only the one section whose note runs above its panel is affected.
    //
    // The gap the *first* block would have asked for, given to every column, so
    // they still start on one line rather than stepping down past each other.
    const lead = top.items.length && flow.length
      ? noteBlockTop(flow[0].kind) * ctx.layout.export.note.scale
      : 0;

    const items = [...top.items];
    let tallest = 0;
    cols.forEach((blocksInCol, i) => {
      const laid = layoutNote(blocksInCol, colW, x0 + i * (colW + gutter));
      laid.items.forEach((it) => items.push({ ...it, y: it.y + top.height + lead }));
      tallest = Math.max(tallest, laid.height);
    });
    return { items, height: top.height + lead + tallest };
  }

  // A single paragraph poured through columns — the standfirst, which is one
  // string rather than blocks. Balanced rather than filled: two columns of four
  // lines read better than one of seven beside one of one.
  function flowLines(lines, columns) {
    const perCol = Math.ceil(lines.length / columns);
    return Array.from({ length: columns },
      (_, i) => lines.slice(i * perCol, (i + 1) * perCol));
  }

  const noteFor = (panelId) => notes.find((n) => n.panel === panelId);

  // Vertical rhythm is explicit, in the same order as the page — an export
  // cannot rely on DOM flow for its sequence. Every gap comes from
  // layout.export; nothing is measured off the page.
  function measure(descRowCount, titleLineCount) {
    const E = ctx.layout.export, T = ctx.theme.type;
    const panels = ctx.panels.map((p) => ({ id: p.id, ...ctx.layout.canvas[p.id] }));
    const W = canvasWidth();

    const leading = s(T.exportLeading);
    // A wrapped title pushes everything under it down. Every measure below is
    // stated relative to `subtitleY` rather than to the constant, so a two-line
    // headline moves the whole page instead of landing on its own subtitle.
    const subtitleY = s(E.subtitleY) + Math.max(0, titleLineCount - 1) * s(E.titleLeading);
    const descriptionTop = subtitleY + s(E.descriptionGap);
    const legendTop = descriptionTop + descRowCount * leading + s(E.descriptionGapAfter);
    const barY = legendTop + s(E.legendBarGap);
    const tickY = barY + s(E.barH) + s(E.tickGap);

    // Inline keys sit beside the ramp instead of under it, so the legend ends
    // at its ticks and everything below moves up by a whole row.
    const inline = E.keysInline;

    // One anchor for every piece of chrome, so a left-aligned page cannot
    // download as a centred one. `flush` is the x each block starts from when
    // anchored left; centred blocks each have their own centre.
    const left = E.align.anchor === "start";
    const flush = E.align.inset;
    const flushRight = E.align.insetRight;

    const inlineGap = s(E.keysInlineGap);
    const sizedKeys = sizeKeys(
      legendModel ? legendModel.keys : [], ctx.format.font(s(T.size.body), T.sans));

    // Beside the ramp, the legend is one object: ramp, gap, keys. The keys
    // cannot shrink, so the ramp is what gives — it takes whatever is left,
    // down to barMinW, rather than holding a fixed width the keys then have to
    // wrap under. That is what keeps the whole legend on one line when the type
    // ramp grows or a chart adds a fourth key, with no width to re-tune here.
    // A centred legend has no inset to sit inside, so it keeps one gap clear on
    // each side rather than running to the canvas edge.
    const side = left ? flush : inlineGap;
    const room = W - side - (left ? flushRight : side) - inlineGap;
    // No upper cap: the ramp takes everything the keys leave, so the legend
    // spans the full measure instead of ending somewhere short of the chart it
    // explains. `barW` is the width for stacked keys, which have no keys beside
    // them to size against.
    const barW = inline
      ? Math.max(E.barMinW, room - rowWidth(sizedKeys, inlineGap))
      : E.barW;

    // Centred means the whole block is centred, not the ramp — with the keys
    // hanging off its right edge, a centred ramp puts them past the canvas.
    const blockW = inline ? barW + inlineGap + rowWidth(sizedKeys, inlineGap) : barW;
    const barX = left ? flush : Math.max(side, (W - blockW) / 2);

    // keysTop is the key row's own top edge, not a baseline: inline keys centre
    // on the legend block, stacked ones hang a fixed drop below the ticks.
    const keyRows = layoutKeys(
      sizedKeys,
      inline ? barX + barW + inlineGap : (left ? flush : null),
      W - (left ? flushRight : side),
      W
    );
    const extraRows = Math.max(0, keyRows.length - 1);
    const keysTop = inline
      ? (legendTop + tickY) / 2 - s(E.keyLabel.y) / 2 - extraRows * leading / 2
      : tickY + s(E.keysGap) - s(E.keysRise);
    const keysBottom = keysTop + extraRows * leading + s(E.keyLabel.y);
    const legendBottom = inline ? Math.max(tickY, keysBottom) : keysBottom;

    // Where the widest plot stops. A note column runs out to it, so the
    // download keeps the page's right edge rather than growing one of its own.
    const storyW = W - flushRight;
    const gutter = ctx.layout.page.gutter;

    let cursor = legendBottom + s(E.panelLeadGap);
    const placed = panels.map((p, i) => {
      const top = cursor + (i ? s(E.panelGap) : 0);
      const note = noteFor(p.id);

      if (!note) {
        cursor = top + p.h;
        return { ...p, top, x: 0 };
      }

      if (note.side === "above") {
        const laid = layoutNoteColumns(
          note.blocks, storyW - flush, flush, note.columns || 1);
        const panelTop = top + laid.height + s(E.noteGap);
        cursor = panelTop + p.h;
        return { ...p, top: panelTop, x: 0, note: { ...laid, top } };
      }

      // Beside it, on the side the page puts it. The panel keeps its own canvas
      // width, so the note takes whatever is left of the measure — the same
      // arithmetic the page grid does, from the same two numbers.
      const noteW = storyW - p.w - gutter;
      const left = note.side === "start";
      const laid = layoutNote(note.blocks, noteW, left ? 0 : p.w + gutter);

      // Prose and graphic end on one line, as they do on the page: the section
      // is as tall as the taller of the two, and whatever slack that leaves the
      // note goes above its closing figures rather than below them.
      const slack = Math.max(0, p.h - laid.height);
      const items = slack && laid.tailFrom >= 0
        ? laid.items.map((it, i) => (i >= laid.tailFrom ? { ...it, y: it.y + slack } : it))
        : laid.items;

      cursor = top + Math.max(p.h, laid.height);
      return { ...p, top, x: left ? noteW + gutter : 0, note: { items, top } };
    });

    const datasourceTop = cursor + s(E.sourceGap);
    const hasSig = !!ctx.config.signature;
    const sigY = datasourceTop + s(E.signatureGap);

    return {
      W, titleY: s(E.titleY), subtitleY, titleLeading: s(E.titleLeading),
      descriptionTop, legendTop, leading,
      textAnchor: E.align.anchor, textX: left ? flush : W / 2,
      barY, barH: s(E.barH), barW, barX,
      tickY, keysTop, keyRows,
      panels: placed, datasourceTop, hasSig, sigY,
      totalH: (hasSig ? sigY : datasourceTop) + s(E.bottomPad)
    };
  }

  // The panels decide the canvas width, so it is knowable before anything is
  // laid out — which is what lets the title be wrapped to it and the wrapped
  // line count then fed back into measure().
  const canvasWidth = () => Math.max(...ctx.panels.map((p) => ctx.layout.canvas[p.id].w));

  // How wide a line of chrome may run. A left-aligned page starts at its inset
  // and stops where its panels stop; a centred one keeps one gap clear at each
  // edge, the same way the legend does.
  function textMeasure() {
    const E = ctx.layout.export;
    const W = canvasWidth();
    return E.align.anchor === "start"
      ? W - E.align.inset - E.align.insetRight
      : W - 2 * s(E.keysInlineGap);
  }

  // One line, set down until it fits — see layout.export.titleMinScale. The
  // fallback wrap is balanced: a headline that has to take two lines should
  // split them evenly rather than hanging one word under a full one.
  function fitTitle(text) {
    const T = ctx.theme.type, E = ctx.layout.export;
    const full = s(T.size.title);
    const measure = textMeasure();
    const font = ctx.format.font(full, T.serif);
    const w = measureText(text, font);
    if (w <= measure) return { lines: [text], size: full };
    const fitted = full * (measure / w);
    if (fitted >= full * E.titleMinScale) return { lines: [text], size: fitted };
    return { lines: wrapBalanced(text, measure, font), size: full };
  }

  function build() {
    const T = ctx.theme.type;
    const title = fitTitle(Dom.byId("title").textContent.trim());
    const titleLines = title.lines;
    // The standfirst wraps to whatever column the page runs it in: one column
    // at the prose measure, or the full measure split in two. Same width here
    // as there, so the paragraph breaks at the same words in both.
    const D = ctx.layout.export.description;
    const descCols = D.columns;
    const gutter = ctx.layout.page.gutter;
    const descTotal = D.width === "measure" ? textMeasure() : ctx.layout.page.prose;
    const descColW = (descTotal - (descCols - 1) * gutter) / descCols;
    const descLines = ctx.format.wrap(
      Dom.byId("description").textContent.trim(),
      descColW,
      // The scaled size, not the page's: measuring at 12px and drawing at 16
      // would overrun the measure by a third of a line on every line.
      ctx.format.font(s(T.size.body), T.sans)
    );
    const descColumns = flowLines(descLines, descCols);
    const L = measure(descColumns[0].length, titleLines.length);

    // No explicit xmlns: svgEl() creates in the SVG namespace, and the
    // serializer emits the declaration from that. Setting it as an attribute
    // as well produced `xmlns=... xmlns=...` — a duplicate attribute name,
    // which is fatal to an XML parser, so the downloaded .svg was not
    // well-formed even though a lenient browser still drew it.
    // A download is a picture, not a page: it gets pasted onto a slide, a
    // README, a feed, and content running to the file's edge reads as cropped.
    // So the canvas is the chart plus a margin on every side, and everything
    // below is drawn inside a group inset by it — one translate, rather than
    // `pad +` on every coordinate in this file.
    const pad = ctx.layout.export.pad;
    const totalW = L.W + 2 * pad, totalH = L.totalH + 2 * pad;

    const out = svgEl("svg", {
      viewBox: "0 0 " + totalW + " " + totalH,
      width: totalW, height: totalH, role: "img"
    });
    // A downloaded file has no surrounding page to inherit an accessible name.
    out.appendChild(svgEl("title", {}, ctx.copy.exportTitle(Dom.byId("title").textContent)));
    out.appendChild(svgEl("rect", { width: totalW, height: totalH, fill: ctx.theme.color.paper }));
    out.appendChild(svgEl("style", {}, ctx.style.exportRules()));

    const art = svgEl("g", { transform: "translate(" + pad + "," + pad + ")" });
    out.appendChild(art);

    const lead = { x: L.textX, "text-anchor": L.textAnchor };
    // The fitted size is inline because it is per-render: the class carries the
    // ceiling, this carries what this subject's name actually left room for.
    const titleEl = svgEl("text", {
      ...lead, class: "export-title",
      style: "font-size:" + title.size.toFixed(2) + "px"
    });
    titleLines.forEach((line, i) => titleEl.appendChild(
      svgEl("tspan", { x: L.textX, y: L.titleY + i * L.titleLeading }, line)));
    art.appendChild(titleEl);

    art.appendChild(svgEl("text", { ...lead, y: L.subtitleY, class: "export-subtitle" },
      Dom.byId("subtitle").textContent));

    descColumns.forEach((lines, col) => {
      const x = L.textX + col * (descColW + gutter);
      const desc = svgEl("text",
        { class: "export-description", "text-anchor": L.textAnchor });
      lines.forEach((line, i) => desc.appendChild(
        svgEl("tspan", { x, y: L.descriptionTop + i * L.leading }, line)));
      art.appendChild(desc);
    });

    appendLegend(art, L);
    L.panels.forEach((p) => {
      if (p.note) appendNote(art, p.note);
      appendPanel(art, p.id, p.top, p.x);
    });

    art.appendChild(svgEl("text", { ...lead, y: L.datasourceTop, class: "export-datasource" },
      Dom.byId("datasource").textContent));
    if (L.hasSig) {
      art.appendChild(svgEl("text", { ...lead, y: L.sigY, class: "export-signature" },
        ctx.copy.signature(ctx.config.signature)));
    }
    return { node: out, width: totalW, height: totalH };
  }

  function appendLegend(out, L) {
    if (!legendModel) return;
    const E = ctx.layout.export;
    const { stops, tickVals } = legendModel;

    out.appendChild(svgEl("text",
      { x: L.textX, y: L.legendTop, "text-anchor": L.textAnchor, class: "export-legend-cap" },
      ctx.copy.legend.cap));

    const gradId = "export-legend-grad";
    const grad = svgEl("linearGradient", { id: gradId, x1: "0", x2: "1", y1: "0", y2: "0" });
    stops.forEach((c, i) => grad.appendChild(
      svgEl("stop", { offset: (i / (stops.length - 1) * 100) + "%", "stop-color": c })));
    out.appendChild(grad);
    out.appendChild(svgEl("rect", {
      x: L.barX, y: L.barY, width: L.barW, height: L.barH,
      rx: s(E.barRadius), fill: "url(#" + gradId + ")"
    }));

    tickVals.forEach((v, i) => out.appendChild(svgEl("text", {
      x: L.barX + i / (tickVals.length - 1) * L.barW, y: L.tickY,
      "text-anchor": i === 0 ? "start" : i === tickVals.length - 1 ? "end" : "middle",
      class: "export-legend-tick"
    }, ctx.format.num(v))));

    L.keyRows.forEach((row, r) => {
      const y = L.keysTop + r * L.leading;
      row.forEach((k) => {
        const g = svgEl("g", { transform: "translate(" + k.x + "," + y + ")" });
        g.appendChild(k.kind === "dash"
          ? svgEl("line", {
              x1: 0, y1: s(E.keyLine.y), x2: s(E.keyLine.w), y2: s(E.keyLine.y), stroke: k.color,
              "stroke-width": k.width, "stroke-dasharray": k.dash
            })
          : svgEl("rect", {
              width: s(E.keySwatch.w), height: s(E.keySwatch.h), fill: k.color,
              ...(k.border ? { stroke: k.border, "stroke-width": ctx.theme.stroke.hub.width } : {})
            }));
        g.appendChild(svgEl("text",
          { x: s(E.keyLabel.x), y: s(E.keyLabel.y), class: "export-legend-key" }, k.label));
        out.appendChild(g);
      });
    });
  }

  function appendPanel(out, id, top, x = 0) {
    const g = svgEl("g", { transform: "translate(" + x + ", " + top + ")" });
    Array.from(Dom.byId(id).childNodes).forEach((n) => g.appendChild(n.cloneNode(true)));
    out.appendChild(g);
  }

  // Drawn before its panel, so a rule can never land over a mark. Every item
  // carries its own absolute position from layoutNote; only the block's own top
  // offset is added here.
  function appendNote(out, note) {
    const rule = ctx.theme.stroke.rowDivider;
    for (const it of note.items) {
      if (it.rule) {
        out.appendChild(svgEl("line", {
          x1: it.x, x2: it.x + it.w, y1: note.top + it.y, y2: note.top + it.y,
          stroke: rule.color, "stroke-width": rule.width
        }));
        continue;
      }
      out.appendChild(svgEl("text", {
        x: it.x, y: note.top + it.y, class: it.cls,
        ...(it.anchor ? { "text-anchor": it.anchor } : {})
      }, it.text));
    }
  }

  const XML_DECL = '<?xml version="1.0" standalone="no"?>\n';

  // A data: URI, not blob: — sandboxed iframes commonly allow blob: for an
  // <a download> but block it as an <img> src, and PNG rasterisation needs the
  // SVG loaded into an <img>.
  function dataUri(node) {
    const xml = new XMLSerializer().serializeToString(node);
    return "data:image/svg+xml;base64,"
      + btoa(unescape(encodeURIComponent(XML_DECL + xml)));
  }

  const slug = (subject) => ((subject && subject.name) || "chart")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-");
  const filename = (subject, ext) => slug(subject) + "-" + ctx.id + "." + ext;

  // The requested pixel density, or as much of it as a canvas will actually
  // take. Past a browser's limits canvas allocation fails silently — a blank
  // image or a null blob, no exception — so the ceiling is respected here
  // rather than discovered in a downloaded file. Never below 1: a downsampled
  // PNG is worse than the SVG it came from.
  function pngScale(width, height) {
    const E = ctx.layout.export;
    return Math.max(1, Math.min(
      E.pngScale,
      E.pngMaxSide / width,
      E.pngMaxSide / height,
      Math.sqrt(E.pngMaxPixels / (width * height))
    ));
  }

  function download(href, name) {
    const a = document.createElement("a");
    a.href = href; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  return {
    setLegend(model) { legendModel = model; },
    // Only a note tied to a panel reaches a download; a page-only one — the
    // kicker over the headline — declares no panel and is skipped.
    setNotes(placed) { notes = placed.filter((n) => n.panel); },
    build,

    downloadSVG(subject) {
      const { node } = build();
      const xml = new XMLSerializer().serializeToString(node);
      const url = URL.createObjectURL(new Blob([XML_DECL + xml], { type: "image/svg+xml" }));
      download(url, filename(subject, "svg"));
      URL.revokeObjectURL(url);
    },

    downloadPNG(subject) {
      const { node, width, height } = build();
      const img = new Image();
      img.onload = () => {
        const scale = pngScale(width, height);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        const c = canvas.getContext("2d");
        c.scale(scale, scale);
        c.fillStyle = ctx.theme.color.paper;
        c.fillRect(0, 0, width, height);
        c.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          download(url, filename(subject, "png"));
          URL.revokeObjectURL(url);
        }, "image/png");
      };
      img.onerror = () => alert(ctx.copy.pngFailed);
      img.src = dataUri(node);
    }
  };
}

/* ===== core/app.js ===== */
// The shell: the only stateful part of a chart. Owns the current subject, the
// in-flight request, and the wiring between components.
//
// A chart definition (charts/<id>/chart.js) is data:
//   { id, config, theme, layout, copy, format, adapter, panels, model,
//     controls, notes, regions }
//
// createApp resolves it into a frozen ctx and hands the same object to every
// component, so nothing reaches for a global and two charts can run different
// themes without either knowing the other exists.
//
// Four sections: the shell itself, then the page furniture, legend and subject
// picker it drives. They were separate files; nothing else ever imported them.






// ---------------------------------------------------------------- shell

function createApp(chart) {
  const theme = makeTheme(chart.theme);
  const format = makeFormat(chart.format);

  // Each panel contributes its geometry defaults under its layout key, so a
  // chart states only what it moves.
  const layout = makeLayout(chart.layout);
  for (const p of chart.panels) {
    layout[p.layoutKey] = deepMerge(p.defaults || {}, layout[p.layoutKey]);
  }

  const ctx = Object.freeze({
    id: chart.id,
    config: chart.config,
    theme, layout, format,
    copy: chart.copy,
    panels: chart.panels,
    // Prose the chart writes from its own data, and the page regions that
    // exist only while there is a chart to put in them. Both default to
    // nothing, so a chart that is only panels declares neither.
    notes: Object.freeze(chart.notes || []),
    regions: Object.freeze(chart.regions || []),
    style: makeStyle(theme, layout)
  });

  const adapter = chart.adapter;
  const exporter = makeExporter(ctx);
  // A chart may build a different shape of model — small multiples need one
  // shared domain across many series, which a single range model cannot hold.
  const buildModel = chart.buildModel || buildRangeModel;

  let subject = null;
  let inflight = null;
  let picker = null;
  let controls = [];

  // Sized before the first fetch, so the page reserves the chart height while
  // loading instead of jumping when data lands.
  function sizeCanvas(p) {
    const c = ctx.layout.canvas[p.id];
    if (!c) throw new Error('No layout.canvas entry for panel "' + p.id + '"');
    Dom.byId(p.id).setAttribute("viewBox", "0 0 " + c.w + " " + c.h);
  }

  function sizeCanvases() {
    for (const p of chart.panels) sizeCanvas(p);
  }

  // Every control is disabled together while a load is in flight: two of them
  // changed in the time one request takes would leave the page showing the
  // result of whichever landed last, not whichever was asked for last.
  function setControlsBusy(busy) {
    if (picker) picker.setBusy(busy);
    for (const c of controls) if (c.setBusy) c.setBusy(busy);
  }

  function setExportsEnabled(on) {
    Dom.byId("downloadBtn").disabled = !on;
    Dom.byId("downloadPngBtn").disabled = !on;
  }

  function render(model) {
    EmptyState.hide(ctx);
    Header.render(model, ctx);
    exporter.setLegend(Legend.render(model, ctx));
    for (const p of chart.panels) {
      // A panel whose size depends on the data — a small-multiples stack has
      // one row per subject — restates it here. Written back to layout.canvas
      // rather than only onto the element, because the exporter measures from
      // that entry and would otherwise lay out against the boot-time height.
      if (p.measure) Object.assign(ctx.layout.canvas[p.id], p.measure(model, ctx));
      sizeCanvas(p);
      p.render(d3.select("#" + p.id), model, ctx);
    }
    exporter.setNotes(Notes.render(model, ctx));
    Footer.render(ctx);
  }

  async function load(next) {
    // Supersede any request still running: switching subject quickly must not
    // let an earlier response overwrite a later one.
    if (inflight) inflight.abort();
    const ctrl = new AbortController();
    inflight = ctrl;

    subject = next;
    Header.setLoading(next.name, ctx);
    setExportsEnabled(false);
    setControlsBusy(true);

    try {
      // Passed through whole, so an adapter can return { series, band } or
      // { facets } without the shell knowing which shape it is.
      const data = await adapter.load(next, { signal: ctrl.signal, ctx });
      if (ctrl.signal.aborted) return;

      render(buildModel({ ...data, subject: next, ...(chart.model || {}) }));
      setExportsEnabled(true);
    } catch (e) {
      if (e.name === "AbortError" || ctrl.signal.aborted) return;
      EmptyState.show(next, e.message, ctx);
    } finally {
      if (inflight === ctrl) inflight = null;
      setControlsBusy(false);
    }
  }

  async function start(query) {
    Header.setLoading(query, ctx);
    setExportsEnabled(false);
    try {
      const resolved = await adapter.resolve(query, { ctx });
      if (picker) picker.setValue(ctx.format.subjectLabel(resolved));
      await load(resolved);
    } catch (e) {
      EmptyState.show({ name: query, sublabel: "" }, e.message, ctx);
    }
  }

  return {
    init() {
      ctx.style.install();
      sizeCanvases();

      const mount = Dom.byId("subjectpicker");
      if (adapter.search && mount) {
        picker = SubjectPicker(mount, { adapter, onSelect: load, ctx });
      } else if (mount) {
        mount.remove();     // no search means no picker, not a dead control
      }

      // A chart may add controls of its own beside the subject picker: a
      // period, a variant, a threshold. They get `reload` rather than a
      // subject, because what they change is something the adapter reads at
      // load time — the subject has not moved, only the question asked about
      // it. A missing mount is a startup error, not a control that quietly
      // never appears.
      for (const control of chart.controls || []) {
        const el = Dom.byId(control.mount);
        if (!el) throw new Error('No element "#' + control.mount + '" for a declared control');
        const handle = control.create(el, { ctx, reload() { if (subject) load(subject); } });
        if (handle) controls.push(handle);
      }

      // Closing the picker before an export is belt-and-braces: the exporter
      // never clones #controls, so the menu cannot reach a download anyway.
      // This just avoids exporting while a panel floats over the chart.
      const exportWith = (fn) => () => {
        if (!subject) return;
        if (picker) picker.close();
        fn(subject);
      };
      Dom.byId("downloadBtn")
        .addEventListener("click", exportWith((s) => exporter.downloadSVG(s)));
      Dom.byId("downloadPngBtn")
        .addEventListener("click", exportWith((s) => exporter.downloadPNG(s)));

      // ?subject= always works; a chart may claim a friendlier alias too.
      const params = new URLSearchParams(location.search);
      const alias = ctx.config.queryParam;
      start(params.get("subject") || (alias && params.get(alias)) || ctx.config.subject);
    }
  };
}

// ---------------------------------------------------------------- chrome

// Page furniture: header, footer, and the empty state that replaces the chart
// when there is nothing to draw. Wording lives in a chart copy.js; these place
// it. All three text roles derive from the current subject and the series
// actually returned, so switching subject cannot leave a stale name on screen.
const Header = {
  titleFor: (subject, ctx) => ctx.config.title || ctx.copy.title(subject, ctx),

  // The lead is prepended to whichever description is in use, so a custom
  // --caption never hides an explanation the reader needs. Optional: it exists
  // to introduce an element some charts do not draw, and an empty string in
  // every chart that lacks one is a key that has to be remembered rather than
  // a decision anyone made.
  descriptionFor: (model, ctx) =>
    (ctx.copy.lead ? ctx.copy.lead(model, ctx) : "")
    + (ctx.config.caption || ctx.copy.howToRead(model, ctx)),

  render(model, ctx) {
    const title = this.titleFor(model.subject, ctx);
    Dom.byId("title").textContent = title;
    Dom.byId("subtitle").textContent = ctx.copy.subtitle(model, ctx);
    Dom.byId("description").textContent = this.descriptionFor(model, ctx);
    document.title = title;      // the browser tab goes stale just as visibly
  },

  setLoading(label, ctx) {
    Dom.byId("subtitle").textContent = ctx.copy.loading(label);
  }
};

// ---------------------------------------------------------------- notes

// Prose a chart writes from the data it just drew: a note beside a panel, a
// standfirst, a method line. Declared like a control — a mount and a function —
// and rendered after the panels, so a sentence and the marks it describes come
// out of the same model on the same load. Nothing here knows any words.
//
//   notes: [{ mount: "note-rank", blocks: (model, ctx) => [ ... ] }]
//
// `blocks` returns data, not markup, and the shell owns the elements and the
// classes. That is deliberate: a note is written from values that arrived over
// the network — a city name, a country name — and a subject called
// "<img onerror=...>" must not become an element. Every string below is set
// with textContent, so it cannot.
const Notes = {
  // Returns what it placed, the way Legend.render returns its model: the
  // exporter draws the same blocks into the download, and re-deriving them
  // there would let the page and the file say different things about one load.
  render(model, ctx) {
    const placed = [];
    for (const note of ctx.notes) {
      const mount = Dom.byId(note.mount);
      if (!mount) throw new Error('No element "#' + note.mount + '" for a declared note');
      const blocks = note.blocks(model, ctx);
      mount.replaceChildren();
      for (const block of blocks) {
        const build = NOTE_BLOCKS[block.kind];
        if (!build) throw new Error('Unknown note block "' + block.kind + '"');
        mount.appendChild(build(block));
      }
      placed.push({ ...note, blocks });
    }
    return placed;
  },

  // A note is only true of the model it was written from. When that model is
  // gone, so is the note — otherwise a failed load leaves last country's
  // sentences sitting under this country's headline.
  clear(ctx) {
    for (const note of ctx.notes) {
      const mount = Dom.byId(note.mount);
      if (mount) mount.replaceChildren();
    }
  }
};

const noteEl = (tag, cls, text) => {
  const el = document.createElement(tag);
  el.className = cls;
  if (text != null) el.textContent = text;
  return el;
};

// The block vocabulary. Small on purpose: a note is a column of running text
// with a heading and, sometimes, the two or three numbers the text turns on.
// Anything a chart cannot say with these belongs in a panel, not in prose.
const NOTE_BLOCKS = {
  eyebrow: (b) => noteEl("p", "nt-eyebrow", b.text),
  head: (b) => noteEl("h2", "nt-head", b.text),
  p: (b) => noteEl("p", "nt-p", b.text),
  // One sentence set larger than the rest: the finding the section is about.
  lede: (b) => noteEl("p", "nt-lede", b.text),
  // The numbers pulled out of the prose, so a reader who skims still gets them.
  stats: (b) => {
    const dl = noteEl("dl", "nt-stats");
    for (const item of b.items) {
      // Label, then the qualifier that names it, then the figure — one line,
      // reading left to right with the number flush right where a column of
      // them can be compared.
      const row = noteEl("div", "nt-stat");
      row.appendChild(noteEl("dt", "nt-stat-label", item.label));
      if (item.note) row.appendChild(noteEl("dd", "nt-stat-note", item.note));
      row.appendChild(noteEl("dd", "nt-stat-value", item.value));
      dl.appendChild(row);
    }
    return dl;
  }
};

const Footer = {
  render(ctx) {
    Dom.byId("datasource").textContent = ctx.copy.dataSource;
    this.renderSignature(ctx);
  },

  // .html(), not .text(): on the page the byline is a real link. The export
  // flattens it to plain text — a static file has nothing to click.
  renderSignature(ctx) {
    const sig = d3.select("#signature");
    const s = ctx.config.signature;
    if (s) {
      sig.html("Created by " + s.name + " · "
        + '<a href="https://' + s.url + '" target="_blank" rel="noopener">' + s.url + "</a>");
    } else {
      sig.text("");
    }
  },

  clearSource() { Dom.byId("datasource").textContent = ""; }
};

// No data means no chart. There is no synthetic fallback anywhere in this
// codebase: a ring of generated numbers looks exactly like a real one, and the
// reader has no way to tell it is fiction.
const EmptyState = {
  show(subject, reason, ctx) {
    const title = Header.titleFor(subject, ctx);
    Dom.byId("title").textContent = title;
    document.title = title;
    Dom.byId("subtitle").textContent = "";
    Dom.byId("description").textContent = "";
    Footer.clearSource();
    Notes.clear(ctx);
    emptyRegions(ctx).forEach(Dom.hide);
    const nd = Dom.byId("nodata");
    nd.querySelector(".nd-head").textContent = ctx.copy.empty.head;
    nd.querySelector(".nd-body").textContent = ctx.copy.empty.body(subject, reason, ctx);
    Dom.show("nodata");
    Footer.renderSignature(ctx);
  },

  // Must run before every successful render: a subject that failed leaves the
  // chart hidden, and the next one that works has to put it back.
  hide(ctx) {
    Dom.hide("nodata");
    emptyRegions(ctx).forEach(Dom.show);
  }
};

// The legend and the panels always go. `regions` is for the furniture a page
// builds around them — a section heading, a rule, the column a note sits in —
// which has nothing to say once the panels are hidden.
const emptyRegions = (ctx) =>
  ["legend", ...ctx.panels.map((p) => p.id), ...ctx.regions];

// ---------------------------------------------------------------- legend

// Colour ramp plus a key row. HTML/CSS rather than SVG so it reflows with the
// page; returns its model so the exporter can rebuild it as real SVG.
//
// Mount contract (see a chart page.html):
//   #legend .lg-cap   #colorbar   #colorticks   #legend .lg-keys

const Legend = {
  render(model, ctx) {
    const { layout: L, copy: C, format: F } = ctx;
    const G = L.legend;
    // The ramp is not always the value axis. A chart can place its marks on one
    // quantity and colour them by another — an absolute temperature for where a
    // bar sits, its departure from normal for what colour it is — and then the
    // legend has to describe the second one. `model.ramp` says what the ramp
    // actually spans; a model without one is coloured by its own values, which
    // is the case every chart here started from.
    const R = model.ramp
      || { min: model.dataMin, max: model.dataMax, colour: model.colour };
    const at = (u) => R.min + u * (R.max - R.min);
    const stops = d3.range(0, 1.0001, 1 / G.gradientSteps).map((u) => R.colour(at(u)));
    const tickVals = d3.range(0, 1.0001, 1 / G.tickSteps).map(at);

    d3.select("#legend .lg-cap").text(C.legend.cap);
    d3.select("#colorbar").style("background", `linear-gradient(to right, ${stops.join(",")})`);
    const ticks = d3.select("#colorticks");
    ticks.html("");
    tickVals.forEach((v) => ticks.append("span").text(F.num(v)));

    const keys = this.keyDefs(model, ctx);
    const keyRow = d3.select(".lg-keys");
    keyRow.html("");
    keys.forEach((k) => {
      const swatch = k.kind === "dash"
        ? `<svg width="${G.keyLine.w}" height="${G.keyLine.h}">`
          + `<line x1="0" y1="${G.keyLine.h / 2}" x2="${G.keyLine.w}" y2="${G.keyLine.h / 2}"`
          + ` stroke="${k.color}" stroke-width="${k.width}" stroke-dasharray="${k.dash}"/></svg>`
        : `<span class="swatch"></span>`;
      keyRow.append("span").attr("class", "key").html(`${swatch} ${k.label}`);
    });

    return { stops, tickVals, keys };
  },

  // Shared with the exporter, which draws the same keys as SVG. It sizes each
  // one from the label itself, so there is no per-key width to state here.
  keyDefs(model, { theme: T, copy: C }) {
    const S = T.stroke;
    const keys = [
      { label: C.legend.medHigh, kind: "dash", ...S.medianHigh },
      { label: C.legend.medLow, kind: "dash", ...S.medianLow }
    ];
    if (model.hasBand) {
      keys.push({
        label: C.legend.band(model), kind: "swatch",
        color: T.color.bandFill, border: T.color.bandStroke
      });
    }
    return keys;
  }
};

// ---------------------------------------------------------------- subject picker

// A searchable combobox over whatever an adapter can look up: cities, tickers,
// repositories. Mounted only when the adapter exposes search(), so a chart with
// a fixed subject gets nothing rather than a control that cannot work.

function SubjectPicker(mount, { adapter, onSelect, ctx }) {
  const C = ctx.copy.search, F = ctx.format;

  mount.innerHTML = [
    '<label class="cs-label" for="cs-input">' + C.label + "</label>",
    '<div class="cs-shell">',
    '  <input id="cs-input" class="cs-input" type="text" autocomplete="off"',
    '         role="combobox" aria-expanded="false" aria-controls="cs-list"',
    '         aria-autocomplete="list" placeholder="' + C.placeholder + '">',
    '  <ul id="cs-list" class="cs-list" role="listbox" hidden></ul>',
    '  <p class="cs-status" role="status" aria-live="polite"></p>',
    "</div>"
  ].join("\n");

  const input = mount.querySelector(".cs-input");
  const list = mount.querySelector(".cs-list");
  const status = mount.querySelector(".cs-status");

  let results = [];
  let active = -1;
  let debounce = null;
  let inflight = null;

  const close = () => {
    list.hidden = true;
    list.innerHTML = "";
    input.setAttribute("aria-expanded", "false");
    input.removeAttribute("aria-activedescendant");
    results = []; active = -1;
  };

  const paint = () => {
    list.innerHTML = "";
    results.forEach((s, i) => {
      const li = document.createElement("li");
      li.id = "cs-opt-" + i;
      li.className = "cs-option" + (i === active ? " is-active" : "");
      li.setAttribute("role", "option");
      li.setAttribute("aria-selected", String(i === active));
      // textContent, not innerHTML: a subject name arrives from a remote lookup
      // and markup in it must not become markup here.
      const name = document.createElement("span");
      name.className = "cs-name";
      name.textContent = s.name;
      const meta = document.createElement("span");
      meta.className = "cs-meta";
      meta.textContent = [s.detail, s.sublabel].filter(Boolean).join(", ");
      li.append(name, meta);
      // mousedown, not click: click fires after blur, which would already have
      // closed the list out from under the pointer.
      li.addEventListener("mousedown", (e) => { e.preventDefault(); choose(i); });
      list.appendChild(li);
    });
    list.hidden = results.length === 0;
    input.setAttribute("aria-expanded", String(results.length > 0));
    if (active >= 0) input.setAttribute("aria-activedescendant", "cs-opt-" + active);
    else input.removeAttribute("aria-activedescendant");
  };

  const choose = (i) => {
    const subject = results[i];
    if (!subject) return;
    input.value = F.subjectLabel(subject);
    close();
    input.blur();
    onSelect(subject);
  };

  const search = async (q) => {
    if (inflight) inflight.abort();
    inflight = new AbortController();
    status.textContent = "";
    try {
      const found = await adapter.search(q, {
        limit: ctx.config.searchLimit, signal: inflight.signal
      });
      results = found;
      active = found.length ? 0 : -1;
      paint();
      status.textContent = found.length ? C.matches(found.length) : C.none;
    } catch (e) {
      if (e.name === "AbortError") return;      // superseded by a later keystroke
      close();
      status.textContent = C.failed;
    }
  };

  input.addEventListener("input", () => {
    const q = input.value;
    clearTimeout(debounce);
    if (!q.trim()) { close(); status.textContent = ""; return; }
    debounce = setTimeout(() => search(q), ctx.config.searchDebounceMs);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!results.length) return;
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length;
      paint();
    } else if (e.key === "Enter") {
      if (active >= 0) { e.preventDefault(); choose(active); }
    } else if (e.key === "Escape") {
      close();
    }
  });

  input.addEventListener("focus", () => { if (results.length) paint(); });
  // mousedown again: the open panel overlaps the download buttons, so closing
  // on click would let the panel swallow the press and the button never see it.
  document.addEventListener("mousedown", (e) => { if (!mount.contains(e.target)) close(); });

  return {
    close,
    setBusy(busy) { input.disabled = busy; },
    setValue(label) { input.value = label; }
  };
}

// ---------------------------------------------------------------- option picker

// A labelled <select> over a fixed list, for a chart control whose choices are
// all known before the page opens — a month, a window, a variant.
//
// Native, where SubjectPicker is a combobox built by hand. That is not
// inconsistency: a searchable list over a remote source has to be rebuilt,
// because no native control can filter as you type against something it cannot
// see. A closed list of twenty-four months has no such problem, and a <select>
// brings its own keyboard handling, its own screen-reader semantics and, on a
// phone, the platform's own picker — all of which a rebuilt one would have to
// re-earn and would get subtly wrong.

function OptionPicker(mount, { id = "op-select", label, options, value, onSelect }) {
  mount.innerHTML = "";

  const lab = document.createElement("label");
  lab.className = "cs-label";
  lab.setAttribute("for", id);
  lab.textContent = label;

  const select = document.createElement("select");
  select.id = id;
  select.className = "op-select";
  for (const o of options) {
    const opt = document.createElement("option");
    opt.value = o.value;
    // textContent, not innerHTML: an option label is derived from data, and
    // markup in it must not become markup here.
    opt.textContent = o.label;
    select.appendChild(opt);
  }
  if (value != null) select.value = value;
  select.addEventListener("change", () => onSelect(select.value));

  mount.append(lab, select);

  return {
    setBusy(busy) { select.disabled = busy; },
    setValue(v) { select.value = v; },
    value() { return select.value; }
  };
}

/* ===== generated wiring ===== */
Object.assign(chart.config, {"subject":"Tokyo"});
createApp(chart).init();

})();
</script>
